# Full DP-DPO run for opaque-alignment on JetBrains/Mellum-4b-base (Llama
# arch, transformers 4.57.x compatible) + zed-industries/zeta (Next Edit
# Prediction, 132 DPO pairs in the ``dpo`` split). Precomputes reference
# logps, then trains through the per-example vmap DP-SGD path with
# DPO_LOSSES["sigmoid"]. The example loader remaps Zeta's
# (events, input, output, rejected) to (prompt, chosen, rejected).
#
# Mellum2 (12B MoE) was the original target but its custom MellumForCausalLM
# architecture is gated on transformers≥5.10, while the project pins
# transformers<5 for opaque-trainer compat. Mellum-4b-base shares the same
# code-completion training distribution and works on the current pin —
# enough to validate DPOTrainer mechanics. The TRL baseline yaml separately
# probes Mellum2 (it has no opaque imports and can use transformers≥5.10).
#
# Counterpart to ``train_dpo_trainer (mellum_zeta).yaml`` (class-based) and
# ``train_dpo_trl_baseline.yaml`` (upstream TRL DPOTrainer on Mellum2);
# loop + class share Mellum-4b + Zeta + (batch 16, LR 5e-5, length 1024,
# beta 0.1, steps 100) so their train/loss curves overlay directly.
#
# Run (non-private baseline):
#   RUN_NAME="dpo-mellum-noDP" uv run cadence execution start \
#     --preset ".cadence/configs/train_dpo (mellum_zeta).yaml" \
#     -e EXTRA_ARGS="--noise-multiplier 0 --clipping-norm 1e9"
#
# Run (DP at ε=8):
#   RUN_NAME="dpo-mellum-DP-eps8" uv run cadence execution start \
#     --preset ".cadence/configs/train_dpo (mellum_zeta).yaml"

project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    # opaque-accounting (PyO3) needs rustc; the image doesn't ship it.
    command -v rustc >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    . "$HOME/.cargo/env"

    uv sync --group dev --group examples --all-packages --extra all
    uv pip install --quiet "maturin>=1.0,<2.0"
    uv run maturin develop --release -m packages/opaque-accounting/Cargo.toml

    # The mellum-zeta preset wires model/dataset/LoRA/dtype/microbatch in
    # one place (examples/train_dpo.py); override knobs via $EXTRA_ARGS —
    # e.g. ``-e EXTRA_ARGS="--noise-multiplier 0 --max-steps 20"`` for a
    # short non-private smoke run.
    uv run python examples/train_dpo.py --preset mellum-zeta \
      --max-steps 100 \
      --log-steps 2 \
      --seed 42 $EXTRA_ARGS
provisioning:
  gpu_type: h200
  gpu_count: 1
  cpu_count: 16
  ram: 200
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,dpo-mellum-zeta}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".claude/*"
      - "**/.claude/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.so"
      - "**/*.so"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
