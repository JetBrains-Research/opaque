# TR-DPO via the class-based DPOTrainer: the reference is EMA-synced toward
# the policy every --ref-model-sync-steps. Requires a reference-using head
# and full fine-tuning (no --peft), so --ref-model auto-loads from the policy
# path. Also drops the completion telemetry (--no-log-completion-metrics).
#
# Run:
#   RUN_NAME="dpo-trdpo-1" uv run cadence execution start \
#     --preset ".cadence/configs/train_dpo_trainer (qwen_trdpo).yaml"
project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    # opaque-accounting (PyO3) needs rustc; the image doesn't ship it.
    command -v rustc >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    . "$HOME/.cargo/env"

    uv sync --group dev --group examples --all-packages --extra all
    uv pip install --quiet "maturin>=1.0,<2.0"
    uv run maturin develop --release -m packages/opaque-accounting/Cargo.toml

    uv run python examples/train_dpo_trainer.py \
      --model Qwen/Qwen2.5-0.5B-Instruct \
      --dataset trl-lib/ultrafeedback_binarized \
      --loss-type sigmoid \
      --sync-ref-model \
      --ref-model-mixup-alpha 0.6 \
      --ref-model-sync-steps 16 \
      --no-log-completion-metrics \
      --beta 0.1 \
      --max-length 512 \
      --batch-size 8 \
      --microbatch-size 2 \
      --max-steps 50 \
      --learning-rate 1e-4 \
      --clipping-norm 1.0 \
      --log-steps 5 \
      --seed 42 $EXTRA_ARGS
provisioning:
  gpu_type: h200
  gpu_count: 1
  cpu_count: 16
  ram: 200
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,dpo-trainer-qwen-trdpo}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".claude/*"
      - "**/.claude/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.so"
      - "**/*.so"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
