# DPO TRL upstream baseline. Trains the same JetBrains/Mellum2-12B-A2.5B-Base
# + zed-industries/zeta DPO split as the opaque DPOTrainer at noise=0/clip=1e9,
# but with vanilla upstream trl.DPOTrainer (sigmoid, beta=0.1), LoRA matching
# the opaque ``mellum2-zeta`` preset (USE_LORA=1 by default). Mellum2 needs
# transformers≥5.10 for the custom MellumForCausalLM architecture.
#
# Pair with ``train_dpo_trainer (mellum2_zeta).yaml`` (opaque class-based DPO)
# and ``train_dpo (mellum2_zeta).yaml`` (opaque loop-based DPO); the three
# share model, dataset, batch (16), LR (5e-5), max-length (1024), beta (0.1),
# and steps (100) so train/loss overlays cleanly.
project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    # Use the project's uv-managed venv so torch is available, then layer on
    # the upstream trl + transformers≥5.10 stack via ``uv run --with`` (which
    # actually adds those packages to the run's ephemeral environment — plain
    # ``uv pip install`` is reverted by ``uv run``'s pre-sync step).
    uv sync --group dev --group examples --all-packages --extra all

    uv run \
      --with "trl>=0.13" \
      --with "transformers>=5.10,<6" \
      --with "datasets>=3.0" \
      --with "peft>=0.14" \
      --with "accelerate>=1.0" \
      --with "wandb>=0.17" \
      python examples/train_dpo_trl_baseline.py
provisioning:
  gpu_type: h200
  gpu_count: 1
  cpu_count: 16
  ram: 200
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,trl-dpo-mellum2-zeta-baseline}"
    DATASET_SPLIT: "${oc.env:DATASET_SPLIT,dpo}"
    NUM_STEPS: "${oc.env:NUM_STEPS,100}"
    BATCH_SIZE: "${oc.env:BATCH_SIZE,16}"
    NUM_TRAIN_SAMPLES: "${oc.env:NUM_TRAIN_SAMPLES,132}"
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".claude/*"
      - "**/.claude/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.so"
      - "**/*.so"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
