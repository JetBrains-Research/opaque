# LoRA-XS experiments (DP-SGD) on Mellum-4b + KStack
#
# Submit (default is lora-xs):
#   uv run cadence execution start \
#     --preset ".cadence/configs/train_causal_lm (lora-xs).yaml"
#
# Baseline (standard LoRA):
#   RUN_NAME="baseline-default" uv run cadence execution start \
#     --preset ".cadence/configs/train_causal_lm (lora-xs).yaml" \
#     -e EXTRA_ARGS="--lora-method lora"

project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    uv sync --group examples --all-packages
    uv run python examples/train_causal_lm.py --preset mellum-kstack --lora-method lora-xs $EXTRA_ARGS
provisioning:
  gpu_type: h200
  gpu_count: 1
  cpu_count: 16
  ram: 200
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque-lora-xs
    RUN_NAME: "${oc.env:RUN_NAME,lora-xs-dp-sgd}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "wheels/*"
      - "**/wheels/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - ".mypy_cache/*"
      - "**/.mypy_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".vscode/*"
      - "**/.vscode/*"
      - ".claude/*"
      - "**/.claude/*"
      - ".temp/*"
      - "**/.temp/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.jsonl"
      - "**/*.jsonl"
      - "*.so"
      - "**/*.so"
      - "*.dylib"
      - "**/*.dylib"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
