# Run example:
# RUN_NAME="ftrl-bandmf-b10-4gpu" uv run cadence execution start \
#   --preset ".cadence/configs/train_dp_ftrl (mellum_kstack_distributed).yaml" \
#   -e EXTRA_ARGS="--mechanism band_mf --bands 10"

project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    uv sync --group dev --group examples --all-packages --extra all  # "all" is a real extra in pyproject.toml
    uv run torchrun --nproc_per_node=4 examples/train_dp_ftrl.py --preset mellum-kstack --gradient-checkpointing --microbatch-size 4 $EXTRA_ARGS
provisioning:
  gpu_type: a10g
  gpu_count: 4
  cpu_count: 48
  ram: 192
  blank: false
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,mellum-kstack-dp-ftrl-distributed}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "wheels/*"
      - "**/wheels/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - ".mypy_cache/*"
      - "**/.mypy_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".vscode/*"
      - "**/.vscode/*"
      - ".claude/*"
      - "**/.claude/*"
      - ".temp/*"
      - "**/.temp/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.jsonl"
      - "**/*.jsonl"
      - "*.so"
      - "**/*.so"
      - "*.dylib"
      - "**/*.dylib"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
