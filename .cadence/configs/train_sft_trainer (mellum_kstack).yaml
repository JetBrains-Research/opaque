# Full DP-SFT run via the class-based SFTTrainer on JetBrains/Mellum-4b-base
# + KStack. Streams a code corpus through the per-example vmap DP-SGD path
# (clipped_grad -> gaussian_noise -> adamw) using opaque.alignment's SFT_LOSSES.
# Mirrors the loop-based "mellum-kstack" preset on main but exercises the
# class-based SFTTrainer.
#
# Flip to Mellum-2.0 (MoE) via EXTRA_ARGS — argparse honors last occurrence:
#
#   EXTRA_ARGS="--model-name JetBrains/Mellum2-12B-A2.5B-Base \
#               --microbatch-size 8 \
#               --lora-modules q_proj k_proj v_proj o_proj"
#
# Sweep override pattern:
#   RUN_NAME="HP-D-T03-lr3e-5_lora32" uv run cadence execution start \
#     --preset ".cadence/configs/train_sft_trainer (mellum_kstack).yaml" \
#     -e EXTRA_ARGS="--learning-rate 3e-5 --lora-r 32 --lora-alpha 64 --num-steps 1000"

project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    # opaque-accounting (PyO3) needs rustc; the image doesn't ship it.
    command -v rustc >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    . "$HOME/.cargo/env"

    uv sync --group dev --group examples --all-packages --extra all
    uv pip install --quiet "maturin>=1.0,<2.0"
    uv run maturin develop --release -m packages/opaque-accounting/Cargo.toml

    # Defaults match the train_sft.py "mellum-kstack" preset on main:
    # Mellum-4b dense + KStack + batch=128 + adafactor @ 5e-5 + LoRA over
    # attention + MLP linears. Override via EXTRA_ARGS for the HP sweep.
    uv run python examples/train_sft_trainer.py \
      --model-name JetBrains/Mellum-4b-base \
      --dataset JetBrains/KStack \
      --dataset-text-field content \
      --num-train-samples 50000 \
      --loss-type nll \
      --max-length 1024 \
      --batch-size 128 \
      --microbatch-size 16 \
      --num-steps 1000 \
      --learning-rate 5e-5 \
      --clipping-norm 1.0 \
      --target-epsilon 10.0 \
      --lora-modules q_proj k_proj v_proj o_proj gate_proj up_proj down_proj \
      --lora-r 16 --lora-alpha 32 \
      --eval-steps 50 \
      --num-eval-samples 200 \
      --seed 42 $EXTRA_ARGS
provisioning:
  gpu_type: h200
  gpu_count: 1
  cpu_count: 16
  ram: 200
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,sft-trainer-mellum-kstack}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".claude/*"
      - "**/.claude/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.so"
      - "**/*.so"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
