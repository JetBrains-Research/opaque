# Run example:
# RUN_NAME="val/dptrainer/B-trainer-dp" uv run cadence execution start \
#   --preset ".cadence/configs/train_causal_lm_trainer (mellum_kstack).yaml" \
#   -e EXTRA_ARGS="--max-steps 100"

project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    # `uv sync` handles the maturin PEP 517 build internally via uv's
    # bundled build-environment toolchain. Empirically this works for
    # the manual-loop preset on the same workers; the trainer preset
    # was failing because of an explicit `uv run maturin develop` step
    # that bypassed uv's isolated build env and hit a Cadence worker
    # that lacks system rustc. Trust uv sync and verify with a smoke
    # import.
    uv sync --group dev --group examples --all-packages --extra all
    uv run python -c "from opaque.api.accounting.core import opaque_accounting as _; print('opaque_accounting native ext OK')"
    uv run python examples/train_causal_lm_trainer.py --preset mellum-kstack $EXTRA_ARGS
provisioning:
  gpu_type: h200
  gpu_count: 1
  cpu_count: 16
  ram: 200
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,mellum-kstack-dptrainer}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "wheels/*"
      - "**/wheels/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - ".mypy_cache/*"
      - "**/.mypy_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".vscode/*"
      - "**/.vscode/*"
      - ".claude/*"
      - "**/.claude/*"
      - ".temp/*"
      - "**/.temp/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.jsonl"
      - "**/*.jsonl"
      - "*.so"
      - "**/*.so"
      - "*.dylib"
      - "**/*.dylib"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
