# Mellum + KStack, single GPU (H200).  Preset defaults: BandMF + b-min-sep
# subsampling, bands=64, momentum=0.95 (same recipe as historical
# ``ftrl-bandmf-b64-m095-bminsep`` W&B runs).  DP-SGD baseline lives in
# ``train_causal_lm (mellum_kstack).yaml``.
#
# Quartet (submit all four for distributed vs single-GPU parity checks):
#   1) causal single:  train_causal_lm (mellum_kstack).yaml
#   2) causal 4-GPU:    train_causal_lm (mellum_kstack_distributed).yaml
#   3) FTRL single:     this file
#   4) FTRL 4-GPU:      train_dp_ftrl (mellum_kstack_distributed).yaml
#
# Run example (optional early stop):
#   RUN_NAME="ftrl-bandmf-b64-bminsep-single" uv run cadence execution start \
#     --preset ".cadence/configs/train_dp_ftrl (mellum_kstack).yaml" \
#     -e EXTRA_ARGS="--max-steps 200"

project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    uv sync --group dev --group examples --all-packages --extra all  # "all" is a real extra in pyproject.toml
    uv run python examples/train_dp_ftrl.py --preset mellum-kstack $EXTRA_ARGS
provisioning:
  gpu_type: h200
  gpu_count: 1
  cpu_count: 16
  ram: 200
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,mellum-kstack-dp-ftrl}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "wheels/*"
      - "**/wheels/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - ".mypy_cache/*"
      - "**/.mypy_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".vscode/*"
      - "**/.vscode/*"
      - ".claude/*"
      - "**/.claude/*"
      - ".temp/*"
      - "**/.temp/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.jsonl"
      - "**/*.jsonl"
      - "*.so"
      - "**/*.so"
      - "*.dylib"
      - "**/*.dylib"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
