# Full DP-SFT run for opaque-alignment (Phase ε example) on a real model +
# real dataset. Streams an SFT corpus through the per-example vmap DP-SGD path
# (clipped_grad -> gaussian_noise -> adamw) using opaque.alignment's SFT_LOSSES.
#
# Run:
#   RUN_NAME="sft-qwen-1" uv run cadence execution start \
#     --preset ".cadence/configs/train_sft (qwen_alignment).yaml" \
#     -e EXTRA_ARGS="--num-steps 1000"

project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    # opaque-accounting (PyO3) needs rustc; the image doesn't ship it.
    command -v rustc >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    . "$HOME/.cargo/env"

    uv sync --group dev --group examples --all-packages --extra all
    uv pip install --quiet "maturin>=1.0,<2.0"
    uv run maturin develop --release -m packages/opaque-accounting/Cargo.toml

    uv run python examples/train_sft.py \
      --model-name Qwen/Qwen2.5-0.5B \
      --dataset roneneldan/TinyStories \
      --dataset-text-field text \
      --num-train-samples 8000 \
      --loss-type nll \
      --max-length 1024 \
      --batch-size 32 \
      --num-steps 500 \
      --learning-rate 1e-4 \
      --clipping-norm 1.0 \
      --noise-multiplier 0.8 \
      --seed 42 $EXTRA_ARGS
provisioning:
  gpu_type: h200
  gpu_count: 1
  cpu_count: 16
  ram: 200
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,sft-qwen-alignment}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".claude/*"
      - "**/.claude/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.so"
      - "**/*.so"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
