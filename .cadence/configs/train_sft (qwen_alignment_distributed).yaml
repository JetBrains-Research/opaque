# 4-GPU distributed DP-SFT for opaque-alignment on a real model + dataset.
# Wraps the same per-example vmap DP-SGD path as the 1xH200 sibling preset
# (`train_sft (qwen_alignment).yaml`) in torchrun, so each rank runs the
# same script with its WORLD_SIZE / RANK / LOCAL_RANK env vars set.
#
# Sharded baseline (default --shard):
#   RUN_NAME="sft-qwen-dist-1" uv run cadence execution start \
#     --preset ".cadence/configs/train_sft (qwen_alignment_distributed).yaml" \
#     -e EXTRA_ARGS="--num-steps 100"
#
# Parallel Poisson (--no-shard, sample_rate auto-divided by world_size; the
# accountant switches to parallel_poisson PLD):
#   RUN_NAME="sft-qwen-dist-pp" uv run cadence execution start \
#     --preset ".cadence/configs/train_sft (qwen_alignment_distributed).yaml" \
#     -e EXTRA_ARGS="--no-shard --num-steps 100"

project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    # opaque-accounting (PyO3) needs rustc; the image doesn't ship it.
    command -v rustc >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    . "$HOME/.cargo/env"

    uv sync --group dev --group examples --all-packages --extra all
    uv pip install --quiet "maturin>=1.0,<2.0"
    uv run maturin develop --release -m packages/opaque-accounting/Cargo.toml

    uv run torchrun --nproc_per_node=4 examples/train_sft.py \
      --model-name Qwen/Qwen2.5-0.5B \
      --dataset roneneldan/TinyStories \
      --dataset-text-field text \
      --num-train-samples 2000 \
      --loss-type nll \
      --max-length 512 \
      --batch-size 8 \
      --microbatch-size 2 \
      --num-steps 50 \
      --learning-rate 1e-4 \
      --clipping-norm 1.0 \
      --noise-multiplier 0.8 \
      --lora-modules q_proj k_proj v_proj o_proj gate_proj up_proj down_proj \
      --gradient-checkpointing \
      --seed 42 $EXTRA_ARGS
provisioning:
  gpu_type: a10g
  gpu_count: 4
  cpu_count: 48
  ram: 192
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,sft-qwen-alignment-distributed}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".claude/*"
      - "**/.claude/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.so"
      - "**/*.so"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
