# Full DP-DPO run for opaque-alignment on JetBrains/Mellum2-12B-A2.5B-Base
# (12B MoE, 2.5B active) + zed-industries/zeta (Next Edit Prediction, 132 DPO
# pairs in the ``dpo`` split). Precomputes reference logps, then trains
# through the per-example vmap DP-SGD path with DPO_LOSSES["sigmoid"].
#
# Mellum2 is a code-completion model built for IDE-side use; Zeta is the Zed
# editor's NES preference dataset (chosen=correct-next-edit, rejected=wrong
# edit). The example loader remaps Zeta's (events, input, output, rejected)
# to (prompt, chosen, rejected).
#
# Mellum2 needs transformers≥5.10 — newer than the project's 4.57.x pin —
# so the cmd block re-installs the right transformers into the synced venv
# AFTER ``uv sync`` (which would otherwise pin it back). The opaque trainer
# was last validated at 4.57.x; cross-major exposure here is intentional —
# Phase-1 smoke tests double as a transformers-v5 compat probe.
#
# Counterpart to ``train_dpo_trainer (mellum2_zeta).yaml`` (class-based) and
# ``train_dpo_trl_baseline.yaml`` (upstream TRL DPOTrainer); the three share
# Mellum2 + Zeta + (batch, LR, length, beta, steps) so train/loss curves
# overlay directly.
#
# Run (non-private baseline):
#   RUN_NAME="dpo-mellum2-noDP" uv run cadence execution start \
#     --preset ".cadence/configs/train_dpo (mellum2_zeta).yaml" \
#     -e EXTRA_ARGS="--noise-multiplier 0"
#
# Run (DP at ε=8):
#   RUN_NAME="dpo-mellum2-DP-eps8" uv run cadence execution start \
#     --preset ".cadence/configs/train_dpo (mellum2_zeta).yaml"

project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    # opaque-accounting (PyO3) needs rustc; the image doesn't ship it.
    command -v rustc >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    . "$HOME/.cargo/env"

    uv sync --group dev --group examples --all-packages --extra all
    uv pip install --quiet "maturin>=1.0,<2.0"
    uv run maturin develop --release -m packages/opaque-accounting/Cargo.toml
    # Mellum2 (custom MellumForCausalLM) needs transformers≥5.10 — bump AFTER
    # ``uv sync`` since sync would re-pin to the 4.57.x in pyproject.toml.
    # peft / trl / accelerate moved on as well; pull recent versions for
    # compatibility with the bumped transformers.
    uv pip install --quiet \
      "transformers>=5.10,<6" \
      "peft>=0.14" \
      "accelerate>=1.0" \
      "trl>=0.13" \
      "datasets>=3.0"

    # The mellum2-zeta preset wires model/dataset/LoRA/dtype/microbatch in
    # one place (examples/train_dpo.py); override knobs via $EXTRA_ARGS —
    # e.g. ``-e EXTRA_ARGS="--noise-multiplier 0 --max-steps 20"`` for a
    # short non-private smoke run.
    uv run python examples/train_dpo.py --preset mellum2-zeta \
      --max-steps 100 \
      --log-steps 2 \
      --seed 42 $EXTRA_ARGS
provisioning:
  gpu_type: h200
  gpu_count: 1
  cpu_count: 16
  ram: 200
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,dpo-mellum2-zeta}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".claude/*"
      - "**/.claude/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.so"
      - "**/*.so"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
