# Rényi α-inflation test — non-DP arm (--noise-multiplier 0 => acc.nonprivate()).
# Identical to renyi_dp_vs_nodp.yaml except this arm removes DP noise. Same
# clipping, model, data, r=16, p_e=0.333, 1 epoch, adaptive-depth OFF — DP noise
# is the ONLY variable between the two arms.
#
# Prediction: the low-α Rényi effective rank (rotation/r_eff_a0p5) collapses
# toward the stable rank (rotation/r_eff_ainf) here, i.e. renyi_gap_a0p5_ainf is
# much smaller than in the DP arm. See docs/renyi-effective-rank-theory.md §III.
#
# Submit:
#   start_execution_from_preset(preset_path=".cadence/configs/renyi_nodp.yaml")
project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    uv sync --group examples --all-packages
    uv run python examples/train_causal_lm.py --preset qwen-coder-kstack-lora --lora-method lora-xs --lora-xse-p-e 0.333 --num-epochs 1 --noise-multiplier 0
provisioning:
  gpu_type: h100
  gpu_count: 1
  cpu_count: 20
  ram: 160
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque-lora-xs
    RUN_NAME: "${oc.env:RUN_NAME,renyi-alpha-nodp}"
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".venv/*"
      - "**/.venv/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".claude/*"
      - "**/.claude/*"
      - ".cadence/cache/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.jsonl"
      - "**/*.jsonl"
      - "*.so"
      - "**/*.so"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,renyi-alpha-nodp}"
