# Full DP-DPO run via the class-based DPOTrainer on JetBrains/Mellum-4b-base
# (dense Llama arch) + CyberNative/Code_Vulnerability_Security_DPO (4.7k code-
# security preference pairs). Precomputes reference logps, then trains through
# the per-example vmap DP-SGD path with _DPO_LOSSES["sigmoid"]. Mirrors the
# loop-based "mellum-codesec" preset shipped on main but exercises the class-
# based DPOTrainer.
#
# Flip to Mellum-2.0 (MoE) by passing the appropriate model + LoRA overrides
# in EXTRA_ARGS — argparse honors the last occurrence on CLI:
#
#   EXTRA_ARGS="--model JetBrains/Mellum2-12B-A2.5B-Base \
#               --microbatch-size 8 \
#               --lora-modules q_proj k_proj v_proj o_proj"
#
# Run (DP-DPO at ε=8, default 1500 step probe):
#   RUN_NAME="HP-A-T01" uv run cadence execution start \
#     --preset ".cadence/configs/train_dpo_trainer (mellum_codesec).yaml"
#
# Sweep override pattern:
#   RUN_NAME="HP-A-T03-lr3e-5_bs128_beta0.1_clip1.0" uv run cadence execution start \
#     --preset ".cadence/configs/train_dpo_trainer (mellum_codesec).yaml" \
#     -e EXTRA_ARGS="--learning-rate 3e-5 --batch-size 128 --beta 0.1 --clipping-norm 1.0 --max-steps 1500"

project_name: jbr-fed
working_dir: "."
cmd:
  - |-
    # opaque-accounting (PyO3) needs rustc; the image doesn't ship it.
    command -v rustc >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    . "$HOME/.cargo/env"

    uv sync --group dev --group examples --all-packages --extra all
    uv pip install --quiet "maturin>=1.0,<2.0"
    uv run maturin develop --release -m packages/opaque-accounting/Cargo.toml

    # Defaults match the train_dpo.py "mellum-codesec" preset on main:
    # Mellum-4b dense + CyberNative + 4000 train + 500 eval + adafactor @ 5e-5.
    # Override via EXTRA_ARGS for the HP sweep (or to flip to Mellum-2.0).
    uv run python examples/train_dpo_trainer.py \
      --model JetBrains/Mellum-4b-base \
      --dataset CyberNative/Code_Vulnerability_Security_DPO \
      --dataset-split train \
      --num-train-samples 4000 \
      --num-eval-samples 500 \
      --beta 0.1 \
      --max-length 1024 \
      --batch-size 128 \
      --microbatch-size 16 \
      --precompute-ref-batch-size 16 \
      --max-steps 1500 \
      --learning-rate 5e-5 \
      --clipping-norm 1.0 \
      --target-epsilon 8.0 \
      --peft \
      --lora-r 16 --lora-alpha 32 \
      --lora-modules q_proj k_proj v_proj o_proj gate_proj up_proj down_proj \
      --log-steps 5 \
      --eval-steps 100 \
      --seed 42 $EXTRA_ARGS
provisioning:
  gpu_type: h200
  gpu_count: 1
  cpu_count: 16
  ram: 200
teamcity:
  url: https://api.cadence.jetbrains.com
  build_conf_id: JbrFed_JetTrain
env:
  variables:
    PYTHONUNBUFFERED: "1"
    WANDB_BASE_URL: https://jetbrains.wandb.io
    WANDB_ENTITY: federated-compute
    WANDB_PROJECT: opaque
    RUN_NAME: "${oc.env:RUN_NAME,dpo-trainer-mellum-codesec}"
    EXTRA_ARGS: ""
  python:
    version: 3.11.14
  secrets:
    variables:
      HF_TOKEN: "${oc.env:HF_TOKEN}"
      WANDB_API_KEY: "${oc.env:WANDB_API_KEY}"
    ssh_keys: []
  aws:
    sync_config: false
    sync_credentials: false
    sync_cache: false
project_sync:
  local:
    root: "."
    storage_name: Cadence Storage
    uri: ""
    exclude:
      - ".git/*"
      - "**/.git/*"
      - ".github/*"
      - "trainer_output/**"
      - "**/trainer_output/**"
      - ".venv/*"
      - "**/.venv/*"
      - "venv/*"
      - "**/venv/*"
      - "target/*"
      - "**/target/*"
      - "dist/*"
      - "**/dist/*"
      - "build/*"
      - "**/build/*"
      - "site/*"
      - "**/site/*"
      - ".ruff_cache/*"
      - "**/.ruff_cache/*"
      - ".pytest_cache/*"
      - "**/.pytest_cache/*"
      - "__pycache__/*"
      - "**/__pycache__/*"
      - ".idea/*"
      - "**/.idea/*"
      - ".claude/*"
      - "**/.claude/*"
      - "wandb/*"
      - "**/wandb/*"
      - "*.so"
      - "**/*.so"
      - "*.whl"
      - "**/*.whl"
    include: []
    sync_back: false
    snapshots: true
    storage_type: DEFAULT
inputs: []
outputs: []
mounts: []
storages: []
description: "${oc.env:RUN_NAME,}"
