name: Reusable / Qodana analysis

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Ref to analyze. Leave empty to analyze the triggering SHA.
        required: false
        default: ""
        type: string
      coverage-artifact-pattern:
        description: Coverage artifact pattern from the caller's test matrix.
        required: true
        type: string
      pr-mode:
        description: Analyze only changes introduced by the pull request.
        required: true
        type: boolean

concurrency:
  group: qodana-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Qodana
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: ./.github/actions/setup-python
        with:
          enable-uv-cache: "true"

      - name: Download coverage from Python test shards
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ${{ inputs.coverage-artifact-pattern }}
          path: .qodana/code-coverage
          merge-multiple: true

      - name: Qodana scan
        id: qodana
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          artifact-name: qodana-report
          post-pr-comment: ${{ inputs.pr-mode }}
          pr-mode: ${{ inputs.pr-mode }}
          results-dir: ${{ runner.temp }}/qodana/results
          upload-result: true
          use-annotations: true
          use-caches: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1970838931 }}

      - name: Verify SARIF report
        id: sarif
        if: ${{ !cancelled() }}
        env:
          SARIF_PATH: ${{ runner.temp }}/qodana/results/qodana.sarif.json
        run: |
          if [[ ! -s "$SARIF_PATH" ]]; then
            echo "::error::Qodana did not produce a non-empty SARIF report at $SARIF_PATH"
            exit 1
          fi
          echo "path=$SARIF_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub code scanning
        if: ${{ !cancelled() && steps.sarif.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: qodana/python
          checkout_path: ${{ github.workspace }}
          ref: ${{ inputs.pr-mode && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
          sarif_file: ${{ steps.sarif.outputs.path }}
          sha: ${{ inputs.checkout-ref || github.sha }}
          wait-for-processing: true
