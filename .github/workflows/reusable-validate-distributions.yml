name: Reusable / Validate distributions

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Prefix used by distribution build artifacts.
        required: true
        type: string
      checkout-ref:
        description: Ref whose source metadata should be validated.
        required: false
        default: ""
        type: string

jobs:
  wheel-metadata:
    name: Validate wheel metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Download wheels
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          path: dist/
          merge-multiple: true

      - name: Validate internal opaque pins
        run: >-
          uv run --isolated --no-project --with packaging==25.0
          python .github/scripts/check_wheel_internal_pins.py --wheel-dir dist

  accounting-policy:
    name: Validate accounting artifact policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Download accounting artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ${{ inputs.artifact-prefix }}-opaque-accounting-*
          path: dist/
          merge-multiple: true

      - name: Validate accounting artifact policy
        run: python3 .github/scripts/check_accounting_artifact_policy.py --wheel-dir dist
