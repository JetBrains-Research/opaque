name: Junie review

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: junie-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Junie review
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Run Junie code review
        uses: JetBrains/junie-github-action@3f6a906f11c6f67c76efaf3d3264bbb615f9ce29 # v1.7.5
        with:
          junie_api_key: ${{ secrets.JUNIE_API_KEY }}
          junie_guidelines_filename: review-guidelines.md
          prompt: code-review
          use_single_comment: "true"
