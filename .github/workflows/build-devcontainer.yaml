name: Build DevContainer

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .github/workflows/build-devcontainer.yaml
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/build-devcontainer.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DevContainer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Prepare
        run: |
          # Check if this is a fork PR (no push access)
          if [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "IS_FORK_PR=true" >> $GITHUB_ENV
          else
            echo "IS_FORK_PR=false" >> $GITHUB_ENV
          fi

          # Determine image tag based on branch/PR
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs: use pr-NUMBER tag
            IMAGE_TAG="pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # For main branch: use commit SHA and update latest
            IMAGE_TAG="${GITHUB_SHA:0:7}"
            echo "UPDATE_LATEST=true" >> $GITHUB_ENV
          else
            # For other branches: use sanitized branch name + SHA
            # Replace / with - and remove any other invalid Docker tag characters
            BRANCH_NAME="${{ github.ref_name }}"
            SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | sed 's/[^a-zA-Z0-9._-]/-/g')
            IMAGE_TAG="${SANITIZED_BRANCH}-${GITHUB_SHA:0:7}"
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "CONTAINER_NAME=opaque-devcontainer" >> $GITHUB_ENV
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opaque-devcontainer" >> $GITHUB_ENV
          echo "GAR_IMAGE=europe-west4-docker.pkg.dev/jetbrains-ml4se-fed/coder/opaque-devcontainer" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        if: env.IS_FORK_PR == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        if: env.IS_FORK_PR == 'false'
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935  # v2.1.8
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        if: env.IS_FORK_PR == 'false'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        if: env.IS_FORK_PR == 'false'
        run: gcloud auth configure-docker europe-west4-docker.pkg.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build devcontainer image
        run: |
          npm install -g @devcontainers/cli
          devcontainer build \
            --image-name devcontainer:build \
            --platform linux/amd64 \
            --workspace-folder . \
            --cache-from ${{ env.GHCR_IMAGE }}:latest

      - name: Test devcontainer
        run: |
          devcontainer up --workspace-folder . 
          devcontainer exec --workspace-folder . echo "Devcontainer smoke test passed"

      - name: Tag and push to GitHub Container Registry
        if: env.IS_FORK_PR == 'false'
        run: |
          docker tag devcontainer:build ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.GHCR_IMAGE }}:${{ env.IMAGE_TAG }}

          # Update latest tag only on main branch
          if [ "${{ env.UPDATE_LATEST }}" == "true" ]; then
            docker tag devcontainer:build ${{ env.GHCR_IMAGE }}:latest
            docker push ${{ env.GHCR_IMAGE }}:latest
          fi

      - name: Tag and push to GCP Artifact Registry
        if: env.IS_FORK_PR == 'false'
        run: |
          docker tag devcontainer:build ${{ env.GAR_IMAGE }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.GAR_IMAGE }}:${{ env.IMAGE_TAG }}

          # Update latest tag only on main branch
          if [ "${{ env.UPDATE_LATEST }}" == "true" ]; then
            docker tag devcontainer:build ${{ env.GAR_IMAGE }}:latest
            docker push ${{ env.GAR_IMAGE }}:latest
          fi

      - name: Prune old GHCR image versions (keep last 8)
        if: github.ref == 'refs/heads/main'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.CONTAINER_NAME }}
          package-type: container
          min-versions-to-keep: 8
          ignore-versions: '^latest$'
          delete-only-untagged-versions: true
