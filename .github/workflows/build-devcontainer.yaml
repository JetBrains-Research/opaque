name: Build DevContainer

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/**
      - .github/workflows/build-devcontainer.yaml
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/build-devcontainer.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DevContainer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build devcontainer image
        run: |
          npm install -g @devcontainers/cli
          devcontainer build \
            --image-name devcontainer:build \
            --platform linux/amd64 \
            --workspace-folder . \
            --cache-from ghcr.io/jetbrains-research/opaque-devcontainer:latest

      - name: Test devcontainer
        run: |
          devcontainer up --workspace-folder .
          devcontainer exec --workspace-folder . echo "Devcontainer smoke test passed"

  publish:
    name: Publish DevContainer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: devcontainer
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      CONTAINER_NAME: opaque-devcontainer
      GHCR_IMAGE: ghcr.io/jetbrains-research/opaque-devcontainer
      GAR_IMAGE: europe-west4-docker.pkg.dev/gke-dev-dws-jbr/ml/opaque-devcontainer

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GCP Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build devcontainer image
        run: |
          npm install -g @devcontainers/cli
          devcontainer build \
            --image-name devcontainer:build \
            --platform linux/amd64 \
            --workspace-folder . \
            --cache-from "$GHCR_IMAGE:latest"

      - name: Publish devcontainer image
        run: |
          image_tag="${GITHUB_SHA:0:7}"
          for image in "$GHCR_IMAGE" "$GAR_IMAGE"; do
            docker tag devcontainer:build "$image:$image_tag"
            docker push "$image:$image_tag"
            docker tag devcontainer:build "$image:latest"
            docker push "$image:latest"
          done

      - name: Prune old GHCR image versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ env.CONTAINER_NAME }}
          package-type: container
          min-versions-to-keep: 8
          ignore-versions: '^latest$'
          delete-only-untagged-versions: true
