name: Validate distributions

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Prefix used by distribution build artifacts.
        required: true
        type: string

jobs:
  install-all:
    name: opaque[all] (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Download distribution artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          path: dist/
          merge-multiple: true

      - name: Install opaque[all] from built wheels
        run: |
          opaque_wheels=(dist/opaque-*.whl)
          if [[ "${#opaque_wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected one opaque wheel, found ${#opaque_wheels[@]}"
            exit 1
          fi
          uv venv --python ${{ matrix.python-version }} .artifact-venv
          uv pip install \
            --python .artifact-venv/bin/python \
            --find-links dist \
            --only-binary :all: \
            "${opaque_wheels[0]}[all]"

      - name: Run cross-stack scenario
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.artifact-venv/bin/python" - <<'PY'
          import math
          from importlib.metadata import distributions, version

          import opaque.dpftrl.accounting as dpftrl
          import opaque.dpsgd.accounting as dpsgd
          from opaque.dpftrl.noise import identity_strategy

          umbrella_version = version("opaque")
          opaque_versions = {
              dist.metadata["Name"]: dist.version
              for dist in distributions()
              if (name := dist.metadata["Name"]) == "opaque"
              or name.startswith("opaque-")
          }
          assert len(opaque_versions) > 1
          assert set(opaque_versions.values()) == {umbrella_version}, opaque_versions

          dpsgd_process = dpsgd.gaussian(1.0)
          dpftrl_process = dpftrl.poisson(
              dpftrl.mf_gaussian(1.0, identity_strategy()),
              sample_rate=0.01,
              n_steps=4,
          )
          epsilon = (dpsgd_process | dpftrl_process).epsilon_at(1e-5)
          assert math.isfinite(epsilon) and epsilon > 0
          print(f"opaque[all] cross-stack epsilon: {epsilon:.6f}")
          PY

  # ARC-004: the backend-neutral engine wheels must install and execute a
  # neutral scenario without any backend runtime present.
  engine-backend-neutral:
    name: opaque-engine without torch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Download distribution artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          path: dist/
          merge-multiple: true

      - name: Install engine wheels without any backend runtime
        run: |
          uv venv --python 3.11 .neutral-venv
          uv pip install \
            --python .neutral-venv/bin/python \
            --find-links dist \
            --only-binary :all: \
            dist/opaque_base-*.whl dist/opaque_engine-*.whl

      - name: Run backend-neutral scenario
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.neutral-venv/bin/python" - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("torch") is None, "torch leaked in"

          import opaque.backend
          import opaque.ops
          import opaque.sampling  # noqa: F401
          from opaque.backend import BackendNotSelectedError
          from opaque.random import fold_in, key, split

          # Keyed RNG derivation is host-side and fully backend-free.
          base = key(42)
          children = split(fold_in(base, "arc-004", 7), num=3)
          assert len({child.seed for child in children}) == 3

          # Dispatch fails closed without a provider, not with an ImportError.
          try:
              opaque.ops.square(1.0)
          except BackendNotSelectedError:
              print("opaque-engine neutral scenario: OK")
          else:
              raise AssertionError("dispatch without a backend must fail closed")
          PY

  install-mlx:
    name: opaque[mlx] on macOS arm64
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ${{ inputs.artifact-prefix }}-*
          path: dist/
          merge-multiple: true
      - name: Install the MLX extra from built wheels
        run: |
          opaque_wheels=(dist/opaque-*.whl)
          if [[ "${#opaque_wheels[@]}" -ne 1 ]]; then
            echo "::error::Expected one opaque wheel, found ${#opaque_wheels[@]}"
            exit 1
          fi
          uv venv .mlx-venv
          uv pip install --python .mlx-venv/bin/python --find-links dist "${opaque_wheels[0]}[mlx]"
      - name: Verify MLX provider activation
        run: |
          .mlx-venv/bin/python - <<'PY'
          import mlx.core as mx
          from opaque import ops
          from opaque.backend import set_backend

          set_backend("mlx")
          assert ops.scalar_item(ops.sum(mx.array([1, 2]))) == 3
          PY
