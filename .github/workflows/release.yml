name: Release

# Fires when a draft Release is published (or a Release is created
# directly via `gh release create`). Publishing creates the git tag at
# `target_commitish` (default: main HEAD). Drafts are maintained on
# every main merge by the `upsert-draft` job in ci.yml.

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  tag-guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - name: Check tag commit is reachable from origin/main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/main."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is on main — proceeding."

  build-python-wheel:
    name: Build ${{ matrix.package }} @ ${{ github.event.release.tag_name }}
    needs: [tag-guard]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - opaque
          - opaque-core
          - opaque-dpsgd
          - opaque-dpftrl
          - opaque-auditing
          - opaque-performance
          - opaque-huggingface

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight — rewrite umbrella pins + accounting version from tag
        run: bash .github/scripts/set_build_versions.sh

      - name: Build wheel
        run: |
          cd packages/${{ matrix.package }} && uv build --wheel --out-dir ../../dist

      - name: Upload wheel to artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.package }}
          path: dist/*.whl
          retention-days: 90

  build-opaque-accounting:
    name: Build opaque-accounting - ${{ matrix.platform }}/${{ matrix.arch }} @ ${{ github.event.release.tag_name }}
    needs: [tag-guard]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            arch: arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight — sync accounting version from tag
        run: bash .github/scripts/set_build_versions.sh

      - name: Build wheel
        run: |
          cd packages/opaque-accounting && uv build --wheel --out-dir ../../dist

      - name: Upload wheel to artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wheels-opaque-accounting-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*opaque_accounting*.whl
          retention-days: 90

  publish:
    name: Publish to GCP + attach Release assets
    needs: [build-python-wheel, build-opaque-accounting]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all wheels
        uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: List wheels
        run: |
          echo "Releasing ${{ github.event.release.tag_name }}. Wheels:"
          ls -lh dist/*.whl

      - name: Authenticate to GCP
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 3600s

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Publish release wheels to GCP
        env:
          UV_PUBLISH_USERNAME: oauth2accesstoken
          UV_PUBLISH_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          uv publish \
            --publish-url "${{ vars.PYTHON_REPOSITORY_URL }}" \
            dist/*.whl

      - name: Attach wheels to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/*.whl \
            --clobber --repo "$GITHUB_REPOSITORY"

  commit-changelog:
    name: Commit CHANGELOG.md entry
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Build CHANGELOG.md update from Release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"
          TODAY=$(date -u +%Y-%m-%d)

          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" \
            --jq .body > /tmp/body.md

          VERSION="$VERSION" TODAY="$TODAY" python3 - <<'PY'
          import os, pathlib, re
          version, today = os.environ["VERSION"], os.environ["TODAY"]

          body = pathlib.Path("/tmp/body.md").read_text()
          body = re.sub(r"<!--\s*\w+:(begin|end)\s*-->\n?", "", body)
          body = re.sub(r"<!--\s*Edit[^>]*-->\n?", "", body)
          body = re.sub(r"<!--\s*Thanks[^>]*-->\n?", "", body)
          # Demote top-level Release headings so they nest under the
          # `## [X.Y.Z]` entry instead of becoming sibling H2s.
          body = re.sub(r"^(#+)\s", lambda m: "#" + m.group(1) + " ", body, flags=re.MULTILINE)
          body = re.sub(r"\n{3,}", "\n\n", body).strip() + "\n"

          new_section = f"## [{version}] - {today}\n\n{body}\n"

          changelog = pathlib.Path("CHANGELOG.md")
          lines = changelog.read_text().splitlines(keepends=True)
          insert_at = None
          for i, line in enumerate(lines):
              if line.strip() == "## [Unreleased]":
                  j = i + 1
                  while j < len(lines) and lines[j].strip() == "":
                      j += 1
                  insert_at = j
                  break
              if line.startswith("## ["):
                  insert_at = i
                  break
          if insert_at is None:
              raise SystemExit("no [Unreleased] or [X.Y.Z] heading found in CHANGELOG.md")
          out = "".join(lines[:insert_at]) + new_section + "\n" + "".join(lines[insert_at:])
          changelog.write_text(out)
          PY

      - name: Open CHANGELOG bot PR
        id: changelog-pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/changelog-${{ github.event.release.tag_name }}
          delete-branch: true
          commit-message: "docs: changelog for ${{ github.event.release.tag_name }}"
          title: "docs: changelog for ${{ github.event.release.tag_name }}"
          body: |
            Automated CHANGELOG.md entry for release ${{ github.event.release.tag_name }}.

            Sourced from the final body of
            [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }})
            with `<!-- auto:* -->` fences and placeholder comments stripped.

      - name: Enable auto-merge
        if: steps.changelog-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.changelog-pr.outputs.pull-request-number }}" \
            --auto --squash --repo "$GITHUB_REPOSITORY"
