name: Release

# Fires when a draft Release is published (or a Release is created
# directly via `gh release create`). Publishing creates the git tag at
# `target_commitish` (default: main HEAD). Drafts are maintained on
# every main merge by the `upsert-draft` job in ci.yml.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Release ref validation and package discovery
  # ---------------------------------------------------------------------------
  tag-guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - name: Check tag commit is reachable from origin/main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/main."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is on main — proceeding."

  discover-packages:
    name: Discover package matrices
    needs: [tag-guard]
    runs-on: ubuntu-latest
    outputs:
      cuda_test_shards: ${{ steps.discover.outputs.cuda_test_shards }}
      native_build_packages: ${{ steps.discover.outputs.native_build_packages }}
      python_build_packages: ${{ steps.discover.outputs.python_build_packages }}
      test_shards: ${{ steps.discover.outputs.test_shards }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Discover packages
        id: discover
        run: python3 .github/scripts/discover_package_matrices.py --github-output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Rust tests
  # ---------------------------------------------------------------------------
  rust-tests:
    name: Rust
    needs: [tag-guard]
    uses: ./.github/workflows/rust-tests.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      include-slow: true

  # ---------------------------------------------------------------------------
  # Python tests
  # ---------------------------------------------------------------------------
  python-tests-linux-amd64:
    name: Linux amd64
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      environment-name: linux-amd64
      pytest-marker: not cuda and not mps
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 40

  python-tests-minimum:
    name: Minimum dependencies
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-test-failure: true
      checkout-ref: ${{ github.event.release.tag_name }}
      dependency-selection: minimum
      environment-name: minimum-dependencies
      pytest-marker: not cuda and not mps and not slow
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.11"
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-latest:
    name: Latest dependencies
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      dependency-selection: latest
      environment-name: latest-dependencies
      pytest-marker: not cuda and not mps and not slow
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.12"
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-macos-arm64:
    name: macOS arm64
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      environment-name: mps
      pytest-marker: not cuda
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: macos-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 40

  python-tests-linux-arm64:
    name: Linux arm64
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      environment-name: linux-aarch64
      pytest-marker: not cuda and not mps
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-24.04-arm
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-cuda:
    name: CUDA
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      environment-name: cuda
      pytest-marker: cuda
      pytest-xdist: -rs
      report-durations: true
      runner: GPU-runner-001
      test-shards: ${{ needs.discover-packages.outputs.cuda_test_shards }}
      timeout-minutes: 40

  build-distributions:
    name: Build
    needs: [discover-packages, tag-guard]
    uses: ./.github/workflows/build-distributions.yml
    with:
      artifact-prefix: wheels
      checkout-ref: ${{ github.event.release.tag_name }}
      native-build-packages: ${{ needs.discover-packages.outputs.native_build_packages }}
      python-build-packages: ${{ needs.discover-packages.outputs.python_build_packages }}
      retention-days: 90

  validate-release-distributions:
    name: Validate
    needs: [build-distributions]
    uses: ./.github/workflows/validate-distributions.yml
    with:
      artifact-prefix: wheels

  merge-wheels:
    name: Merge wheels into single artifact
    needs: [build-distributions, validate-release-distributions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-wheels
          pattern: wheels-*
          delete-merged: true
          retention-days: 90

  publish:
    name: Publish to JetBrains Packages + attach Release assets
    needs:
      - merge-wheels
      - python-tests-linux-amd64
      - python-tests-minimum
      - python-tests-latest
      - python-tests-macos-arm64
      - python-tests-linux-arm64
      - python-tests-cuda
      - rust-tests
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all wheels
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-wheels
          path: dist/

      - name: List wheels
        run: |
          echo "Releasing ${{ github.event.release.tag_name }}. Artifacts:"
          ls -lh dist/*.whl dist/*.tar.gz

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Publish release wheels to JetBrains Packages
        env:
          TWINE_USERNAME: ${{ vars.JETBRAINS_PACKAGES_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.JETBRAINS_PACKAGES_TOKEN }}
        run: |
          uv run --isolated --no-project --with twine==6.2.0 \
            python .github/scripts/twine_upload.py upload \
            --repository-url https://packages.jetbrains.team/pypi/p/fed/python/legacy/ \
            dist/*.whl dist/*.tar.gz

      - name: Attach wheels to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/*.whl dist/*.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"
