name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to resume.
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  pages: write

concurrency:
  group: publish-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Verify published Release assets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      target_sha: ${{ steps.manifest.outputs.target_sha }}
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.(alpha|beta|rc|post)[0-9]+)?$ ]]; then
            echo "::error::Unsupported release tag: $REQUESTED_TAG"
            exit 1
          fi
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$REQUESTED_TAG" > /tmp/release.json
          if [[ "$(jq -r .draft /tmp/release.json)" != "false" ]]; then
            echo "::error::$REQUESTED_TAG is not a published Release."
            exit 1
          fi
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Download attached release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir assets
          gh release download "$TAG" --dir assets --repo "$GITHUB_REPOSITORY"

      - name: Resolve immutable tag
        id: tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          echo "sha=$(git rev-parse "refs/tags/$TAG^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Verify release manifest and assets
        id: manifest
        run: >-
          python3 .github/scripts/release.py verify-manifest
          --asset-dir assets
          --manifest assets/release-manifest.json
          --expected-repository "$GITHUB_REPOSITORY"
          --expected-tag '${{ steps.release.outputs.tag }}'
          --expected-target-sha '${{ steps.tag.outputs.sha }}'
          --github-output "$GITHUB_OUTPUT"

      - name: Retain verified publication input
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: publication-candidate
          path: assets/
          retention-days: 14

  publish:
    name: Publish attached assets to JetBrains Packages
    needs: [resolve]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Download verified publication input
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: publication-candidate
          path: assets

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Reverify publication input
        run: >-
          python3 .github/scripts/release.py verify-manifest
          --asset-dir assets
          --manifest assets/release-manifest.json
          --expected-repository "$GITHUB_REPOSITORY"
          --expected-tag '${{ needs.resolve.outputs.tag }}'
          --expected-target-sha '${{ needs.resolve.outputs.target_sha }}'

      - name: Publish or verify every distribution
        env:
          TWINE_USERNAME: ${{ vars.JETBRAINS_PACKAGES_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.JETBRAINS_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          uv run --isolated --no-project --with twine==6.2.0 \
            python .github/scripts/publish_release.py \
            --asset-dir assets \
            --manifest assets/release-manifest.json \
            --repository-url https://packages.jetbrains.team/pypi/p/fed/python/legacy/ \
            --simple-url https://packages.jetbrains.team/pypi/p/fed/python/simple/ \
            | tee /tmp/publication.txt

      - name: Write package publication summary
        run: |
          {
            echo "## Package publication"
            echo
            echo '```text'
            cat /tmp/publication.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-docs:
    name: Deploy immutable release documentation
    needs: [resolve, publish]
    permissions:
      contents: write
      id-token: write
      pages: write
    uses: JetBrains-Research/opaque/.github/workflows/docs.yml@main
    with:
      checkout_ref: ${{ needs.resolve.outputs.target_sha }}
      release_version: ${{ needs.resolve.outputs.version }}

  complete:
    name: Release deployment complete
    needs: [resolve, publish, deploy-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Write completion summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Release deployed

          \`${{ needs.resolve.outputs.tag }}\` was published from
          \`${{ needs.resolve.outputs.target_sha }}\`.

          The attached distributions are present in JetBrains Packages and
          documentation \`${{ needs.resolve.outputs.version }}\` is deployed.
          EOF
