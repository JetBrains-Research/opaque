name: Release

# Fires when a draft Release is published (or a Release is created
# directly via `gh release create`). Publishing creates the git tag at
# `target_commitish` (default: main HEAD). Drafts are maintained on
# every main merge by the `upsert-draft` job in ci.yml.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tag-guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Fetch main
        run: git fetch origin main
      - name: Check tag commit is reachable from origin/main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/main."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is on main — proceeding."

  attach-teamcity-assets:
    name: Attach validated TeamCity assets
    needs: [tag-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TEAMCITY_URL: https://jbr-fed.teamcity.com
      TEAMCITY_BUILD_TYPE: Opaque_Opaque_ValidateDistributions
      TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve successful TeamCity validation
        id: teamcity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $TEAMCITY_TOKEN" \
            --header 'Accept: application/json' \
            --get "$TEAMCITY_URL/app/rest/builds" \
            --data-urlencode "locator=buildType:$TEAMCITY_BUILD_TYPE,status:SUCCESS,state:finished,revision:$TAG_SHA,branch:$RELEASE_TAG,count:2" \
            --data-urlencode 'fields=count,build(id,branchName,status,revisions(revision(version)))')
          COUNT=$(jq -r '.count' <<< "$RESPONSE")
          if [[ "$COUNT" != 1 ]]; then
            echo "::error::Expected exactly one successful TeamCity validation for $RELEASE_TAG at $TAG_SHA, found $COUNT."
            exit 1
          fi
          BUILD_ID=$(jq -r '.build[0].id' <<< "$RESPONSE")
          BUILD_SHA=$(jq -r '.build[0].revisions.revision[0].version' <<< "$RESPONSE")
          test "$BUILD_SHA" = "$TAG_SHA"
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "tag-sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Download and verify validated bundle
        env:
          BUILD_ID: ${{ steps.teamcity.outputs.build-id }}
          TAG_SHA: ${{ steps.teamcity.outputs.tag-sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            --header "Authorization: Bearer $TEAMCITY_TOKEN" \
            --output validated-distributions.zip \
            "$TEAMCITY_URL/repository/download/$TEAMCITY_BUILD_TYPE/$BUILD_ID:id/validated-distributions.zip"
          mkdir dist
          unzip -q validated-distributions.zip -d dist
          test "$(sed -n 's/^commit=//p' dist/teamcity-artifact-identity.txt)" = "$TAG_SHA"
          test "$(sed -n 's/^version=//p' dist/teamcity-artifact-identity.txt)" = "${RELEASE_TAG#v}"
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l | tr -d ' ')" = 13
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = 1

      - name: Attach validated assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  release-python-tests:
    name: Release Python tests
    needs: [tag-guard]
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      devices: >-
        [{"name":"cpu","label":"CPU","os":"ubuntu-latest","marker":"not cuda and not mps","xdist":"-n auto --dist loadscope"}]
      test-shards: '[{"name":"all","paths":"packages tests"}]'

  release-rust-tests:
    name: Release Rust tests
    needs: [tag-guard]
    uses: ./.github/workflows/reusable-rust-tests.yml
    with:
      checkout-ref: ${{ github.event.release.tag_name }}

  build-distributions:
    name: Build distribution artifacts @ ${{ github.event.release.tag_name }}
    needs: [tag-guard]
    uses: ./.github/workflows/reusable-build-distributions.yml
    with:
      artifact-prefix: wheels
      checkout-ref: ${{ github.event.release.tag_name }}
      retention-days: 90

  validate-release-distributions:
    name: Validate release distribution artifacts
    needs: [build-distributions]
    uses: ./.github/workflows/reusable-validate-distributions.yml
    with:
      artifact-prefix: wheels
      checkout-ref: ${{ github.event.release.tag_name }}

  merge-wheels:
    name: Merge wheels into single artifact
    needs: [build-distributions, validate-release-distributions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-wheels
          pattern: wheels-*
          delete-merged: true
          retention-days: 90

  publish:
    name: Publish to JetBrains Packages + attach Release assets
    needs: [merge-wheels, release-python-tests, release-rust-tests, validate-release-distributions]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all wheels
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-wheels
          path: dist/

      - name: List wheels
        run: |
          echo "Releasing ${{ github.event.release.tag_name }}. Artifacts:"
          ls -lh dist/*.whl dist/*.tar.gz

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Publish release wheels to JetBrains Packages
        env:
          TWINE_USERNAME: ${{ vars.JETBRAINS_PACKAGES_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.JETBRAINS_PACKAGES_TOKEN }}
        run: |
          uv run --isolated --no-project --with twine==6.2.0 \
            python .github/scripts/twine_upload.py upload \
            --repository-url https://packages.jetbrains.team/pypi/p/fed/python/legacy/ \
            dist/*.whl dist/*.tar.gz

      - name: Attach wheels to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/*.whl dist/*.tar.gz \
            --clobber --repo "$GITHUB_REPOSITORY"
