name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests - ${{ matrix.name }} - Py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU
            os: ubuntu-latest
            python-version: "3.11"
            # slow tests run only on push to main; PRs exclude them via `and not slow`.
            marker-expression: "not cuda and not mps and not slow"
            coverage-suffix: ""
          - name: MPS
            os: macos-latest
            python-version: "3.11"
            # MPS runner picks up mps-marked tests; cuda-marked auto-skip.
            marker-expression: "not cuda and not slow"
            coverage-suffix: "-mps"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --lib --manifest-path packages/opaque-accounting/Cargo.toml

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --all-packages --extra all

      - name: Run accounting tests
        run: |
          uv run pytest packages/opaque-accounting/tests \
            --cov=opaque.accounting \
            --cov-report=xml:coverage-accounting${{ matrix.coverage-suffix }}.xml \
            -v

      - name: No stray src/opaque/__init__.py in sub-packages
        run: |
          stray=$(find packages -path '*/src/opaque/__init__.py' -print)
          if [ -n "$stray" ]; then
            echo "ERROR: stray src/opaque/__init__.py: $stray"; exit 1
          fi

      - name: Cross-package import smoke test
        run: |
          uv run python -c "import opaque.core, opaque.distributed, opaque.functional, opaque.dpsgd, opaque.dpsgd.sampling, opaque.dpftrl, opaque.auditing, opaque.performance, opaque.performance.profiling, opaque.performance.kernels, opaque.performance.torch.checkpoint, opaque.performance.huggingface, opaque.huggingface, opaque.huggingface.patches, opaque.accounting; print('OK')"

      - name: Compute marker expression
        id: marker
        shell: bash
        run: |
          # On push to main, drop the `and not slow` guard so slow tests run.
          # On PRs, use the matrix expression unchanged.
          expr='${{ matrix.marker-expression }}'
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            expr="${expr// and not slow/}"
          fi
          echo "expression=$expr" >> "$GITHUB_OUTPUT"

      - name: Run full non-GPU test suite
        run: |
          uv run pytest \
            packages/opaque-core/tests \
            packages/opaque-dpsgd/tests \
            packages/opaque-dpftrl/tests \
            packages/opaque-auditing/tests \
            packages/opaque-performance/tests \
            packages/opaque-huggingface/tests \
            -m "${{ steps.marker.outputs.expression }}" \
            --cov=opaque \
            --cov-report=xml:coverage-core${{ matrix.coverage-suffix }}.xml \
            -v

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage-accounting${{ matrix.coverage-suffix }}.xml,./coverage-core${{ matrix.coverage-suffix }}.xml
          fail_ci_if_error: false

  test-cuda:
    name: CUDA Tests
    runs-on: GPU-runner-001
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --all-packages --extra all

      - name: Run CUDA tests
        run: |
          uv run pytest \
            packages/opaque-core/tests \
            packages/opaque-dpsgd/tests \
            packages/opaque-dpftrl/tests \
            packages/opaque-auditing/tests \
            packages/opaque-performance/tests \
            packages/opaque-huggingface/tests \
            -m "cuda" \
            --cov=opaque \
            --cov-report=xml \
            -v

      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: cuda
          fail_ci_if_error: false

  build-python-wheel:
    name: Build ${{ matrix.package }}
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - opaque
          - opaque-core
          - opaque-dpsgd
          - opaque-dpftrl
          - opaque-auditing
          - opaque-performance
          - opaque-huggingface

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set dev version
        run: |
          DEV_VERSION="0.0.0.dev0+${{ github.run_number }}"
          cd packages/${{ matrix.package }} && uv version $DEV_VERSION

      - name: Build wheel
        run: |
          cd packages/${{ matrix.package }} && uv build --wheel --out-dir ../../dist

      - name: Upload wheel to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}
          path: dist/*.whl
          retention-days: 30

  # Native extension — build per platform
  build-opaque-accounting:
    name: Build opaque-accounting - ${{ matrix.platform }}/${{ matrix.arch }}
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            arch: arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set dev version
        run: |
          DEV_VERSION="0.0.0.dev0+${{ github.run_number }}"
          cd packages/opaque-accounting && uv version $DEV_VERSION

      - name: Build wheel
        run: |
          cd packages/opaque-accounting && uv build --wheel

      - name: Upload wheel to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-opaque-accounting-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*opaque_accounting*.whl
          retention-days: 30

  # Publish all wheels to GCP (main branch only)
  publish-to-gcp:
    name: Publish dev builds to GCP
    needs: [build-python-wheel, build-opaque-accounting]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check if this is a release commit
        id: check_release
        run: |
          VERSION=$(grep '^version = ' packages/opaque/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "$VERSION" != *"dev"* ]]; then
            echo "⏭️  Skipping dev build publish - this is a release version ($VERSION)"
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "📦 Publishing dev build version: $VERSION"
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all wheels
        if: steps.check_release.outputs.is_release == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: List wheels
        if: steps.check_release.outputs.is_release == 'false'
        run: |
          echo "Wheels to publish:"
          ls -lh dist/*.whl

      - name: Authenticate to GCP
        if: steps.check_release.outputs.is_release == 'false'
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 3600s

      - uses: astral-sh/setup-uv@v8.1.0
        if: steps.check_release.outputs.is_release == 'false'

      - name: Publish dev builds to GCP
        if: steps.check_release.outputs.is_release == 'false'
        env:
          UV_PUBLISH_USERNAME: oauth2accesstoken
          UV_PUBLISH_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          uv publish \
            --publish-url https://europe-west4-python.pkg.dev/jetbrains-ml4se-fed/jbr-fed-python/ \
            dist/*.whl
