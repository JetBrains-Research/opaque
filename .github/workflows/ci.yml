name: CI (main)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # main pushes are precious — don't kill in-flight publishes

jobs:
  # ---------------------------------------------------------------------------
  # Tests. Same matrix as the PR gate, but includes `slow` tests and adds a
  # GPU lane. Failure here doesn't block anything (main is already past), but
  # catches regressions that the PR gate's fast suite missed.
  # ---------------------------------------------------------------------------
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        run: cargo test --lib --manifest-path packages/opaque-accounting/Cargo.toml

  python-tests:
    name: Python tests — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU
            os: ubuntu-latest
            python-version: "3.11"
            marker-expression: "not cuda and not mps"
            coverage-suffix: ""
          - name: MPS
            os: macos-latest
            python-version: "3.11"
            marker-expression: "not cuda"
            coverage-suffix: "-mps"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv sync
        run: uv sync --group dev --all-packages --extra all

      - name: pytest
        run: |
          uv run pytest \
            -m "${{ matrix.marker-expression }}" \
            --cov=opaque \
            --cov-report=xml:coverage${{ matrix.coverage-suffix }}.xml \
            -v

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage${{ matrix.coverage-suffix }}.xml
          fail_ci_if_error: false

  python-tests-cuda:
    name: Python tests — CUDA
    runs-on: GPU-runner-001
    needs: [python-tests]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: uv sync
        run: uv sync --group dev --all-packages --extra all

      - name: pytest -m cuda
        run: |
          uv run pytest \
            -m "cuda" \
            --cov=opaque \
            --cov-report=xml:coverage-cuda.xml \
            -v

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage-cuda.xml
          flags: cuda
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Dev wheel builds. Version derived from `setuptools-scm` + the preflight
  # script that writes the umbrella dep pins + Cargo workspace version.
  # Release builds live in release.yml (triggered on `v*` tag push).
  # ---------------------------------------------------------------------------
  build-python-wheels:
    name: Build ${{ matrix.package }}
    needs: [python-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - opaque
          - opaque-core
          - opaque-dpsgd
          - opaque-dpftrl
          - opaque-auditing
          - opaque-performance
          - opaque-huggingface

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight — set build versions from git
        run: bash .github/scripts/set_build_versions.sh

      - name: Build wheel
        run: cd packages/${{ matrix.package }} && uv build --wheel --out-dir ../../dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}
          path: dist/*.whl
          retention-days: 30

  build-accounting-wheels:
    name: Build opaque-accounting — ${{ matrix.platform }}/${{ matrix.arch }}
    needs: [python-tests]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            arch: arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight — set build versions from git
        run: bash .github/scripts/set_build_versions.sh

      - name: Build wheel
        run: cd packages/opaque-accounting && uv build --wheel --out-dir ../../dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-opaque-accounting-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*opaque_accounting*.whl
          retention-days: 30

  publish-dev-wheels:
    name: Publish dev wheels to GCP
    needs: [build-python-wheels, build-accounting-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/*.whl

      - name: Authenticate to GCP
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 3600s

      - uses: astral-sh/setup-uv@v8.1.0

      - name: uv publish
        env:
          UV_PUBLISH_USERNAME: oauth2accesstoken
          UV_PUBLISH_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          uv publish \
            --publish-url https://europe-west4-python.pkg.dev/jetbrains-ml4se-fed/jbr-fed-python/ \
            dist/*.whl
