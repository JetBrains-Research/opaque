name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Quick linting pass (runs first, cheap)
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python formatting
        run: |
          uv run ruff format --check packages/

      - name: Check Python linting
        run: |
          uv run ruff check packages/

      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path packages/opaque-accounting/Cargo.toml -- --check

  # Test accounting: Rust + Python accounting module
  test-accounting:
    name: Accounting Tests - ${{ matrix.platform }}/${{ matrix.arch }} - Py${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
            python-version: "3.11"
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
            python-version: "3.12"

          # Linux ARM64
          - platform: linux
            arch: arm64
            runner: ubuntu-latest-arm64
            python-version: "3.11"
          - platform: linux
            arch: arm64
            runner: ubuntu-latest-arm64
            python-version: "3.12"

          # macOS ARM64
          - platform: macos
            arch: arm64
            runner: macos-latest
            python-version: "3.11"
          - platform: macos
            arch: arm64
            runner: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --lib --manifest-path packages/opaque-accounting/Cargo.toml

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --group cross-validation

      - name: Run Python accounting tests
        run: |
          uv run pytest packages/opaque-accounting/tests \
            -m "not slow" \
            --cov=opaque_accounting \
            --cov-report=xml \
            -v

      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: accounting-${{ matrix.platform }}-${{ matrix.arch }}
          fail_ci_if_error: false

  # Test core: PyTorch DP-SGD functionality
  test-core:
    name: Core Tests - ${{ matrix.platform }}/${{ matrix.arch }} - Py${{ matrix.python-version }}
    needs: [test-accounting]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
            python-version: "3.11"
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
            python-version: "3.12"

          # Linux ARM64
          - platform: linux
            arch: arm64
            runner: ubuntu-latest-arm64
            python-version: "3.11"
          - platform: linux
            arch: arm64
            runner: ubuntu-latest-arm64
            python-version: "3.12"

          # macOS ARM64
          - platform: macos
            arch: arm64
            runner: macos-latest
            python-version: "3.11"
          - platform: macos
            arch: arm64
            runner: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run core tests
        run: |
          uv run pytest \
            packages/opaque/tests/clipping \
            packages/opaque/tests/noise \
            packages/opaque/tests/sampling \
            packages/opaque/tests/utils \
            packages/opaque/tests/profiling \
            packages/opaque/tests/auditing \
            packages/opaque/tests/matrix_factorization \
            packages/opaque/tests/test_dp_ftrl.py \
            --cov=opaque \
            --cov-report=xml \
            -v

      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: core-${{ matrix.platform }}-${{ matrix.arch }}
          fail_ci_if_error: false

  # GPU tests: HuggingFace models + integration (custom runner only)
  test-gpu:
    name: GPU Tests - Py${{ matrix.python-version }}
    runs-on: GPU-runner-001
    needs: [test-core]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --group test

      - name: Run GPU tests
        run: |
          uv run pytest \
            packages/opaque/tests/compat \
            packages/opaque/tests/validation \
            --cov=opaque \
            --cov-report=xml \
            -v

      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: gpu
          fail_ci_if_error: false

  # Build multi-platform wheels for opaque-accounting
  # Pure Python package (opaque-dp) - build once on any platform
  build-opaque-dp:
    name: Build opaque-dp (pure Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set dev version
        run: |
          DEV_VERSION="0.0.0.dev0+${{ github.run_number }}"
          cd packages/opaque && uv version $DEV_VERSION

      - name: Build wheel
        run: |
          cd packages/opaque && uv build --wheel

      - name: Upload wheel to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-opaque-dp
          path: packages/opaque/dist/*.whl
          retention-days: 30

  # Native extension (opaque-accounting) - build per platform
  build-opaque-accounting:
    name: Build opaque-accounting - ${{ matrix.platform }}/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - platform: linux
            arch: amd64
            runner: ubuntu-latest

          # Linux ARM64
          - platform: linux
            arch: arm64
            runner: ubuntu-latest-arm64

          # macOS ARM64
          - platform: macos
            arch: arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set dev version
        run: |
          DEV_VERSION="0.0.0.dev0+${{ github.run_number }}"
          cd packages/opaque-accounting && uv version $DEV_VERSION

      - name: Build wheel
        run: |
          cd packages/opaque-accounting && uv build --wheel

      - name: Upload wheel to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-opaque-accounting-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/opaque-accounting/dist/*.whl
          retention-days: 30

  # Publish all wheels to GCP (main branch only)
  publish-to-gcp:
    name: Publish dev builds to GCP
    needs: [build-opaque-dp, build-opaque-accounting]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check if this is a release commit
        id: check_release
        run: |
          VERSION=$(grep '^version = ' packages/opaque/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "$VERSION" != *"dev"* ]]; then
            echo "⏭️  Skipping dev build publish - this is a release version ($VERSION)"
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "📦 Publishing dev build version: $VERSION"
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all wheels
        if: steps.check_release.outputs.is_release == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: List wheels
        if: steps.check_release.outputs.is_release == 'false'
        run: |
          echo "Wheels to publish:"
          ls -lh dist/*.whl

      - name: Authenticate to GCP
        if: steps.check_release.outputs.is_release == 'false'
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Configure GCP Artifact Registry
        if: steps.check_release.outputs.is_release == 'false'
        run: |
          gcloud artifacts print-settings python \
            --project=jetbrains-ml4se-fed \
            --repository=jbr-fed-python \
            --location=europe-west4 > ~/.pypirc

      - uses: astral-sh/setup-uv@v3
        if: steps.check_release.outputs.is_release == 'false'
        with:
          version: "latest"

      - name: Publish dev builds to GCP
        if: steps.check_release.outputs.is_release == 'false'
        run: |
          uv publish \
            --publish-url https://europe-west4-python.pkg.dev/jetbrains-ml4se-fed/jbr-fed-python/ \
            dist/*.whl
