name: CI (main)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # main pushes are precious — don't kill in-flight publishes

jobs:
  discover-packages:
    name: Discover package matrices
    runs-on: ubuntu-latest
    outputs:
      test_shards: ${{ steps.discover.outputs.test_shards }}
      python_build_packages: ${{ steps.discover.outputs.python_build_packages }}
      native_build_packages: ${{ steps.discover.outputs.native_build_packages }}
    steps:
      - uses: actions/checkout@v5

      - name: Discover packages
        id: discover
        run: python3 .github/scripts/discover_package_matrices.py --github-output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Tests. Same matrix as the PR gate, but includes `slow` tests and adds a
  # GPU lane. Test failures block publishing, except for the explicitly soft
  # GPU matrix leg.
  # ---------------------------------------------------------------------------
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # No `--lib`: also run the crate's doc-tests so documented API examples
      # can't rot. (No Rust integration tests — the crate's tests/ dir is Python.)
      - name: cargo test
        run: cargo test --manifest-path packages/opaque-accounting/Cargo.toml

  # Same platform matrix as the PR gate (see pr.yml for the full rationale),
  # but this lane keeps `slow` tests and the GPU leg runs the whole `cuda`
  # marker. The GPU platform stays a single unsharded, serial, soft leg.
  python-tests:
    name: opaque-${{ matrix.shard.name }} (${{ matrix.device.label }})
    needs: [discover-packages]
    runs-on: ${{ matrix.device.os }}
    continue-on-error: ${{ matrix.soft == true }}
    timeout-minutes: 40  # safety net; slow tests make these jobs longer than the PR gate
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.discover-packages.outputs.test_shards) }}
        device:
          - name: cpu
            label: CPU
            os: ubuntu-latest
            marker: "not cuda and not mps"
            xdist: "-n auto --dist loadscope"
          - name: mps
            label: MPS
            os: macos-latest
            marker: "not cuda"
            xdist: "-n auto --dist loadscope"
        include:
          - shard:
              name: all
              paths: packages tests
            device:
              name: gpu
              label: CUDA
              os: GPU-runner-001
              marker: "cuda"
              # No xdist (single GPU); `-rs` surfaces skip reasons.
              xdist: "-rs"
            soft: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: uv sync
        run: uv sync --group dev --all-packages --extra all

      - name: pytest
        run: |
          uv run pytest ${{ matrix.shard.paths }} \
            -m "${{ matrix.device.marker }}" \
            ${{ matrix.device.xdist }} \
            --cov=opaque \
            --cov-report=xml:coverage.xml \
            -q

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.device.name }}-${{ matrix.shard.name }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Dev wheel builds. Version derived from `setuptools-scm` + the preflight
  # script that writes the opaque dep pins + Cargo workspace version.
  # Release builds live in release.yml (triggered on `v*` tag push).
  # ---------------------------------------------------------------------------
  build-python-wheels:
    name: Build ${{ matrix.package.dist }}
    needs: [discover-packages]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-packages.outputs.python_build_packages) }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight — set build versions from git
        run: bash .github/scripts/set_build_versions.sh

      - name: Build wheel
        run: cd ${{ matrix.package.path }} && uv build --wheel --out-dir ../../dist

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.package.dist }}
          path: dist/*.whl
          retention-days: 30

  build-opaque-wheel:
    name: Build opaque
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight — set build versions from git
        run: bash .github/scripts/set_build_versions.sh

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-opaque
          path: dist/opaque-*.whl
          retention-days: 30

  build-native-wheels:
    name: Build ${{ matrix.package.dist }} — ${{ matrix.target.platform }}/${{ matrix.target.arch }}
    needs: [discover-packages]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-packages.outputs.native_build_packages) }}
        target:
          - platform: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
          - platform: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            manylinux: off

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight — set build versions from git
        run: bash .github/scripts/set_build_versions.sh

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: ${{ matrix.package.path }}
          target: ${{ matrix.target.target }}
          manylinux: ${{ matrix.target.manylinux }}
          args: >-
            --release
            --locked
            --interpreter python3.11
            --out ../../dist
            --compatibility pypi

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.package.dist }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: dist/*.whl
          retention-days: 30

  build-accounting-sdist:
    name: Build opaque-accounting sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight — set build versions from git
        run: bash .github/scripts/set_build_versions.sh

      - name: Build sdist
        run: cd packages/opaque-accounting && uv build --sdist --out-dir ../../dist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-opaque-accounting-sdist
          path: dist/*.tar.gz
          retention-days: 30

  merge-wheels:
    name: Merge wheels into single artifact
    needs: [build-python-wheels, build-opaque-wheel, build-native-wheels, build-accounting-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@v6
        with:
          name: dev-wheels
          pattern: wheels-*
          delete-merged: true
          retention-days: 30

  publish-dev-wheels:
    name: Publish dev wheels to GCP
    needs: [merge-wheels, rust-tests, python-tests]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Download all wheels
        uses: actions/download-artifact@v6
        with:
          name: dev-wheels
          path: dist/

      - name: List artifacts
        run: ls -lh dist/*.whl dist/*.tar.gz

      - name: Authenticate to GCP
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 3600s

      - uses: astral-sh/setup-uv@v8.1.0

      - name: uv publish
        env:
          UV_PUBLISH_USERNAME: oauth2accesstoken
          UV_PUBLISH_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          uv publish \
            --publish-url "${{ vars.PYTHON_REPOSITORY_URL }}" \
            dist/*.whl dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # Upsert the draft GitHub Release for the next version. The draft is the
  # preparation surface — maintainers edit title, tag, Highlights, etc. in
  # the GH UI. This job refreshes only the `<!-- auto:* -->`-fenced section
  # with git-cliff output so hand edits outside the fence are preserved.
  # Publishing the draft triggers `release.yml`.
  # ---------------------------------------------------------------------------
  upsert-draft:
    name: Upsert draft Release for next version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      models: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version (bump patch from last stable)
        id: next
        run: |
          set -euo pipefail
          LAST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort --version-sort --reverse | head -1 || true)
          if [[ -z "$LAST" ]]; then
            NEXT_TAG="v0.0.1"
          else
            BASE="${LAST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "Computed next version tag: $NEXT_TAG (from last: ${LAST:-<none>})"

      - name: Generate auto-section with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.next.outputs.tag }} --strip header
        env:
          OUTPUT: AUTO_SECTION.md

      - name: Install gh models extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh extension install github/gh-models

      - name: Generate AI highlights
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST_TAG: ${{ steps.next.outputs.last }}
        run: |
          set -euo pipefail

          if [[ -n "$LAST_TAG" ]]; then
            git log "${LAST_TAG}..HEAD" --format='- %s' --no-merges > /tmp/commits.txt
          else
            git log --format='- %s' --no-merges > /tmp/commits.txt
          fi

          if [[ ! -s /tmp/commits.txt ]]; then
            echo "<!-- No unreleased commits yet. -->" > /tmp/ai_highlights.md
            exit 0
          fi

          cat > /tmp/prompt.md <<EOF
          You are summarizing release changes for Opaque, a PyTorch
          differential-privacy library (DP-SGD, DP-FTRL, privacy accounting).

          Below are the commits landed on main since the last release
          (${LAST_TAG:-initial}). Produce 3–7 release highlights for library users.

          Rules:
          - Return only a markdown bulleted list. No preamble, no headers, no code fences.
          - Group related commits into one bullet; deduplicate overlap.
          - Emphasize user-facing impact (APIs, behavior, correctness).
          - Skip pure refactors, chore, test, or ci commits unless they change user-visible behavior.
          - Use imperative present tense ("Add", "Fix", "Document").

          Commits:

          $(cat /tmp/commits.txt)
          EOF

          if ! gh models run openai/gpt-4o-mini < /tmp/prompt.md > /tmp/ai_highlights.md 2>/tmp/ai_err; then
            echo "AI summary failed: $(cat /tmp/ai_err)" >&2
            echo "<!-- AI summary unavailable. -->" > /tmp/ai_highlights.md
          fi

          echo "--- AI highlights ---"
          cat /tmp/ai_highlights.md

      - name: Extract contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST_TAG: ${{ steps.next.outputs.last }}
        run: |
          set -euo pipefail

          if [[ -z "$LAST_TAG" ]]; then
            BASE_REF=$(git rev-list --max-parents=0 HEAD | head -1)
          else
            BASE_REF="$LAST_TAG"
          fi

          gh api --paginate "/repos/$GITHUB_REPOSITORY/compare/${BASE_REF}...HEAD" \
            --jq '[.commits[].author | select(. != null) | .login]' \
            > /tmp/contributors_raw.json || echo '[]' > /tmp/contributors_raw.json

          python3 - <<'PY' > /tmp/contributors.md
          import json, pathlib
          logins = json.loads(pathlib.Path("/tmp/contributors_raw.json").read_text() or "[]")
          # Dedup preserving first-seen order; drop bots.
          seen, unique = set(), []
          for login in logins:
              if not login or login in seen or login.endswith("[bot]"):
                  continue
              seen.add(login)
              unique.append(login)
          if not unique:
              print("<!-- No contributors to credit. -->")
          else:
              handles = ", ".join(f"@{u}" for u in unique)
              print(f"Thanks to {handles} for contributions to this release.")
          PY

          echo "--- Contributors ---"
          cat /tmp/contributors.md

      - name: Upsert draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail

          # Find any open draft Release. One draft at a time; matching on
          # the draft flag (not tag_name) preserves the maintainer's
          # version/title/prose edits.
          DRAFT_ID=$(gh api "/repos/$GITHUB_REPOSITORY/releases" \
            --jq '[.[] | select(.draft == true)] | first | .id // empty')

          if [[ -z "$DRAFT_ID" ]]; then
            echo "No open draft — creating one for $NEXT_TAG."
            python3 - <<'PY' > /tmp/body.md
          import pathlib
          ai = pathlib.Path("/tmp/ai_highlights.md").read_text().rstrip()
          auto = pathlib.Path("AUTO_SECTION.md").read_text()
          contributors = pathlib.Path("/tmp/contributors.md").read_text().rstrip()
          print(f"""<!-- ai:begin -->
          {ai}
          <!-- ai:end -->

          ## What's changed

          <!-- auto:begin -->
          {auto}
          <!-- auto:end -->

          ## Contributors

          <!-- contributors:begin -->
          {contributors}
          <!-- contributors:end -->
          """)
          PY
            gh api --method POST "/repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$NEXT_TAG" \
              -f target_commitish="main" \
              -f name="$NEXT_TAG" \
              -f body="$(cat /tmp/body.md)" \
              -F draft=true \
              -F prerelease=false
          else
            echo "Refreshing fenced sections of existing draft (id=$DRAFT_ID)."
            gh api "/repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" --jq .body > /tmp/body_existing.md
            python3 - <<'PY' > /tmp/body.md
          import pathlib, re
          body = pathlib.Path("/tmp/body_existing.md").read_text()
          auto = pathlib.Path("AUTO_SECTION.md").read_text()
          ai = pathlib.Path("/tmp/ai_highlights.md").read_text().rstrip()
          contributors = pathlib.Path("/tmp/contributors.md").read_text().rstrip()

          def splice(body, begin, end, content):
              fenced = re.compile(re.escape(begin) + r".*?" + re.escape(end), re.DOTALL)
              replacement = f"{begin}\n{content}\n{end}"
              if fenced.search(body):
                  return fenced.sub(replacement, body)
              return body.rstrip() + "\n\n" + replacement + "\n"

          body = splice(body, "<!-- auto:begin -->", "<!-- auto:end -->", auto)
          body = splice(body, "<!-- ai:begin -->", "<!-- ai:end -->", ai)
          body = splice(body, "<!-- contributors:begin -->", "<!-- contributors:end -->", contributors)
          print(body, end="")
          PY
            gh api --method PATCH \
              "/repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID" \
              -f body="$(cat /tmp/body.md)"
          fi
