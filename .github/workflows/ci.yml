name: CI (main)

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # main pushes are precious — don't kill in-flight publishes

jobs:
  # ---------------------------------------------------------------------------
  # Package discovery
  # ---------------------------------------------------------------------------
  discover-packages:
    name: Discover package matrices
    runs-on: ubuntu-latest
    outputs:
      cuda_test_shards: ${{ steps.discover.outputs.cuda_test_shards }}
      distributed_test_shards: ${{ steps.discover.outputs.distributed_test_shards }}
      native_build_packages: ${{ steps.discover.outputs.native_build_packages }}
      python_build_packages: ${{ steps.discover.outputs.python_build_packages }}
      test_shards: ${{ steps.discover.outputs.test_shards }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Discover packages
        id: discover
        run: python3 .github/scripts/discover_package_matrices.py --github-output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Rust tests
  # ---------------------------------------------------------------------------
  rust-tests:
    name: Rust
    uses: ./.github/workflows/rust-tests.yml
    with:
      include-slow: true

  # ---------------------------------------------------------------------------
  # Python tests
  #
  # Main repeats every PR environment and includes slow tests in platform lanes.
  # Every environment gates distribution publishing.
  # ---------------------------------------------------------------------------
  python-tests-linux-amd64:
    name: Linux amd64 (locked)
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: linux-amd64
      pytest-marker: not cuda and not mps and not distributed
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 40

  python-tests-distributed:
    name: Linux amd64 (distributed)
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: linux-distributed
      pytest-marker: distributed and not cuda
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.distributed_test_shards }}
      timeout-minutes: 30

  python-tests-minimum:
    name: Linux amd64 (minimum dependencies)
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-test-failure: true
      dependency-selection: minimum
      environment-name: minimum-dependencies
      pytest-marker: not cuda and not mps and not slow and not distributed
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.11"
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-latest:
    name: Linux amd64 (latest dependencies)
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      dependency-selection: latest
      environment-name: latest-dependencies
      pytest-marker: not cuda and not mps and not slow and not distributed
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.13"
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-macos-arm64:
    name: macOS arm64 (locked)
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: mps
      pytest-marker: not cuda and not distributed
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: macos-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 40

  python-tests-linux-arm64:
    name: Linux arm64 (locked)
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: linux-aarch64
      pytest-marker: not cuda and not mps and not distributed
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-24.04-arm
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-cuda:
    name: CUDA (locked)
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: cuda
      pytest-marker: cuda
      pytest-xdist: -rs
      report-durations: true
      runner: GPU-runner-001
      test-shards: ${{ needs.discover-packages.outputs.cuda_test_shards }}
      timeout-minutes: 40

  python-tests-cuda-minimum:
    name: CUDA (minimum dependencies)
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-test-failure: true
      dependency-selection: minimum
      environment-name: cuda-minimum-dependencies
      pytest-marker: cuda and not slow
      pytest-xdist: -rs
      python-version: "3.11"
      report-durations: true
      runner: GPU-runner-001
      test-shards: ${{ needs.discover-packages.outputs.cuda_test_shards }}
      timeout-minutes: 60

  python-tests-cuda-latest:
    name: CUDA (latest dependencies)
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      dependency-selection: latest
      environment-name: cuda-latest-dependencies
      pytest-marker: cuda and not slow
      pytest-xdist: -rs
      python-version: "3.13"
      report-durations: true
      runner: GPU-runner-001
      test-shards: ${{ needs.discover-packages.outputs.cuda_test_shards }}
      timeout-minutes: 60

  qodana:
    name: Qodana
    if: (success() || failure()) && github.ref == 'refs/heads/main'
    needs:
      - python-tests-linux-amd64
      - python-tests-distributed
      - python-tests-macos-arm64
      - python-tests-linux-arm64
      - python-tests-cuda
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    uses: ./.github/workflows/qodana.yml
    with:
      coverage-artifact-pattern: coverage-locked-*
      fail-on-problems: false
      pr-mode: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Dev wheel builds. Version derived from `setuptools-scm` + the preflight
  # script that writes the opaque dep pins + Cargo workspace version.
  # Release builds live in release.yml (triggered on `v*` tag push).
  # ---------------------------------------------------------------------------
  build-distributions:
    name: Build
    needs: [discover-packages]
    uses: ./.github/workflows/build-distributions.yml
    with:
      artifact-prefix: wheels
      native-build-packages: ${{ needs.discover-packages.outputs.native_build_packages }}
      python-build-packages: ${{ needs.discover-packages.outputs.python_build_packages }}
      retention-days: 30

  validate-distributions:
    name: Validate
    needs: [build-distributions]
    uses: ./.github/workflows/validate-distributions.yml
    with:
      artifact-prefix: wheels

  merge-wheels:
    name: Merge wheels into single artifact
    needs: [build-distributions, validate-distributions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dev-wheels
          pattern: wheels-*
          delete-merged: true
          retention-days: 30

  publish-dev-wheels:
    name: Publish dev wheels to JetBrains Packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - merge-wheels
      - python-tests-linux-amd64
      - python-tests-distributed
      - python-tests-minimum
      - python-tests-latest
      - python-tests-macos-arm64
      - python-tests-linux-arm64
      - python-tests-cuda
      - python-tests-cuda-minimum
      - python-tests-cuda-latest
      - rust-tests
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all wheels
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dev-wheels
          path: dist/

      - name: List artifacts
        run: ls -lh dist/*.whl dist/*.tar.gz

      - uses: ./.github/actions/setup-python

      - name: Publish to JetBrains Packages
        env:
          TWINE_USERNAME: ${{ vars.JETBRAINS_PACKAGES_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.JETBRAINS_PACKAGES_TOKEN }}
        run: |
          uv run --isolated --no-project --with twine==6.2.0 \
            python .github/scripts/twine_upload.py upload \
            --repository-url https://packages.jetbrains.team/pypi/p/fed/python/legacy/ \
            dist/*.whl dist/*.tar.gz
