name: CI (main)

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # main pushes are precious — don't kill in-flight publishes

jobs:
  # ---------------------------------------------------------------------------
  # Package discovery
  # ---------------------------------------------------------------------------
  discover-packages:
    name: Discover package matrices
    runs-on: ubuntu-latest
    outputs:
      cuda_test_shards: ${{ steps.discover.outputs.cuda_test_shards }}
      native_build_packages: ${{ steps.discover.outputs.native_build_packages }}
      python_build_packages: ${{ steps.discover.outputs.python_build_packages }}
      test_shards: ${{ steps.discover.outputs.test_shards }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Discover packages
        id: discover
        run: python3 .github/scripts/discover_package_matrices.py --github-output "$GITHUB_OUTPUT"

  # TeamCity owns the standard Linux amd64 Python shard matrix and accounting
  # Rust tests. Wait for its exact check on the pushed main revision.
  teamcity-linux-tests:
    name: TeamCity Linux tests waiter
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      checks: read
    steps:
      - name: Wait for TeamCity Linux tests
        id: wait-for-teamcity
        uses: fountainhead/action-wait-for-check@5a908a24814494009c4bb27c242ea38c93c593be # v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: TeamCity Linux tests
          ref: ${{ github.sha }}
          timeoutSeconds: 5400
          intervalSeconds: 15

      - name: Require a successful TeamCity conclusion
        run: |
          conclusion="${{ steps.wait-for-teamcity.outputs.conclusion }}"
          echo "TeamCity Linux tests conclusion: $conclusion"
          test "$conclusion" = "success" || (echo "ERROR: TeamCity Linux tests did not succeed"; exit 1)

  # Main repeats the GitHub-owned PR environments and includes slow tests in
  # platform lanes. Every environment gates distribution publishing.

  python-tests-minimum:
    name: Minimum dependencies
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      allow-test-failure: true
      dependency-selection: minimum
      environment-name: minimum-dependencies
      pytest-marker: not cuda and not mps and not slow
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.11"
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-latest:
    name: Latest dependencies
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      dependency-selection: latest
      environment-name: latest-dependencies
      pytest-marker: not cuda and not mps and not slow
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.12"
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-macos-arm64:
    name: macOS arm64
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: mps
      pytest-marker: not cuda
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: macos-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 40

  python-tests-linux-arm64:
    name: Linux arm64
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: linux-aarch64
      pytest-marker: not cuda and not mps
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-24.04-arm
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-cuda:
    name: CUDA
    needs: [discover-packages]
    uses: ./.github/workflows/python-tests.yml
    with:
      environment-name: cuda
      pytest-marker: cuda
      pytest-xdist: -rs
      report-durations: true
      runner: GPU-runner-001
      test-shards: ${{ needs.discover-packages.outputs.cuda_test_shards }}
      timeout-minutes: 40

  # Stable aggregate checks preserve branch rules while TeamCity supplies the
  # Linux amd64 and Rust results.
  python-tests-gate:
    name: Python tests
    if: ${{ always() }}
    needs:
      - teamcity-linux-tests
      - python-tests-minimum
      - python-tests-latest
      - python-tests-macos-arm64
      - python-tests-linux-arm64
      - python-tests-cuda
    runs-on: ubuntu-latest
    steps:
      - name: Verify test results
        env:
          RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          failures="$(
            jq -r '
              to_entries[]
              | select(.value.result != "success")
              | "\(.key): \(.value.result)"
            ' <<< "$RESULTS"
          )"

          if [[ -n "$failures" ]]; then
            echo "::error::Required Python test jobs did not succeed:"
            echo "$failures"
            exit 1
          fi

  rust-tests-gate:
    name: Rust tests gate
    if: ${{ always() }}
    needs: [teamcity-linux-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify test results
        env:
          RESULT: ${{ needs.teamcity-linux-tests.result }}
        shell: bash
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::Rust tests finished with result: $RESULT"
            exit 1
          fi

  qodana:
    name: Qodana
    if: always() && github.ref == 'refs/heads/main'
    needs:
      - python-tests-macos-arm64
      - python-tests-linux-arm64
      - python-tests-cuda
    permissions:
      actions: read
      checks: write
      contents: read
      security-events: write
    uses: ./.github/workflows/qodana.yml
    with:
      coverage-artifact-pattern: coverage-locked-*
      fail-on-problems: false
      pr-mode: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Dev wheel builds. Version derived from `setuptools-scm` + the preflight
  # script that writes the opaque dep pins + Cargo workspace version.
  # Release builds live in release.yml (triggered on `v*` tag push).
  # ---------------------------------------------------------------------------
  build-distributions:
    name: Build
    needs: [discover-packages, python-tests-gate, rust-tests-gate]
    uses: ./.github/workflows/build-distributions.yml
    with:
      artifact-prefix: wheels
      native-build-packages: ${{ needs.discover-packages.outputs.native_build_packages }}
      python-build-packages: ${{ needs.discover-packages.outputs.python_build_packages }}
      retention-days: 30

  validate-distributions:
    name: Validate
    needs: [build-distributions]
    uses: ./.github/workflows/validate-distributions.yml
    with:
      artifact-prefix: wheels

  merge-wheels:
    name: Merge wheels into single artifact
    needs: [build-distributions, validate-distributions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact/merge@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dev-wheels
          pattern: wheels-*
          delete-merged: true
          retention-days: 30

  publish-dev-wheels:
    name: Publish dev wheels to JetBrains Packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - merge-wheels
      - python-tests-gate
      - rust-tests-gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download all wheels
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dev-wheels
          path: dist/

      - name: List artifacts
        run: ls -lh dist/*.whl dist/*.tar.gz

      - uses: ./.github/actions/setup-python

      - name: Publish to JetBrains Packages
        env:
          TWINE_USERNAME: ${{ vars.JETBRAINS_PACKAGES_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.JETBRAINS_PACKAGES_TOKEN }}
        run: |
          uv run --isolated --no-project --with twine==6.2.0 \
            python .github/scripts/twine_upload.py upload \
            --repository-url https://packages.jetbrains.team/pypi/p/fed/python/legacy/ \
            dist/*.whl dist/*.tar.gz
