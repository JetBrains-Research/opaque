name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new workflow with the same group name is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Core Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run core tests (clipping, noise, sampling, utils, profiling)
        run: |
          uv run pytest tests/clipping tests/noise tests/sampling tests/utils tests/profiling --cov=opaque --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: core
          name: codecov-core-py${{ matrix.python-version }}
          fail_ci_if_error: false

  test-compat-gpu:
    name: Compat Tests (GPU) - Python ${{ matrix.python-version }}
    runs-on: GPU-runner-001
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12" ]
    # Using specific runner name from org-level shared runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group dev --group compat

      - name: Run all compat tests (including GPU-specific)
        run: |
          uv run pytest tests/compat tests/validation --cov=opaque --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: compat-gpu
          name: codecov-compat-gpu-py${{ matrix.python-version }}
          fail_ci_if_error: false

  autoformat:
    name: Auto-format (PRs only)
    runs-on: ubuntu-latest
    # Only run on PRs, not on main branch pushes
    if: github.event_name == 'pull_request'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync

      - name: Run ruff format
        run: |
          uv run ruff format src/ tests/

      - name: Run ruff check with autofixes
        run: |
          uv run ruff check --fix src/ tests/ || true

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Auto-format with ruff

          🤖 Automated formatting by GitHub Actions"
          git push

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    # Wait for autoformat on PRs, run immediately on main
    needs: [autoformat]
    if: always() && (needs.autoformat.result == 'success' || needs.autoformat.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # On PRs, get the latest commit (may have been updated by autoformat)
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Pull latest changes (in case autoformat pushed)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.head_ref }}
          git checkout ${{ github.head_ref }}
          git pull origin ${{ github.head_ref }} || true

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync

      - name: Check formatting with ruff
        run: |
          uv run ruff format --check src/ tests/

      - name: Lint with ruff
        run: |
          uv run ruff check src/ tests/

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        run: |
          uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
