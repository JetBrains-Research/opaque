name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests - ${{ matrix.name }} - Py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU
            os: ubuntu-latest
            python-version: "3.11"
            marker-expression: "not gpu"
            coverage-suffix: ""
          - name: MPS
            os: macos-latest
            python-version: "3.11"
            marker-expression: "not gpu or mps_compatible"
            coverage-suffix: "-mps"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        run: cargo test --lib --manifest-path packages/opaque-accounting/Cargo.toml

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --group compat --all-packages

      - name: Run accounting tests
        run: |
          uv run pytest packages/opaque-accounting/tests \
            --cov=opaque_accounting \
            --cov-report=xml:coverage-accounting${{ matrix.coverage-suffix }}.xml \
            -v

      - name: Run core tests
        run: |
          uv run pytest packages/opaque/tests \
            -m "${{ matrix.marker-expression }}" \
            --cov=opaque \
            --cov-report=xml:coverage-core${{ matrix.coverage-suffix }}.xml \
            -v

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage-accounting${{ matrix.coverage-suffix }}.xml,./coverage-core${{ matrix.coverage-suffix }}.xml
          fail_ci_if_error: false

  test-cuda:
    name: CUDA Tests
    runs-on: GPU-runner-001
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --group compat --all-packages

      - name: Run CUDA tests
        run: |
          uv run pytest packages/opaque/tests \
            -m "(gpu or cuda) and not hf_auth_required" \
            --cov=opaque \
            --cov-report=xml \
            -v

      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: cuda
          fail_ci_if_error: false

  build-opaque-dp:
    name: Build opaque-dp
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set dev version
        run: |
          DEV_VERSION="0.0.0.dev0+${{ github.run_number }}"
          cd packages/opaque && uv version $DEV_VERSION

      - name: Build wheel
        run: |
          cd packages/opaque && uv build --wheel

      - name: Upload wheel to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-opaque-dp
          path: dist/*opaque_dp*.whl
          retention-days: 30

  # Native extension — build per platform
  build-opaque-accounting:
    name: Build opaque-accounting - ${{ matrix.platform }}/${{ matrix.arch }}
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            arch: arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set dev version
        run: |
          DEV_VERSION="0.0.0.dev0+${{ github.run_number }}"
          cd packages/opaque-accounting && uv version $DEV_VERSION

      - name: Build wheel
        run: |
          cd packages/opaque-accounting && uv build --wheel

      - name: Upload wheel to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-opaque-accounting-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*opaque_accounting*.whl
          retention-days: 30

  # Publish all wheels to GCP (main branch only)
  publish-to-gcp:
    name: Publish dev builds to GCP
    needs: [build-opaque-dp, build-opaque-accounting]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Check if this is a release commit
        id: check_release
        run: |
          VERSION=$(grep '^version = ' packages/opaque/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "$VERSION" != *"dev"* ]]; then
            echo "⏭️  Skipping dev build publish - this is a release version ($VERSION)"
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "📦 Publishing dev build version: $VERSION"
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Download all wheels
        if: steps.check_release.outputs.is_release == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: List wheels
        if: steps.check_release.outputs.is_release == 'false'
        run: |
          echo "Wheels to publish:"
          ls -lh dist/*.whl

      - name: Authenticate to GCP
        if: steps.check_release.outputs.is_release == 'false'
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 3600s

      - uses: astral-sh/setup-uv@v3
        if: steps.check_release.outputs.is_release == 'false'
        with:
          version: "latest"

      - name: Publish dev builds to GCP
        if: steps.check_release.outputs.is_release == 'false'
        env:
          UV_PUBLISH_USERNAME: oauth2accesstoken
          UV_PUBLISH_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          uv publish \
            --publish-url https://europe-west4-python.pkg.dev/jetbrains-ml4se-fed/jbr-fed-python/ \
            dist/*.whl
