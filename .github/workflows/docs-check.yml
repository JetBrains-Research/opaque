name: Documentation Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'packages/opaque/src/opaque/**/*.py'
      - 'packages/opaque-accounting/src/**/*.rs'
      - 'packages/opaque-accounting/opaque_accounting/**/*.pyi'
      - '.github/workflows/docs-check.yml'

jobs:
  build-docs:
    name: Build documentation (PR check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --group docs --all-packages

      - name: Build documentation
        env:
          PYTHONPATH: packages/opaque/src:packages/opaque-accounting:${{ env.PYTHONPATH }}
        run: |
          uv run mkdocs build

      - name: Check for broken links
        run: |
          echo "Documentation built successfully!"
          echo "Site size:"
          du -sh site/
