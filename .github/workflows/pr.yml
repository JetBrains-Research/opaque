name: PR gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The repo squash-merges, so the PR title becomes the commit message on
  # main. git-cliff groups release-note sections by Conventional Commit
  # type — anything it doesn't recognize lands in the generic "Other"
  # bucket. Keep the accepted-type list here in sync with cliff.toml's
  # `commit_parsers`.
  conventional-title:
    name: Conventional Commits PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            add
            fix
            refactor
            change
            perf
            docs
            test
            ci
            build
            chore
            style
            delete
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject after the colon should start with a lowercase letter.

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        run: cargo test --lib --manifest-path packages/opaque-accounting/Cargo.toml

  python-tests:
    name: Python tests — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CPU
            os: ubuntu-latest
            python-version: "3.11"
            # PR gate excludes `slow`. Full main CI runs slow too.
            marker-expression: "not cuda and not mps and not slow"
            coverage-suffix: ""
          - name: MPS
            os: macos-latest
            python-version: "3.11"
            # MPS runner keeps mps-marked tests; cuda-marked auto-skip.
            marker-expression: "not cuda and not slow"
            coverage-suffix: "-mps"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs tag history for editable installs

      - uses: dtolnay/rust-toolchain@stable  # needed to build opaque-accounting during uv sync

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: uv sync
        run: uv sync --group dev --all-packages --extra all

      - name: pytest
        # `testpaths = ["packages"]` in pyproject.toml makes this the whole
        # suite — no per-package enumeration.
        run: |
          uv run pytest \
            -m "${{ matrix.marker-expression }}" \
            --cov=opaque \
            --cov-report=xml:coverage${{ matrix.coverage-suffix }}.xml \
            -v

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage${{ matrix.coverage-suffix }}.xml
          fail_ci_if_error: false

  smoke-imports:
    name: Cross-package import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: uv sync
        run: uv sync --group dev --all-packages --extra all

      - name: No stray src/opaque/__init__.py in sub-packages
        run: |
          stray=$(find packages -path '*/src/opaque/__init__.py' -print)
          if [ -n "$stray" ]; then
            echo "ERROR: stray src/opaque/__init__.py: $stray"; exit 1
          fi

      - name: Import all public namespaces
        run: |
          uv run python -c "import opaque.core, opaque.distributed, opaque.functional, opaque.dpsgd, opaque.dpsgd.sampling, opaque.dpftrl, opaque.auditing, opaque.performance, opaque.performance.profiling, opaque.performance.kernels, opaque.performance.torch.checkpoint, opaque.performance.huggingface, opaque.huggingface, opaque.huggingface.patches, opaque.accounting; print('OK')"

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: uv sync
        run: uv sync --group docs --all-packages

      - name: mkdocs build --strict
        run: uv run mkdocs build --strict

  # ---------------------------------------------------------------------------
  # Preview wheels. Every push to a non-fork PR publishes wheels to GCP AR
  # at a version like `0.2.2.dev3+pr.142.gabc1234`; a sticky PR comment
  # lists install commands. Wheels are cleaned up by pr-cleanup.yml on
  # close.
  # ---------------------------------------------------------------------------
  compute-preview-version:
    name: Compute preview version
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: v
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LAST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort --version-sort --reverse | head -1 || true)
          if [[ -z "$LAST" ]]; then
            BASE="0.0.1"
            DISTANCE=0
          else
            STRIPPED="${LAST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$STRIPPED"
            BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"
            DISTANCE=$(git rev-list --count "${LAST}..HEAD")
          fi
          SHA=$(git rev-parse --short HEAD)
          VERSION="${BASE}.dev${DISTANCE}+pr.${PR_NUMBER}.g${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preview version: $VERSION"

  build-preview-python:
    name: Build preview ${{ matrix.package }}
    needs: [compute-preview-version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - opaque
          - opaque-core
          - opaque-dpsgd
          - opaque-dpftrl
          - opaque-auditing
          - opaque-performance
          - opaque-huggingface
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight
        run: bash .github/scripts/set_build_versions.sh "${{ needs.compute-preview-version.outputs.version }}"

      - name: Build wheel
        run: cd packages/${{ matrix.package }} && uv build --wheel --out-dir ../../dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: preview-wheels-${{ matrix.package }}
          path: dist/*.whl
          retention-days: 14

  build-preview-accounting:
    name: Build preview opaque-accounting — ${{ matrix.platform }}/${{ matrix.arch }}
    needs: [compute-preview-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            arch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight
        run: bash .github/scripts/set_build_versions.sh "${{ needs.compute-preview-version.outputs.version }}"

      - name: Build wheel
        run: cd packages/opaque-accounting && uv build --wheel --out-dir ../../dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: preview-wheels-opaque-accounting-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*opaque_accounting*.whl
          retention-days: 14

  publish-preview:
    name: Publish preview wheels to GCP
    needs: [compute-preview-version, build-preview-python, build-preview-accounting]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all preview wheels
        uses: actions/download-artifact@v4
        with:
          pattern: preview-wheels-*
          path: dist/
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/*.whl

      - name: Authenticate to GCP
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 3600s

      - uses: astral-sh/setup-uv@v8.1.0

      - name: uv publish
        env:
          UV_PUBLISH_USERNAME: oauth2accesstoken
          UV_PUBLISH_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          uv publish \
            --publish-url "${{ vars.PYTHON_REPOSITORY_URL }}" \
            dist/*.whl

      - name: Sticky PR comment with install commands
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview-wheels
          message: |
            ### PR preview wheels published

            Version: `${{ needs.compute-preview-version.outputs.version }}`

            ```bash
            pip install --extra-index-url "${{ vars.PYTHON_REPOSITORY_URL }}simple/" \
              opaque==${{ needs.compute-preview-version.outputs.version }}
            ```

            Individual sub-packages available at the same version — replace
            `opaque` with `opaque-core`, `opaque-dpsgd`, `opaque-dpftrl`,
            `opaque-auditing`, `opaque-performance`, `opaque-huggingface`,
            or `opaque-accounting`.

            Wheels deleted automatically when this PR is closed.

# Lint & format live in `autoformat.yml`. That workflow auto-applies
# ruff format / ruff check --fix, commits any changes to the PR branch,
# and then verifies the tree is clean. If it pushes a fix, this pr.yml
# re-runs against the amended tip — making lint self-gating without
# duplicating the check here.
#
# PR close triggers pr-cleanup.yml, which deletes the preview wheels
# stamped with this PR's number from GCP AR.
