name: PR gate

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The repo squash-merges, so the PR title becomes the commit message on
  # main. git-cliff groups release-note sections by Conventional Commit
  # type — anything it doesn't recognize lands in the generic "Other"
  # bucket. Keep the accepted-type list here in sync with cliff.toml's
  # `commit_parsers`.
  conventional-title:
    name: Conventional Commits PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            add
            fix
            refactor
            change
            perf
            docs
            test
            ci
            build
            chore
            style
            delete
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject after the colon should start with a lowercase letter.

  discover-packages:
    name: Discover package matrices
    runs-on: ubuntu-latest
    outputs:
      test_shards: ${{ steps.discover.outputs.test_shards }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Discover packages
        id: discover
        run: python3 .github/scripts/discover_package_matrices.py --github-output "$GITHUB_OUTPUT"

  rust-test-run:
    uses: ./.github/workflows/reusable-rust-tests.yml

  # Stable aggregate check required by the main branch ruleset. Reusable
  # workflow jobs expose compound check names, so keep this caller-owned gate.
  rust-tests:
    name: Rust tests
    if: always()
    needs: [rust-test-run]
    runs-on: ubuntu-latest
    steps:
      - name: Check Rust test result
        run: |
          result="${{ needs.rust-test-run.result }}"
          echo "rust-test-run result: $result"
          test "$result" = "success" || (echo "ERROR: Rust tests failed"; exit 1)

  # One matrix over CPU/MPS platforms × shards. Parallelism is
  # two-level: the matrix fans shards across runners, and `pytest -n auto`
  # (cpu/mps only) fans across cores within a runner (`--dist loadscope` keeps
  # each class/module on one worker so fixtures/order are preserved).
  # The self-hosted GPU lane is a separate fork-guarded job below.
  python-tests:
    needs: [discover-packages]
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      devices: >-
        [{"name":"cpu","label":"CPU","os":"ubuntu-latest","marker":"not cuda and not mps and not slow","xdist":"-n auto --dist loadscope"},{"name":"mps","label":"MPS","os":"macos-latest","marker":"not cuda and not slow","xdist":"-n auto --dist loadscope"}]
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 30

  # Fork pull requests must never execute untrusted code on the persistent
  # self-hosted GPU runner. Keep this separate from the hosted-runner matrix so
  # the job-level guard can prevent runner allocation entirely.
  python-tests-gpu:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      devices: >-
        [{"name":"gpu","label":"CUDA","os":"GPU-runner-001","marker":"cuda and not slow","xdist":"-rs"}]
      test-shards: '[{"name":"all","paths":"packages tests"}]'
      timeout-minutes: 30

  # Single aggregating status check for Python tests — ensures all test legs pass.
  # This is the check required in branch protection (alongside rust-tests).
  # The GPU leg is required for repo PRs but skipped for fork PRs.
  # `if: always()` makes the gate report a failure when a shard fails.
  python-tests-gate:
    name: Python tests
    if: always()
    needs: [python-tests, python-tests-gpu]
    runs-on: ubuntu-latest
    steps:
      - name: Check Python test results
        run: |
          cpu_mps="${{ needs.python-tests.result }}"
          gpu="${{ needs.python-tests-gpu.result }}"
          echo "python-tests matrix result: $cpu_mps"
          echo "python-tests-gpu result: $gpu"
          test "$cpu_mps" = "success" || (echo "ERROR: CPU/MPS tests failed"; exit 1)
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            # Fork PRs never get GPU runner allocation — skipped is expected
            if [[ "$gpu" != "skipped" ]]; then
              echo "ERROR: GPU job should be skipped for fork PRs but got: $gpu"
              exit 1
            fi
          else
            # Repo PRs must have GPU tests pass
            test "$gpu" = "success" || (echo "ERROR: GPU tests failed"; exit 1)
          fi

  qodana:
    name: Qodana
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' ||
       github.event.action == 'ready_for_review')
    needs: [python-tests-gate]
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/reusable-qodana.yml
    with:
      checkout-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      coverage-artifact-pattern: qodana-coverage-*
      pr-mode: true
    secrets: inherit

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-python

      - name: uv sync
        run: uv sync --group docs --all-packages

      - name: mkdocs build --strict
        run: uv run mkdocs build --strict

  # ---------------------------------------------------------------------------
  # Preview wheels. Builds every wheel at a version like
  # `0.2.2.dev3+pr.142.gabc1234` and uploads them as workflow artifacts.
  # Reviewers download from the PR's Actions run page and `pip install`
  # the .whl files locally. Artifacts expire per workflow retention.
  # ---------------------------------------------------------------------------
  compute-preview-version:
    name: Compute preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Derive version
        id: v
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LAST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort --version-sort --reverse | head -1 || true)
          if [[ -z "$LAST" ]]; then
            BASE="0.0.1"
            DISTANCE=0
          else
            STRIPPED="${LAST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$STRIPPED"
            BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"
            DISTANCE=$(git rev-list --count "${LAST}..HEAD")
          fi
          SHA=$(git rev-parse --short HEAD)
          VERSION="${BASE}.dev${DISTANCE}+pr.${PR_NUMBER}.g${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preview version: $VERSION"

  build-preview-distributions:
    name: Build preview distribution artifacts
    needs: [compute-preview-version]
    uses: ./.github/workflows/reusable-build-distributions.yml
    with:
      artifact-prefix: preview-wheels
      retention-days: 14
      version: ${{ needs.compute-preview-version.outputs.version }}

  validate-preview-distributions:
    name: Validate preview distribution artifacts
    needs: [build-preview-distributions]
    uses: ./.github/workflows/reusable-validate-distributions.yml
    with:
      artifact-prefix: preview-wheels

  merge-preview-wheels:
    name: Merge preview wheels into single artifact
    needs: [build-preview-distributions, validate-preview-distributions]
    runs-on: ubuntu-latest
    steps:
      # Best-effort: merge the per-package wheels into one artifact and delete
      # the sources so a single ``preview-wheels`` is left. ``continue-on-error``
      # tolerates the delete step 404ing when a concurrent/cancelled run
      # (cancel-in-progress on rapid pushes) already removed a source artifact —
      # a flake unrelated to the build. This job is a leaf (nothing depends on
      # the merged artifact), so not gating on it is safe.
      - uses: actions/upload-artifact/merge@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        continue-on-error: true
        with:
          name: preview-wheels
          pattern: preview-wheels-*
          delete-merged: true
          retention-days: 14

# Lint & format live in `autoformat.yml`. That workflow auto-applies
# ruff format / ruff check --fix, commits any changes to the PR branch,
# and then verifies the tree is clean. If it pushes a fix, this pr.yml
# re-runs against the amended tip — making lint self-gating without
# duplicating the check here.
