name: PR gate

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The repo squash-merges, so the PR title becomes the commit message on
  # main. git-cliff groups release-note sections by Conventional Commit
  # type — anything it doesn't recognize lands in the generic "Other"
  # bucket. Keep the accepted-type list here in sync with cliff.toml's
  # `commit_parsers`.
  conventional-title:
    name: Conventional Commits PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            add
            fix
            refactor
            change
            perf
            docs
            test
            ci
            build
            chore
            style
            delete
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject after the colon should start with a lowercase letter.

  # ---------------------------------------------------------------------------
  # Package discovery
  # ---------------------------------------------------------------------------
  discover-packages:
    name: Discover package matrices
    runs-on: ubuntu-latest
    outputs:
      cuda_test_shards: ${{ steps.discover.outputs.cuda_test_shards }}
      native_build_packages: ${{ steps.discover.outputs.native_build_packages }}
      python_build_packages: ${{ steps.discover.outputs.python_build_packages }}
      test_shards: ${{ steps.discover.outputs.test_shards }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Discover packages
        id: discover
        run: python3 .github/scripts/discover_package_matrices.py --github-output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Rust tests
  # ---------------------------------------------------------------------------
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-rust
        with:
          enable-cache: "true"

      # No `--lib`: also run doc-tests so documented API examples cannot rot.
      - name: cargo test
        run: cargo test --manifest-path packages/opaque-accounting/Cargo.toml

  # ---------------------------------------------------------------------------
  # Python tests
  #
  # Every environment calls the same reusable workflow with explicit runner,
  # Python, dependency, marker, parallelism, and shard settings. Slow tests stay
  # on main; supported dependency and platform boundaries remain pre-merge.
  # ---------------------------------------------------------------------------
  python-tests:
    name: Test
    needs: [discover-packages]
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      environment-name: linux-amd64
      pytest-marker: not cuda and not mps and not slow
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 30
      upload-qodana-coverage: true

  python-tests-minimum-supported:
    name: Minimum supported dependencies
    needs: [discover-packages]
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      allow-test-failure: true
      dependency-selection: minimum-supported
      environment-name: minimum-supported-dependencies
      pytest-marker: not cuda and not mps and not slow
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.11"
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-latest:
    name: Latest dependencies
    needs: [discover-packages]
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      dependency-selection: latest
      environment-name: latest-dependencies
      pytest-marker: not cuda and not mps and not slow
      pytest-xdist: -n auto --dist loadscope
      python-version: "3.12"
      report-durations: true
      runner: ubuntu-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 60

  python-tests-macos-arm64:
    name: macOS arm64
    needs: [discover-packages]
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      environment-name: mps
      pytest-marker: not cuda and not slow
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: macos-latest
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 30

  python-tests-linux-arm64:
    name: Linux arm64
    needs: [discover-packages]
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      environment-name: linux-aarch64
      pytest-marker: not cuda and not mps and not slow
      pytest-xdist: -n auto --dist loadscope
      report-durations: true
      runner: ubuntu-24.04-arm
      test-shards: ${{ needs.discover-packages.outputs.test_shards }}
      timeout-minutes: 30

  # Fork pull requests must never execute untrusted code on the persistent
  # self-hosted GPU runner. The job-level guard prevents allocation entirely.
  python-tests-cuda:
    name: CUDA
    needs: [discover-packages]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      assert-cuda: true
      environment-name: cuda
      pytest-marker: cuda and not slow
      pytest-xdist: -rs
      report-durations: true
      runner: GPU-runner-001
      test-shards: ${{ needs.discover-packages.outputs.cuda_test_shards }}
      timeout-minutes: 30

  # Stable aggregate status check required by branch protection.
  # The CUDA leg is required for repository branches and skipped for forks.
  python-tests-gate:
    name: Python tests
    if: always()
    needs:
      - python-tests
      - python-tests-minimum-supported
      - python-tests-latest
      - python-tests-macos-arm64
      - python-tests-linux-arm64
      - python-tests-cuda
    runs-on: ubuntu-latest
    steps:
      - name: Check Python test results
        run: |
          failed=0
          check_result() {
            local name="$1"
            local result="$2"
            echo "$name: $result"
            if [[ "$result" != "success" ]]; then
              echo "ERROR: $name failed"
              failed=1
            fi
          }

          check_result "Test validation" "${{ needs.python-tests.result }}"
          check_result "Minimum supported dependencies" "${{ needs.python-tests-minimum-supported.result }}"
          check_result "Latest dependencies" "${{ needs.python-tests-latest.result }}"
          check_result "macOS arm64" "${{ needs.python-tests-macos-arm64.result }}"
          check_result "Linux arm64" "${{ needs.python-tests-linux-arm64.result }}"

          gpu="${{ needs.python-tests-cuda.result }}"
          if [[ "${{ github.event_name }}" == "pull_request" &&
                "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            if [[ "$gpu" != "skipped" ]]; then
              echo "ERROR: CUDA validation should be skipped for forks but got: $gpu"
              failed=1
            fi
          else
            check_result "CUDA platform validation" "$gpu"
          fi

          exit "$failed"

  qodana:
    name: Qodana
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'opened' ||
       github.event.action == 'ready_for_review')
    needs: [python-tests-gate]
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
      security-events: write
    uses: ./.github/workflows/reusable-qodana.yml
    with:
      checkout-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      coverage-artifact-pattern: qodana-coverage-*
      pr-mode: true
    secrets: inherit

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/setup-rust

      - uses: ./.github/actions/setup-python

      - name: uv sync
        run: uv sync --group docs --all-packages

      - name: mkdocs build --strict
        run: uv run mkdocs build --strict

  # ---------------------------------------------------------------------------
  # Preview wheels. Builds every wheel at a version like
  # `0.2.2.dev3+pr.142.gabc1234` and uploads them as workflow artifacts.
  # Reviewers download from the PR's Actions run page and `pip install`
  # the .whl files locally. Artifacts expire per workflow retention.
  # ---------------------------------------------------------------------------
  compute-preview-version:
    name: Compute preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Derive version
        id: v
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LAST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort --version-sort --reverse | head -1 || true)
          if [[ -z "$LAST" ]]; then
            BASE="0.0.1"
            DISTANCE=0
          else
            STRIPPED="${LAST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$STRIPPED"
            BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"
            DISTANCE=$(git rev-list --count "${LAST}..HEAD")
          fi
          SHA=$(git rev-parse --short HEAD)
          VERSION="${BASE}.dev${DISTANCE}+pr.${PR_NUMBER}.g${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preview version: $VERSION"

  build-preview-distributions:
    name: Build
    needs: [compute-preview-version, discover-packages]
    uses: ./.github/workflows/reusable-build-distributions.yml
    with:
      artifact-prefix: preview-wheels
      native-build-packages: ${{ needs.discover-packages.outputs.native_build_packages }}
      python-build-packages: ${{ needs.discover-packages.outputs.python_build_packages }}
      retention-days: 14
      version: ${{ needs.compute-preview-version.outputs.version }}

  validate-preview-distributions:
    name: Validate preview distribution artifacts
    needs: [build-preview-distributions]
    uses: ./.github/workflows/reusable-validate-distributions.yml
    with:
      artifact-prefix: preview-wheels

  merge-preview-wheels:
    name: Merge preview wheels into single artifact
    needs: [build-preview-distributions, validate-preview-distributions]
    runs-on: ubuntu-latest
    steps:
      # Best-effort: merge the per-package wheels into one artifact and delete
      # the sources so a single ``preview-wheels`` is left. ``continue-on-error``
      # tolerates the delete step 404ing when a concurrent/cancelled run
      # (cancel-in-progress on rapid pushes) already removed a source artifact —
      # a flake unrelated to the build. This job is a leaf (nothing depends on
      # the merged artifact), so not gating on it is safe.
      - uses: actions/upload-artifact/merge@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        continue-on-error: true
        with:
          name: preview-wheels
          pattern: preview-wheels-*
          delete-merged: true
          retention-days: 14

# Lint & format live in `autoformat.yml`. That workflow auto-applies
# ruff format / ruff check --fix, commits any changes to the PR branch,
# and then verifies the tree is clean. If it pushes a fix, this pr.yml
# re-runs against the amended tip — making lint self-gating without
# duplicating the check here.
