name: PR gate

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The repo squash-merges, so the PR title becomes the commit message on
  # main. git-cliff groups release-note sections by Conventional Commit
  # type — anything it doesn't recognize lands in the generic "Other"
  # bucket. Keep the accepted-type list here in sync with cliff.toml's
  # `commit_parsers`.
  conventional-title:
    name: Conventional Commits PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            add
            fix
            refactor
            change
            perf
            docs
            test
            ci
            build
            chore
            style
            delete
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: |
            The subject after the colon should start with a lowercase letter.

  discover-packages:
    name: Discover package matrices
    runs-on: ubuntu-latest
    outputs:
      test_shards: ${{ steps.discover.outputs.test_shards }}
      python_build_packages: ${{ steps.discover.outputs.python_build_packages }}
      native_build_packages: ${{ steps.discover.outputs.native_build_packages }}
    steps:
      - uses: actions/checkout@v5

      - name: Discover packages
        id: discover
        run: python3 .github/scripts/discover_package_matrices.py --github-output "$GITHUB_OUTPUT"

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Cache the optimized dependency build (statrs/rustfft/nalgebra at
      # opt-level 3 — see the test profile in Cargo.toml). The one-time cold
      # compile is paid only when Cargo.lock changes; warm runs reuse it.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # No `--lib`: also run the crate's doc-tests (~the `///` examples across
      # src/), so documented API examples can't rot. (The crate has no Rust
      # integration tests — its tests/ dir is Python.)
      - name: cargo test
        run: cargo test --manifest-path packages/opaque-accounting/Cargo.toml

  # One matrix over CPU/MPS platforms × shards. Parallelism is
  # two-level: the matrix fans shards across runners, and `pytest -n auto`
  # (cpu/mps only) fans across cores within a runner (`--dist loadscope` keeps
  # each class/module on one worker so fixtures/order are preserved).
  # The self-hosted GPU lane is a separate fork-guarded job below.
  python-tests:
    name: opaque-${{ matrix.shard.name }} (${{ matrix.device.label }})
    needs: [discover-packages]
    runs-on: ${{ matrix.device.os }}
    timeout-minutes: 30  # safety net: a hung/preempted runner fails fast
    strategy:
      fail-fast: false
      matrix:
        # PR gate excludes `slow` (full main CI in ci.yml runs slow too).
        # Discover one shard per package from packages/*/pyproject.toml so the
        # matrix expands automatically when wheels are added or removed. The
        # repo-level tests/ tree stays on its own explicit "repo-tests" shard.
        shard: ${{ fromJSON(needs.discover-packages.outputs.test_shards) }}
        device:
          - name: cpu
            label: CPU
            os: ubuntu-latest
            marker: "not cuda and not mps and not slow"
            xdist: "-n auto --dist loadscope"
          - name: mps
            label: MPS
            os: macos-latest
            marker: "not cuda and not slow"
            xdist: "-n auto --dist loadscope"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # setuptools-scm needs tag history for editable installs

      - uses: dtolnay/rust-toolchain@stable  # needed to build opaque-accounting during uv sync

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true  # cache the resolved env across runs to cut per-shard sync cost

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: uv sync
        run: uv sync --group dev --all-packages --extra all

      - name: pytest
        run: |
          uv run pytest ${{ matrix.shard.paths }} \
            -m "${{ matrix.device.marker }}" \
            ${{ matrix.device.xdist }} \
            --cov=opaque \
            --cov-report=xml:coverage.xml \
            -q

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: ${{ matrix.device.name }}-${{ matrix.shard.name }}
          fail_ci_if_error: false

  # Fork pull requests must never execute untrusted code on the persistent
  # self-hosted GPU runner. Keep this separate from the hosted-runner matrix so
  # the job-level guard can prevent runner allocation entirely.
  python-tests-gpu:
    name: opaque-all (CUDA)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: GPU-runner-001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: uv sync
        run: uv sync --group dev --all-packages --extra all

      - name: pytest
        run: >-
          uv run pytest packages tests
          -m "cuda and not slow"
          -rs
          --cov=opaque
          --cov-report=xml:coverage.xml
          -q

      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: gpu-all
          fail_ci_if_error: false

  # Single aggregating status check — the ONE job to mark required in branch
  # protection. `needs.python-tests.result` is `success` only when every
  # hosted-runner leg passed. The GPU leg is required for repo PRs but skipped
  # for fork PRs (`python-tests-gpu.if` gate). `if: always()` makes the gate
  # report a failure (instead of being skipped) when a shard fails.
  python-tests-gate:
    name: Python tests
    if: always()
    needs: [python-tests, python-tests-gpu]
    runs-on: ubuntu-latest
    steps:
      - name: Require all test legs to pass
        run: |
          cpu_mps="${{ needs.python-tests.result }}"
          gpu="${{ needs.python-tests-gpu.result }}"
          echo "python-tests matrix result: $cpu_mps"
          echo "python-tests-gpu result: $gpu"
          test "$cpu_mps" = "success"
          # GPU is skipped for fork PRs — only require success when it actually ran
          if [[ "$gpu" != "skipped" ]]; then
            test "$gpu" = "success"
          fi

  smoke-imports:
    name: Cross-package import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: uv sync
        run: uv sync --group dev --all-packages --extra all

      - name: No stray __init__.py at PEP 420 namespace roots
        run: |
          # ``opaque/``, ``opaque/api/``, and ``opaque/api/accounting/``
          # are pure implicit namespaces. Any wheel shipping an
          # ``__init__.py`` at one of these paths breaks sibling-wheel
          # imports.
          stray=$(find packages \
            \( -path '*/src/opaque/__init__.py' \
            -o -path '*/src/opaque/api/__init__.py' \
            -o -path '*/src/opaque/api/accounting/__init__.py' \
            \) -print)
          if [ -n "$stray" ]; then
            echo "ERROR: stray namespace __init__.py:"; echo "$stray"; exit 1
          fi

      - name: Repo-level contract tests
        run: |
          uv run pytest tests/contracts/ -v

      - name: Validate clipping imports in docs and examples
        run: |
          if rg -n 'from opaque\.clipping|import opaque\.clipping' docs examples; then
            echo "ERROR: use opaque.dpsgd.clipping or opaque.dpftrl.clipping in docs/ and examples/"
            exit 1
          fi

      - name: No opaque.api.* leakage in user-facing docs/examples
        run: |
          # The opaque.api.* contributor namespace is documented only under
          # docs/extending/ and may be referenced in CONTRIBUTING.md / AGENTS.md.
          # The docs/tutorials/extending_opaque.ipynb notebook is the
          # contributor-track companion to docs/extending/ and is also allowed.
          # Concrete opaque.api.<module> paths must not appear elsewhere.
          targets=(
            docs/user-guide
            docs/reference
            docs/getting-started
            docs/mechanisms
            docs/tutorials
            examples
            README.md
          )
          if rg -n --glob '!docs/tutorials/extending_opaque.ipynb' \
              'opaque\.api\.[a-z_][a-z_0-9]*' "${targets[@]}"; then
            echo "ERROR: opaque.api.* paths must not appear in user-facing docs/examples."
            echo "       Document the contributor surface only under docs/extending/"
            echo "       or docs/tutorials/extending_opaque.ipynb."
            exit 1
          fi

      - name: Import all public namespaces
        run: |
          uv run python -c "import opaque.api.engine.clipping, opaque.dpsgd.clipping, opaque.dpftrl.clipping, opaque.random, opaque.pytree, opaque.types, opaque.functional, opaque.optimizers, opaque.scheduling, opaque.profiling, opaque.distributed, opaque.serialization, opaque.dpsgd, opaque.dpsgd.sampling, opaque.dpftrl, opaque.auditing, opaque.patches, opaque.patches.kernels, opaque.patches.torch, opaque.patches.transformers, opaque.transformers, opaque.accounting; print('OK')"

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: uv sync
        run: uv sync --group docs --all-packages

      - name: mkdocs build --strict
        run: uv run mkdocs build --strict

  # ---------------------------------------------------------------------------
  # Preview wheels. Builds every wheel at a version like
  # `0.2.2.dev3+pr.142.gabc1234` and uploads them as workflow artifacts.
  # Reviewers download from the PR's Actions run page and `pip install`
  # the .whl files locally. Artifacts expire per workflow retention.
  # ---------------------------------------------------------------------------
  compute-preview-version:
    name: Compute preview version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive version
        id: v
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          LAST=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort --version-sort --reverse | head -1 || true)
          if [[ -z "$LAST" ]]; then
            BASE="0.0.1"
            DISTANCE=0
          else
            STRIPPED="${LAST#v}"
            IFS=. read -r MAJOR MINOR PATCH <<< "$STRIPPED"
            BASE="${MAJOR}.${MINOR}.$((PATCH + 1))"
            DISTANCE=$(git rev-list --count "${LAST}..HEAD")
          fi
          SHA=$(git rev-parse --short HEAD)
          VERSION="${BASE}.dev${DISTANCE}+pr.${PR_NUMBER}.g${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preview version: $VERSION"

  build-preview-python:
    name: Build preview ${{ matrix.package.dist }}
    needs: [compute-preview-version, discover-packages]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-packages.outputs.python_build_packages) }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight
        run: bash .github/scripts/set_build_versions.sh "${{ needs.compute-preview-version.outputs.version }}"

      - name: Build wheel
        run: cd ${{ matrix.package.path }} && uv build --wheel --out-dir ../../dist

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: preview-wheels-${{ matrix.package.dist }}
          path: dist/*.whl
          retention-days: 14

  build-preview-opaque:
    name: Build preview opaque
    needs: [compute-preview-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight
        run: bash .github/scripts/set_build_versions.sh "${{ needs.compute-preview-version.outputs.version }}"

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: preview-wheels-opaque
          path: dist/opaque-*.whl
          retention-days: 14

  build-preview-native:
    name: Build preview ${{ matrix.package.dist }} — ${{ matrix.target.platform }}/${{ matrix.target.arch }}
    needs: [compute-preview-version, discover-packages]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-packages.outputs.native_build_packages) }}
        target:
          - platform: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
          - platform: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            manylinux: off
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight
        run: bash .github/scripts/set_build_versions.sh "${{ needs.compute-preview-version.outputs.version }}"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          working-directory: ${{ matrix.package.path }}
          target: ${{ matrix.target.target }}
          manylinux: ${{ matrix.target.manylinux }}
          args: >-
            --release
            --interpreter python3.11
            --out ../../dist
            --compatibility pypi

      - name: Upload wheel
        uses: actions/upload-artifact@v6
        with:
          name: preview-wheels-${{ matrix.package.dist }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: dist/*.whl
          retention-days: 14

  build-preview-accounting-sdist:
    name: Build preview opaque-accounting sdist
    needs: [compute-preview-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Preflight
        run: bash .github/scripts/set_build_versions.sh "${{ needs.compute-preview-version.outputs.version }}"

      - name: Build sdist
        run: cd packages/opaque-accounting && uv build --sdist --out-dir ../../dist

      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: preview-wheels-opaque-accounting-sdist
          path: dist/*.tar.gz
          retention-days: 14

  validate-preview-wheels:
    name: Validate preview wheel metadata
    needs: [build-preview-python, build-preview-opaque, build-preview-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validator dependency
        run: python3 -m pip install --disable-pip-version-check packaging

      - name: Download preview wheels
        uses: actions/download-artifact@v6
        with:
          pattern: preview-wheels-*
          path: dist/
          merge-multiple: true

      - name: Validate internal opaque pins
        run: python3 .github/scripts/check_wheel_internal_pins.py --wheel-dir dist

  validate-accounting-artifacts:
    name: Validate accounting artifact policy
    needs: [build-preview-native, build-preview-accounting-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download accounting artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: preview-wheels-opaque-accounting-*
          path: dist/
          merge-multiple: true

      - name: Validate accounting artifact policy
        run: python3 .github/scripts/check_accounting_artifact_policy.py --wheel-dir dist

  merge-preview-wheels:
    name: Merge preview wheels into single artifact
    needs: [build-preview-python, build-preview-opaque, build-preview-native, build-preview-accounting-sdist, validate-preview-wheels, validate-accounting-artifacts]
    runs-on: ubuntu-latest
    steps:
      # Best-effort: merge the per-package wheels into one artifact and delete
      # the sources so a single ``preview-wheels`` is left. ``continue-on-error``
      # tolerates the delete step 404ing when a concurrent/cancelled run
      # (cancel-in-progress on rapid pushes) already removed a source artifact —
      # a flake unrelated to the build. This job is a leaf (nothing depends on
      # the merged artifact), so not gating on it is safe.
      - uses: actions/upload-artifact/merge@v6
        continue-on-error: true
        with:
          name: preview-wheels
          pattern: preview-wheels-*
          delete-merged: true
          retention-days: 14

# Lint & format live in `autoformat.yml`. That workflow auto-applies
# ruff format / ruff check --fix, commits any changes to the PR branch,
# and then verifies the tree is clean. If it pushes a fix, this pr.yml
# re-runs against the amended tip — making lint self-gating without
# duplicating the check here.
