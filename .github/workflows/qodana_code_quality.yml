name: Qodana

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Ref to analyze. Leave empty to analyze the triggering SHA.
        required: false
        default: ""
        type: string
      coverage-artifact-pattern:
        description: Coverage artifact pattern from the caller's test matrix.
        required: false
        default: ""
        type: string
      pr-mode:
        description: Analyze only changes introduced by the pull request.
        required: false
        default: false
        type: boolean
  workflow_dispatch:

concurrency:
  group: qodana-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Qodana
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: ./.github/actions/setup-python
        with:
          enable-uv-cache: "true"

      - name: Download coverage from Python test shards
        if: inputs.coverage-artifact-pattern != ''
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ${{ inputs.coverage-artifact-pattern }}
          path: .qodana/code-coverage
          merge-multiple: true

      - name: Qodana scan
        if: always()
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          artifact-name: qodana-report
          post-pr-comment: ${{ inputs.pr-mode }}
          pr-mode: ${{ inputs.pr-mode }}
          upload-result: true
          use-annotations: true
          use-caches: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1970838931 }}

      - name: Locate SARIF report
        id: sarif
        if: always()
        run: |
          report="${RUNNER_TEMP}/qodana/results/qodana.sarif.json"
          if [[ -f "$report" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload SARIF to GitHub code scanning
        if: always() && steps.sarif.outputs.available == 'true'
        uses: github/codeql-action/upload-sarif@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
