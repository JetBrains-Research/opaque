name: Qodana quick-fixes

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Quick-fix strategy
        type: choice
        options:
          - cleanup
          - apply
        default: cleanup

concurrency:
  group: qodana-quick-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-fixes:
    name: Qodana quick-fixes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: ./.github/actions/setup-python
        with:
          enable-uv-cache: "true"

      - name: Qodana scan and quick-fix
        uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
        with:
          args: ${{ inputs.strategy == 'apply' && '--apply-fixes' || '--cleanup' }}
          artifact-name: qodana-fix-report
          commit-message: "fix(qodana): apply automated quick-fixes"
          post-pr-comment: false
          pr-mode: false
          push-fixes: pull-request
          upload-result: true
          use-annotations: true
          use-caches: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_1970838931 }}
