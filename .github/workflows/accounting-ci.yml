name: Accounting CI

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/dp-accounting/**'
      - 'tests/accounting/**'
      - '.github/workflows/accounting-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/dp-accounting/**'
      - 'tests/accounting/**'
      - '.github/workflows/accounting-ci.yml'

# Cancel in-progress runs when a new workflow with the same group name is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/dp-accounting/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/dp-accounting/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --manifest-path crates/dp-accounting/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path crates/dp-accounting/Cargo.toml -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path crates/dp-accounting/Cargo.toml

  python-bindings:
    name: Python ${{ matrix.python-version }} bindings - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/dp-accounting/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('crates/dp-accounting/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install maturin and pytest
        run: pip install maturin pytest

      - name: Build and install wheel
        working-directory: crates/dp-accounting
        run: maturin develop --release

      - name: Run PyO3 binding smoke tests
        working-directory: crates/dp-accounting
        run: pytest tests/ -v

      - name: Verify standalone install (no PyTorch)
        run: |
          python -c "import opaque_accounting; pld = opaque_accounting.gaussian_pld(1.1); print('epsilon_at(1e-5)=', pld.epsilon_at(1e-5))"
