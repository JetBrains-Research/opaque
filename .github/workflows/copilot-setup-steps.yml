name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            crates/dp-accounting/target
            ~/.cargo/registry
          key: rust-${{ runner.os }}-${{ hashFiles('crates/dp-accounting/Cargo.lock') }}

      - name: Build Rust accounting crate
        run: |
          cd crates/dp-accounting
          uv run maturin develop --release

      - name: Install Python dependencies
        run: |
          uv sync --group dev --group compat

      - name: Verify setup
        run: |
          uv run python -c "import opaque; print('opaque OK')"
          uv run python -c "import opaque_accounting; print('accounting crate OK')"
          uv run pytest --co -q | tail -5
