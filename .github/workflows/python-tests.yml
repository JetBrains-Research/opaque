name: Python tests

on:
  workflow_call:
    inputs:
      allow-test-failure:
        description: Report pytest failures without failing the job.
        required: false
        default: false
        type: boolean
      allow-empty-test-selection:
        description: Treat an empty package selection as success.
        required: false
        default: false
        type: boolean
      checkout-ref:
        description: Ref to test. Leave empty to test the triggering SHA.
        required: false
        default: ""
        type: string
      dependency-selection:
        description: Dependency set to test (locked, minimum, or latest).
        required: false
        default: locked
        type: string
      environment-name:
        description: Stable environment identifier used in artifacts and Codecov flags.
        required: true
        type: string
      pytest-marker:
        description: pytest marker expression.
        required: true
        type: string
      pytest-xdist:
        description: pytest-xdist arguments; leave empty for serial execution.
        required: false
        default: ""
        type: string
      python-version:
        description: Python version used by the job.
        required: false
        default: "3.11"
        type: string
      report-durations:
        description: Report every test phase taking at least five seconds.
        required: false
        default: false
        type: boolean
      runner:
        description: GitHub Actions runner label.
        required: true
        type: string
      test-suite:
        description: Explicit package suite to run (all, cuda, or distributed).
        required: true
        type: string
      timeout-minutes:
        description: Maximum runtime for each test group.
        required: false
        default: 360
        type: number

jobs:
  validate-suite:
    name: Validate suite
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Validate test suite
        env:
          TEST_SUITE: ${{ inputs.test-suite }}
        run: |
          case "$TEST_SUITE" in
            all|cuda|distributed) ;;
            *)
              echo "::error::Unknown test suite: $TEST_SUITE"
              exit 1
              ;;
          esac

  foundation:
    name: Foundation
    if: inputs.test-suite == 'all'
    needs: [validate-suite]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      ALLOW_EMPTY_TEST_SELECTION: ${{ inputs.allow-empty-test-selection }}
      ALLOW_TEST_FAILURE: ${{ inputs.allow-test-failure }}
      COVERAGE_FILE: .coverage-${{ inputs.environment-name }}-foundation
      PYTEST_MARKER: ${{ inputs.pytest-marker }}
      PYTEST_XDIST: ${{ inputs.pytest-xdist }}
      REPORT_DURATIONS: ${{ inputs.report-durations }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Install dependencies
        env:
          DEPENDENCY_SELECTION: ${{ inputs.dependency-selection }}
        run: bash .github/scripts/setup_python_test_environment.sh
      - name: opaque-base
        env:
          TEST_PATH: packages/opaque-base
        run: bash .github/scripts/run_python_test_package.sh
      - name: opaque-accounting
        env:
          TEST_PATH: packages/opaque-accounting
        run: bash .github/scripts/run_python_test_package.sh
      - name: opaque-auditing
        env:
          TEST_PATH: packages/opaque-auditing
        run: bash .github/scripts/run_python_test_package.sh
      - uses: ./.github/actions/upload-python-coverage
        with:
          artifact-name: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-foundation
          coverage-file: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-foundation.xml
          codecov-flag: ${{ inputs.environment-name }}-foundation

  dp-mechanisms:
    name: DP mechanisms
    needs: [validate-suite]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      ALLOW_EMPTY_TEST_SELECTION: ${{ inputs.allow-empty-test-selection }}
      ALLOW_TEST_FAILURE: ${{ inputs.allow-test-failure }}
      COVERAGE_FILE: .coverage-${{ inputs.environment-name }}-dp-mechanisms
      PYTEST_MARKER: ${{ inputs.pytest-marker }}
      PYTEST_XDIST: ${{ inputs.pytest-xdist }}
      REPORT_DURATIONS: ${{ inputs.report-durations }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Install dependencies
        env:
          DEPENDENCY_SELECTION: ${{ inputs.dependency-selection }}
        run: bash .github/scripts/setup_python_test_environment.sh
      - name: opaque-dpsgd
        env:
          TEST_PATH: packages/opaque-dpsgd
        run: bash .github/scripts/run_python_test_package.sh
      - name: opaque-dpftrl
        env:
          TEST_PATH: packages/opaque-dpftrl
        run: bash .github/scripts/run_python_test_package.sh
      - uses: ./.github/actions/upload-python-coverage
        with:
          artifact-name: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-dp-mechanisms
          coverage-file: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-dp-mechanisms.xml
          codecov-flag: ${{ inputs.environment-name }}-dp-mechanisms

  runtime-and-patches:
    name: Runtime and patches
    needs: [validate-suite]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      ALLOW_EMPTY_TEST_SELECTION: ${{ inputs.allow-empty-test-selection }}
      ALLOW_TEST_FAILURE: ${{ inputs.allow-test-failure }}
      COVERAGE_FILE: .coverage-${{ inputs.environment-name }}-runtime-and-patches
      PYTEST_MARKER: ${{ inputs.pytest-marker }}
      PYTEST_XDIST: ${{ inputs.pytest-xdist }}
      REPORT_DURATIONS: ${{ inputs.report-durations }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Install dependencies
        env:
          DEPENDENCY_SELECTION: ${{ inputs.dependency-selection }}
        run: bash .github/scripts/setup_python_test_environment.sh
      - name: opaque-engine
        env:
          TEST_PATH: packages/opaque-engine
        run: bash .github/scripts/run_python_test_package.sh
      - name: opaque-optimizers
        if: inputs.test-suite != 'cuda'
        env:
          TEST_PATH: packages/opaque-optimizers
        run: bash .github/scripts/run_python_test_package.sh
      - name: opaque-patches
        if: inputs.test-suite != 'distributed'
        env:
          TEST_PATH: packages/opaque-patches
        run: bash .github/scripts/run_python_test_package.sh
      - uses: ./.github/actions/upload-python-coverage
        with:
          artifact-name: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-runtime-and-patches
          coverage-file: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-runtime-and-patches.xml
          codecov-flag: ${{ inputs.environment-name }}-runtime-and-patches

  integrations:
    name: Integrations
    if: inputs.test-suite != 'distributed' || !contains(inputs.pytest-marker, 'not slow')
    needs: [validate-suite]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      ALLOW_EMPTY_TEST_SELECTION: ${{ inputs.allow-empty-test-selection }}
      ALLOW_TEST_FAILURE: ${{ inputs.allow-test-failure }}
      COVERAGE_FILE: .coverage-${{ inputs.environment-name }}-integrations
      PYTEST_MARKER: ${{ inputs.pytest-marker }}
      PYTEST_XDIST: ${{ inputs.pytest-xdist }}
      REPORT_DURATIONS: ${{ inputs.report-durations }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Install dependencies
        env:
          DEPENDENCY_SELECTION: ${{ inputs.dependency-selection }}
        run: bash .github/scripts/setup_python_test_environment.sh
      - name: opaque-alignment
        if: inputs.test-suite != 'cuda'
        env:
          TEST_PATH: packages/opaque-alignment
        run: bash .github/scripts/run_python_test_package.sh
      - name: opaque-transformers
        env:
          TEST_PATH: packages/opaque-transformers
        run: bash .github/scripts/run_python_test_package.sh
      - uses: ./.github/actions/upload-python-coverage
        with:
          artifact-name: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-integrations
          coverage-file: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-integrations.xml
          codecov-flag: ${{ inputs.environment-name }}-integrations

  integration-tests:
    name: Integration tests
    if: inputs.test-suite != 'distributed'
    needs: [validate-suite]
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      ALLOW_EMPTY_TEST_SELECTION: ${{ inputs.allow-empty-test-selection }}
      ALLOW_TEST_FAILURE: ${{ inputs.allow-test-failure }}
      COVERAGE_FILE: .coverage-${{ inputs.environment-name }}-integration
      PYTEST_MARKER: ${{ inputs.pytest-marker }}
      PYTEST_XDIST: ${{ inputs.pytest-xdist }}
      REPORT_DURATIONS: ${{ inputs.report-durations }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Install dependencies
        env:
          DEPENDENCY_SELECTION: ${{ inputs.dependency-selection }}
        run: bash .github/scripts/setup_python_test_environment.sh
      - name: Integration
        env:
          TEST_PATH: tests
        run: bash .github/scripts/run_python_test_package.sh
      - uses: ./.github/actions/upload-python-coverage
        with:
          artifact-name: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-integration
          coverage-file: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-integration.xml
          codecov-flag: ${{ inputs.environment-name }}-integration
