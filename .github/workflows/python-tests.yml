name: Python tests

on:
  workflow_call:
    inputs:
      allow-test-failure:
        description: Report pytest failures without failing the job.
        required: false
        default: false
        type: boolean
      allow-empty-test-selection:
        description: Treat an empty package selection as success.
        required: false
        default: false
        type: boolean
      checkout-ref:
        description: Ref to test. Leave empty to test the triggering SHA.
        required: false
        default: ""
        type: string
      dependency-selection:
        description: Dependency set to test (locked, minimum, or latest).
        required: false
        default: locked
        type: string
      environment-name:
        description: Stable environment identifier used in artifacts and Codecov flags.
        required: true
        type: string
      min-executed-tests:
        description: >-
          Fail the leg unless at least this many selected tests actually ran.
          A leg whose tests all skip exits zero, so a marker typo or a missing
          optional backend would otherwise turn a required check into a no-op.
          Only meaningful together with a suite selection that is expected to
          collect tests; leave at 0 for legs that may legitimately match none.
        required: false
        default: 0
        type: number
      pytest-marker:
        description: pytest marker expression.
        required: true
        type: string
      pytest-xdist:
        description: pytest-xdist arguments; leave empty for serial execution.
        required: false
        default: ""
        type: string
      python-version:
        description: Python version used by each test-group matrix leg.
        required: false
        default: "3.11"
        type: string
      report-durations:
        description: Report every test phase taking at least five seconds.
        required: false
        default: false
        type: boolean
      runner:
        description: GitHub Actions runner label.
        required: true
        type: string
      suites:
        description: >-
          JSON array of test-group matrix legs. Defaults to the per-package
          split. A selection that spans few packages — the distributed lane —
          should pass a single whole-tree leg instead, so that "this lane ran
          nothing" has one unambiguous place to be checked.
        required: false
        default: >-
          [
            {"id": "foundation", "label": "Foundation",
             "paths": "packages/opaque-base\npackages/opaque-accounting\npackages/opaque-auditing"},
            {"id": "dp-mechanisms", "label": "DP mechanisms",
             "paths": "packages/opaque-dpsgd\npackages/opaque-dpftrl"},
            {"id": "runtime-and-patches", "label": "Runtime and patches",
             "paths": "packages/opaque-engine\npackages/opaque-optimizers\npackages/opaque-patches"},
            {"id": "alignment-and-transformers", "label": "Alignment and transformers",
             "paths": "packages/opaque-alignment\npackages/opaque-transformers"},
            {"id": "integration", "label": "Integration tests", "paths": "tests"}
          ]
        type: string
      timeout-minutes:
        description: Maximum runtime for each test-group matrix leg.
        required: false
        default: 360
        type: number

jobs:
  test:
    name: ${{ matrix.suite.label }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      # A matrix keeps every caller's suites in one collapsible Actions block
      # without sacrificing the parallelism of the previous separate jobs.
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}
    env:
      ALLOW_EMPTY_TEST_SELECTION: ${{ inputs.allow-empty-test-selection }}
      ALLOW_TEST_FAILURE: ${{ inputs.allow-test-failure }}
      JUNIT_DIR: .junit-${{ inputs.environment-name }}-${{ matrix.suite.id }}
      COVERAGE_FILE: .coverage-${{ inputs.environment-name }}-${{ matrix.suite.id }}
      PYTEST_MARKER: ${{ inputs.pytest-marker }}
      PYTEST_XDIST: ${{ inputs.pytest-xdist }}
      REPORT_DURATIONS: ${{ inputs.report-durations }}
      TEST_RESULTS_FILE: .test-results-${{ inputs.environment-name }}-${{ matrix.suite.id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}
      - uses: ./.github/actions/setup-rust
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
      - name: Install dependencies
        env:
          DEPENDENCY_SELECTION: ${{ inputs.dependency-selection }}
        run: bash .github/scripts/setup_python_test_environment.sh
      - name: Run test group
        env:
          TEST_PATHS: ${{ matrix.suite.paths }}
        shell: bash
        run: |
          set -u
          failed=0
          while IFS= read -r test_path; do
            if [[ -z "$test_path" ]]; then
              continue
            fi
            if ! TEST_PATH="$test_path" bash .github/scripts/run_python_test_package.sh; then
              failed=1
            fi
          done <<< "$TEST_PATHS"
          exit "$failed"
      - name: Require executed tests
        if: ${{ inputs.min-executed-tests > 0 }}
        env:
          MIN_EXECUTED: ${{ inputs.min-executed-tests }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/check_executed_tests.py \
            --report-dir "$JUNIT_DIR" --min-executed "$MIN_EXECUTED"
      - uses: ./.github/actions/upload-python-coverage
        if: ${{ !cancelled() }}
        with:
          artifact-name: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-${{ matrix.suite.id }}
          coverage-file: coverage-${{ inputs.dependency-selection }}-${{ inputs.environment-name }}-${{ matrix.suite.id }}.xml
          codecov-flag: ${{ inputs.environment-name }}-${{ matrix.suite.id }}
