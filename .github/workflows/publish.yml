name: Publish Release

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  extract-version:
    name: Extract and validate version
    if: |
      (github.event_name == 'pull_request' &&
       startsWith(github.event.pull_request.head.ref, 'release/') &&
       (github.event.action != 'closed' || github.event.pull_request.merged == true))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      is_dry_run: ${{ steps.version.outputs.is_dry_run }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for release notes

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from branch name or use current version
        id: version
        run: |
          # Release PR path
          BRANCH="${{ github.event.pull_request.head.ref }}"
          FULL_VERSION=$(echo "$BRANCH" | sed -n 's/^release\/v\(.*\)$/\1/p')

          if [ -z "$FULL_VERSION" ]; then
            echo "❌ Could not extract version from branch name: $BRANCH"
            echo "Expected format: release/vX.Y.Z or release/vX.Y.Z-pre-release"
            exit 1
          fi

          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            IS_DRY_RUN="false"
          else
            # Pre-merge release PR checks run in dry-run mode automatically.
            IS_DRY_RUN="true"
          fi

          # Validate PEP 440 and reject non-canonical branch versions.
          FULL_VERSION="$FULL_VERSION" GITHUB_OUTPUT="$GITHUB_OUTPUT" uv run --with packaging python << 'PYTHON_EOF'
          from packaging.version import Version
          import os
          import sys

          full_version = os.environ["FULL_VERSION"]
          github_output = os.environ["GITHUB_OUTPUT"]

          try:
            # Parse and canonicalize according to PEP 440
            version_obj = Version(full_version)
            canonical = str(version_obj)
            is_prerelease = version_obj.is_prerelease

            # Do not auto-correct in publish: fail fast on non-canonical forms.
            if full_version != canonical:
              print(f"❌ Non-canonical version in release branch: {full_version}")
              print(f"Canonical PEP 440 form is: {canonical}")
              print("Please rerun release preparation so branch/version are normalized before publishing.")
              sys.exit(1)

            with open(github_output, "a") as f:
              f.write(f"version={canonical}\n")
              f.write(f"is_prerelease={str(is_prerelease).lower()}\n")

            print(f"📦 Publishing version: {canonical} (pre-release: {is_prerelease})")
          except Exception as e:
            print(f"❌ Invalid version format: {full_version}")
            print(f"Error: {e}")
            print("")
            print("Valid examples:")
            print("  - 1.2.3          → stable release")
            print("  - 1.2.3rc1       → release candidate")
            print("  - 1.2.3a1        → alpha")
            print("  - 1.2.3b1        → beta")
            print("  - 1.2.3.dev1     → dev version")
            print("")
            print("See PEP 440 for full versioning rules.")
            sys.exit(1)
          PYTHON_EOF

          echo "is_dry_run=$IS_DRY_RUN" >> $GITHUB_OUTPUT

  build-opaque-dp:
    name: Build opaque-dp
    needs: [extract-version]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pin opaque-accounting dependency
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          echo "📌 Pinning opaque-accounting==${VERSION}..."

          OPAQUE_DP_PYP="packages/opaque/pyproject.toml"
          if ! grep -q "opaque-accounting" "$OPAQUE_DP_PYP"; then
            echo "❌ Could not find opaque-accounting dependency"
            exit 1
          fi

          sed -i -E "s/\"opaque-accounting[^\"]*\"/\"opaque-accounting==${VERSION}\"/" "$OPAQUE_DP_PYP"

          if ! grep -q "opaque-accounting==${VERSION}" "$OPAQUE_DP_PYP"; then
            echo "❌ Failed to pin opaque-accounting version"
            exit 1
          fi

          echo "✅ Pinned opaque-accounting==${VERSION}"

      - name: Build wheel
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          cd packages/opaque
          uv version "$VERSION"
          uv build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-opaque-dp
          path: dist/*opaque_dp*.whl

  build-opaque-accounting:
    name: Build opaque-accounting - ${{ matrix.platform }}/${{ matrix.arch }}
    needs: [extract-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: amd64
            runner: ubuntu-latest
          - platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            arch: arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          cd packages/opaque-accounting
          uv version "$VERSION"
          uv build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-opaque-accounting-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*opaque_accounting*.whl

  publish:
    name: Publish Release
    needs: [extract-version, build-opaque-dp, build-opaque-accounting]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Verify wheels
        run: |
          echo "📦 Collected wheels:"
          ls -lh dist/

          WHEEL_COUNT=$(ls dist/*.whl | wc -l)
          if [ "$WHEEL_COUNT" -lt 2 ]; then
            echo "❌ Expected at least 2 wheels (opaque-dp + opaque-accounting), found $WHEEL_COUNT"
            exit 1
          fi

          if ! ls dist/opaque_dp-*.whl >/dev/null 2>&1; then
            echo "❌ Missing opaque-dp wheel"
            exit 1
          fi

          if ! ls dist/opaque_accounting-*.whl >/dev/null 2>&1; then
            echo "❌ Missing opaque-accounting wheels"
            exit 1
          fi

          echo "✅ All wheels verified"

      - name: Authenticate to GCP
        if: needs.extract-version.outputs.is_dry_run == 'false'
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Publish to GCP Artifact Registry
        if: needs.extract-version.outputs.is_dry_run == 'false'
        env:
          UV_PUBLISH_USERNAME: oauth2accesstoken
          UV_PUBLISH_PASSWORD: ${{ steps.gcp-auth.outputs.access_token }}
        run: |
          echo "📦 Publishing $(ls dist/*.whl | wc -l) wheels..."
          uv publish \
            --publish-url https://europe-west4-python.pkg.dev/jetbrains-ml4se-fed/jbr-fed-python/simple/ \
            dist/*.whl

      - name: Dry run - skip publishing
        if: needs.extract-version.outputs.is_dry_run == 'true'
        run: |
          echo "⚠️  DRY RUN: Skipping publish to GCP"
          echo "📦 Would publish $(ls dist/*.whl | wc -l) wheels:"
          ls -lh dist/

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          VERSION="${{ needs.extract-version.outputs.version }}"
          # Extract section from CHANGELOG.md between this version and next version heading
          NOTES=$(awk "/^## \[$VERSION\]/,/^## \[/ {if (/^## \[/ && !p) {p=1; next} if (/^## \[/ && p) exit; if (p) print}" CHANGELOG.md || echo "Release $VERSION")
          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: needs.extract-version.outputs.is_dry_run == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.extract-version.outputs.version }}
          name: opaque-dp v${{ needs.extract-version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ needs.extract-version.outputs.is_prerelease }}
          files: |
            dist/*.whl

      - name: Dry run - skip GitHub release
        if: needs.extract-version.outputs.is_dry_run == 'true'
        run: |
          echo "⚠️  DRY RUN: Skipping GitHub Release creation"
          echo "Would create release: v${{ needs.extract-version.outputs.version }}"

      - name: Summary
        run: |
          echo "## Publish Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version**: ${{ needs.extract-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Pre-release**: ${{ needs.extract-version.outputs.is_prerelease }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run**: ${{ needs.extract-version.outputs.is_dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Wheels Built And Collected**:" >> $GITHUB_STEP_SUMMARY
          ls -1 dist/*.whl | sed 's/^dist\//- /' >> $GITHUB_STEP_SUMMARY
