name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Build and Publish Release
    if: |
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for release notes

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from branch name
        id: version
        run: |
          # Extract version from branch name and validate PEP 440 format
          BRANCH="${{ github.event.pull_request.head.ref }}"
          FULL_VERSION=$(echo "$BRANCH" | sed -n 's/^release\/v\(.*\)$/\1/p')

          if [ -z "$FULL_VERSION" ]; then
            echo "❌ Could not extract version from branch name: $BRANCH"
            echo "Expected format: release/vX.Y.Z or release/vX.Y.Z-pre-release"
            exit 1
          fi

          # Validate PEP 440 and reject non-canonical branch versions.
          # Phase 1 (release.md) is responsible for normalization.
          FULL_VERSION="$FULL_VERSION" GITHUB_OUTPUT="$GITHUB_OUTPUT" uv run --with packaging python << 'PYTHON_EOF'
          from packaging.version import Version
          import os
          import sys

          full_version = os.environ["FULL_VERSION"]
          github_output = os.environ["GITHUB_OUTPUT"]

          try:
            # Parse and canonicalize according to PEP 440
            version_obj = Version(full_version)
            canonical = str(version_obj)
            is_prerelease = version_obj.is_prerelease

            # Do not auto-correct in publish: fail fast on non-canonical forms.
            if full_version != canonical:
              print(f"❌ Non-canonical version in release branch: {full_version}")
              print(f"Canonical PEP 440 form is: {canonical}")
              print("Please rerun release preparation so branch/version are normalized before publishing.")
              sys.exit(1)

            with open(github_output, "a") as f:
              f.write(f"version={canonical}\n")
              f.write(f"is_prerelease={str(is_prerelease).lower()}\n")

            print(f"📦 Publishing version: {canonical} (pre-release: {is_prerelease})")
          except Exception as e:
            print(f"❌ Invalid version format: {full_version}")
            print(f"Error: {e}")
            print("")
            print("Valid examples:")
            print("  - 1.2.3          → stable release")
            print("  - 1.2.3rc1       → release candidate")
            print("  - 1.2.3a1        → alpha")
            print("  - 1.2.3b1        → beta")
            print("  - 1.2.3.dev1     → dev version")
            print("")
            print("See PEP 440 for full versioning rules.")
            sys.exit(1)
          PYTHON_EOF

      - name: Set version and build wheels
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Keep repository sources unchanged on main, but ensure release wheel metadata
          # pins opaque-accounting to the same release version as opaque-dp.
          echo "📌 Pinning opaque-accounting==${VERSION} in opaque-dp dependencies..."
          
          OPAQUE_DP_PYP="packages/opaque/pyproject.toml"
          if ! grep -q "opaque-accounting" "$OPAQUE_DP_PYP"; then
            echo "❌ Could not find opaque-accounting dependency in $OPAQUE_DP_PYP"
            cat "$OPAQUE_DP_PYP"
            exit 1
          fi
          
          # Show original dependency
          echo "Original dependency:"
          grep "opaque-accounting" "$OPAQUE_DP_PYP"
          
          # Update dependency version
          sed -i -E "s/\"opaque-accounting[^\"]*\"/\"opaque-accounting==${VERSION}\"/" "$OPAQUE_DP_PYP"
          
          # Verify modification
          if ! grep -q "opaque-accounting==${VERSION}" "$OPAQUE_DP_PYP"; then
            echo "❌ Failed to pin opaque-accounting version in $OPAQUE_DP_PYP"
            echo "Updated dependency:"
            grep "opaque-accounting" "$OPAQUE_DP_PYP"
            exit 1
          fi
          
          echo "✅ Successfully pinned opaque-accounting==${VERSION}"
          echo "Updated dependency:"
          grep "opaque-accounting" "$OPAQUE_DP_PYP"

          # Build opaque-dp (pure Python)
          echo "📦 Building opaque-dp wheel..."
          cd packages/opaque
          uv version "$VERSION"
          uv build --wheel
          cd ../..

          # Build opaque-accounting wheel with maturin (Rust extension)
          echo "📦 Building opaque-accounting wheel..."
          cd packages/opaque-accounting
          uv version "$VERSION"
          uv build --wheel
          cd ../..

          # List built wheels
          echo "✅ Built wheels:"
          ls -lh packages/*/dist/*.whl

      - name: Authenticate to GCP
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure GCP Artifact Registry
        run: |
          gcloud artifacts print-settings python \
            --project=jetbrains-ml4se-fed \
            --repository=jbr-fed-python \
            --location=europe-west4 > ~/.pypirc

      - name: Verify wheels exist
        run: |
          echo "Checking for built wheels..."
          if [ ! -f packages/opaque/dist/*.whl ]; then
            echo "❌ No wheels found for opaque-dp"
            ls -lh packages/opaque/dist/
            exit 1
          fi
          if [ ! -f packages/opaque-accounting/dist/*.whl ]; then
            echo "❌ No wheels found for opaque-accounting"
            ls -lh packages/opaque-accounting/dist/
            exit 1
          fi
          echo "✅ Wheels verified"

      - name: Publish to GCP Artifact Registry
        run: |
          # Collect wheels into a single directory for publication
          mkdir -p dist/
          cp packages/opaque/dist/*.whl dist/
          cp packages/opaque-accounting/dist/*.whl dist/
          
          echo "📦 Publishing $(ls dist/*.whl | wc -l) wheels..."
          uv publish \
            --publish-url https://europe-west4-python.pkg.dev/jetbrains-ml4se-fed/jbr-fed-python/ \
            dist/*.whl

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract section from CHANGELOG.md between this version and next version heading
          NOTES=$(awk "/^## \[$VERSION\]/,/^## \[/ {if (/^## \[/ && !p) {p=1; next} if (/^## \[/ && p) exit; if (p) print}" CHANGELOG.md || echo "Release $VERSION")
          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: opaque-dp v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease }}
          files: |
            packages/opaque/dist/*.whl
            packages/opaque-accounting/dist/*.whl
