name: Monte Carlo privacy regression

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Ref to test. Leave empty to test the triggering SHA.
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: Ref to test. Leave empty to test the triggering SHA.
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  regression:
    name: Monte Carlo privacy regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      OPAQUE_B_MIN_SEP_TRANSCRIPT_CACHE_MAX_BYTES: "0"
      RAYON_NUM_THREADS: "4"
      TEST_FILE: packages/opaque-dpftrl/tests/accounting/test_mc_privacy_regression.py
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Verify regression vector
        shell: bash
        run: |
          if [[ ! -f "$TEST_FILE" ]]; then
            echo "::error::The selected source lacks the Monte Carlo privacy vector. Backport issue #666 before validating it."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: opaque-accounting
          workspaces: "."

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      - name: Install dependencies
        env:
          DEPENDENCY_SELECTION: locked
        run: bash .github/scripts/setup_python_test_environment.sh

      - name: Report environment
        shell: bash
        run: |
          echo "ImageOS=${ImageOS:-unknown}"
          echo "ImageVersion=${ImageVersion:-unknown}"
          echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
          echo "RAYON_NUM_THREADS=$RAYON_NUM_THREADS OMP_NUM_THREADS=$OMP_NUM_THREADS MKL_NUM_THREADS=$MKL_NUM_THREADS OPENBLAS_NUM_THREADS=$OPENBLAS_NUM_THREADS"
          python -VV
          rustc -Vv
          uv --version
          uname -a
          lscpu | sed -n '/^Architecture:/p; /^CPU(s):/p; /^Model name:/p'
          uv run python -c 'import numpy, scipy, torch; import opaque.accounting as acc; print(f"opaque-accounting={acc.__version__} numpy={numpy.__version__} scipy={scipy.__version__} torch={torch.__version__}")'

      - name: Run privacy vectors
        shell: bash
        run: |
          /usr/bin/time -v uv run pytest \
            --strict-markers \
            -m mc_regression \
            -q "$TEST_FILE"
