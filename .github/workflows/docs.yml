name: Deploy Documentation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Needed to update mike state (gh-pages) and deploy via GitHub Pages workflow
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy versioned docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --group docs

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs for main as latest
        if: github.ref == 'refs/heads/main'
        run: |
          uv run --group docs mike deploy --update-aliases main latest
          uv run --group docs mike set-default latest

      - name: Deploy docs for release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run --group docs mike deploy "$VERSION"
          uv run --group docs mike set-default latest

      - name: Push updated gh-pages state
        run: |
          git push origin gh-pages

      - name: Export gh-pages content
        run: |
          rm -rf pages-site
          mkdir -p pages-site
          git archive gh-pages | tar -x -C pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
