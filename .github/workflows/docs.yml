name: Deploy Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: Exact source ref to document.
        required: true
        type: string
      release_version:
        description: Version label for an immutable release deployment.
        required: true
        type: string

# Needed to update mike state (gh-pages) and deploy via GitHub Pages workflow
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy versioned docs
    if: >-
      github.event_name == 'workflow_call' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python

      - name: Install dependencies
        run: |
          uv sync --group docs

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs for main as latest
        if: github.event_name != 'workflow_call' && github.ref == 'refs/heads/main'
        run: |
          uv run --group docs mike deploy --update-aliases main latest
          uv run --group docs mike set-default latest

      - name: Deploy docs for release tag
        if: github.event_name == 'workflow_call' || startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "${{ github.event_name }}" == "workflow_call" ]]; then
            VERSION="${{ inputs.release_version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          uv run --group docs mike deploy "$VERSION"
          uv run --group docs mike set-default latest

      - name: Push updated gh-pages state
        run: |
          git push origin gh-pages

      - name: Export gh-pages content
        run: |
          rm -rf pages-site
          mkdir -p pages-site
          git archive gh-pages | tar -x -C pages-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
