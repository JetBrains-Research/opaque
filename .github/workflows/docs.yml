name: Deploy Documentation

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Needed for pushing versioned docs to gh-pages
permissions:
  contents: write

concurrency:
  group: "docs"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy versioned docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync --group docs

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs for main as latest
        if: github.ref == 'refs/heads/main'
        run: |
          uv run --group docs mike deploy --push --update-aliases main latest
          uv run --group docs mike set-default --push latest

      - name: Deploy docs for release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run --group docs mike deploy --push "$VERSION"
          uv run --group docs mike set-default --push latest
