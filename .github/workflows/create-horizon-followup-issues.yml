# One-shot helper: file OPQ-187–OPQ-190 from the horizon allocation follow-up list.
# Run manually from Actions → "Create horizon follow-up issues" → Run workflow.
name: Create horizon follow-up issues

on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run python .github/scripts/create_horizon_followup_issues.py
