name: Reusable / Build distributions

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: Prefix for all uploaded build artifacts.
        required: true
        type: string
      checkout-ref:
        description: Ref to build. Leave empty to build the triggering SHA.
        required: false
        default: ""
        type: string
      retention-days:
        description: Number of days to retain uploaded artifacts.
        required: true
        type: number
      version:
        description: Explicit build version. Leave empty to derive it from git.
        required: false
        default: ""
        type: string

jobs:
  discover-packages:
    name: Discover package matrices
    runs-on: ubuntu-latest
    outputs:
      python_build_packages: ${{ steps.discover.outputs.python_build_packages }}
      native_build_packages: ${{ steps.discover.outputs.native_build_packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - name: Discover packages
        id: discover
        run: python3 .github/scripts/discover_package_matrices.py --github-output "$GITHUB_OUTPUT"

  build-python-wheels:
    name: Build ${{ matrix.package.dist }}
    needs: [discover-packages]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-packages.outputs.python_build_packages) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Preflight build version
        run: bash .github/scripts/set_build_versions.sh "${{ inputs.version }}"

      - name: Build wheel
        run: cd ${{ matrix.package.path }} && uv build --wheel --out-dir ../../dist

      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.package.dist }}
          path: dist/*.whl
          retention-days: ${{ inputs.retention-days }}

  build-opaque-wheel:
    name: Build opaque
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Preflight build version
        run: bash .github/scripts/set_build_versions.sh "${{ inputs.version }}"

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.artifact-prefix }}-opaque
          path: dist/opaque-*.whl
          retention-days: ${{ inputs.retention-days }}

  build-native-wheels:
    name: Build ${{ matrix.package.dist }} - ${{ matrix.target.platform }}/${{ matrix.target.arch }}
    needs: [discover-packages]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover-packages.outputs.native_build_packages) }}
        target:
          - platform: linux
            arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: 2_28
          - platform: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            manylinux: off
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Preflight build version
        run: bash .github/scripts/set_build_versions.sh "${{ inputs.version }}"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: build
          working-directory: ${{ matrix.package.path }}
          target: ${{ matrix.target.target }}
          manylinux: ${{ matrix.target.manylinux }}
          args: >-
            --release
            --interpreter python3.11
            --out ../../dist
            --compatibility pypi

      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.package.dist }}-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          path: dist/*.whl
          retention-days: ${{ inputs.retention-days }}

  build-accounting-sdist:
    name: Build opaque-accounting sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Preflight build version
        run: bash .github/scripts/set_build_versions.sh "${{ inputs.version }}"

      - name: Build sdist
        run: cd packages/opaque-accounting && uv build --sdist --out-dir ../../dist

      - name: Upload sdist
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.artifact-prefix }}-opaque-accounting-sdist
          path: dist/*.tar.gz
          retention-days: ${{ inputs.retention-days }}
