# Builds the opaque training image (deploy/zenml/Dockerfile) and pushes it to
# the GCP Artifact Registry the `gke-ai-for-code` ZenML stack pulls from, so the
# heavy CUDA/Rust build runs on a Linux amd64 runner instead of a laptop.
#
# Submit runs afterwards from your laptop against the pushed tag:
#   export OPAQUE_DOCKER_REGISTRY=<registry>  OPAQUE_DOCKER_TAG=<tag>
#   python deploy/zenml/run.py smoke --no-gpu   # then: both / dp / nodp
#
# Auth reuses opaque's existing Workload Identity Federation (the same vars the
# build-devcontainer workflow uses) — no service-account JSON key needed.
#
# Requirements:
#   secret LORA_PRIVACY_DEPLOY_KEY    — private half of a read-only SSH deploy key
#     on JetBrains-Research/LoRA-Privacy (the vendor/lora-privacy submodule lives
#     in a separate private repo the default GITHUB_TOKEN can't fetch). A deploy
#     key is bound to that one repo and needs no org/SAML/PAT approval. This is
#     the only secret you must add.
#   var    GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT_EMAIL — already set
#     as `devcontainer` environment variables for the devcontainer build; this job
#     joins that environment (see `environment:` below) to reuse them.
#   var    OPAQUE_DOCKER_REGISTRY     — optional; defaults to the gke-dev-dws-jbr
#     repo that the WIF service account can push to.
#   var    TRAIN_IMAGE_RUNNER         — optional; a bigger runner if the build
#                                       runs out of disk on ubuntu-latest
#
# NOTE: the gke-ai-for-code cluster must be able to pull from this registry. If
# ZenML pods hit ImagePullBackOff, grant the cluster's node SA
# roles/artifactregistry.reader on this project (or switch back to grazie-ml).
name: Build Training Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: <branch>-<sha7>)"
        required: false
        default: ""
      push:
        description: "Push to the registry"
        required: false
        default: true
        type: boolean
  push:
    # `main` for the canonical image; the zenml-training research branch so the
    # image can be built directly from it (it carries the lora-privacy submodule,
    # presets and handoff the image needs — none of which are on main yet, so a
    # PR-to-main isn't the build vehicle).
    branches:
      - main
      - david-stan/zenml-training
    paths:
      - deploy/zenml/**
      - examples/**
      - vendor/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/build-train-image.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & push opaque-train
    runs-on: ${{ vars.TRAIN_IMAGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    # GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT_EMAIL are scoped to this
    # GitHub Environment (same as build-devcontainer.yaml), not the repo, so the
    # job must declare it or those vars resolve empty and google auth fails.
    environment: devcontainer
    permissions:
      contents: read
      id-token: write  # required for Workload Identity Federation
    env:
      REGISTRY: ${{ vars.OPAQUE_DOCKER_REGISTRY || 'europe-west4-docker.pkg.dev/gke-dev-dws-jbr/ml' }}
      IMAGE_NAME: opaque-train
      # workflow_dispatch respects the `push` input; push/pull_request always push.
      DO_PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}

    steps:
      - name: Checkout opaque
        uses: actions/checkout@v5
        with:
          # Default GITHUB_TOKEN reads opaque fine. Don't persist it in git config
          # so it can't shadow the deploy key used for the submodule below.
          persist-credentials: false

      - name: Fetch lora-privacy submodule
        env:
          # vendor/lora-privacy is a separate private repo
          # (JetBrains-Research/LoRA-Privacy) the default token can't read. Its
          # .gitmodules URL is git@github.com:..., so a read-only deploy key loaded
          # over SSH authenticates the clone directly — no org/SAML/PAT approval.
          DEPLOY_KEY: ${{ secrets.LORA_PRIVACY_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::LORA_PRIVACY_DEPLOY_KEY is empty or not visible to this job."
            echo "It must be an Actions secret on this repo (or on the 'devcontainer'"
            echo "environment this job declares), holding a PASSPHRASE-FREE private key"
            echo "whose public half is a read-only deploy key on"
            echo "JetBrains-Research/LoRA-Privacy."
            exit 1
          fi

          mkdir -p ~/.ssh
          # tr -d '\r': a key pasted with Windows line endings keeps its CRs through
          # the secret store, and ssh rejects it as "error in libcrypto" -- an opaque
          # message that reads like a permissions problem but is a parse failure.
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/lora_privacy
          chmod 600 ~/.ssh/lora_privacy

          # Validate the key here, where the diagnosis is legible, rather than
          # letting git clone report it as "Permission denied (publickey)".
          # -P '' and </dev/null: without both, an encrypted key makes ssh-keygen
          # prompt for a passphrase and hang until the job's 120-minute timeout.
          if ! ssh-keygen -y -P '' -f ~/.ssh/lora_privacy >/dev/null 2>/tmp/keyerr </dev/null; then
            echo "::error::LORA_PRIVACY_DEPLOY_KEY is not a parseable private key."
            echo "ssh-keygen: $(cat /tmp/keyerr)"
            echo "lines in secret: $(wc -l < ~/.ssh/lora_privacy)"
            # Shape only -- never echo key material, masked or not.
            if head -1 ~/.ssh/lora_privacy | grep -q 'BEGIN .*PRIVATE KEY'; then
              echo "The PEM header is present, so the body is truncated or re-wrapped."
            else
              echo "The first line is not a PEM header, so the secret is empty or mangled."
            fi
            echo "Fix: ssh-keygen -t ed25519 -N '' -f ./k, register ./k.pub on"
            echo "LoRA-Privacy as a deploy key, then paste ALL of ./k into the secret."
            exit 1
          fi

          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/lora_privacy -o IdentitiesOnly=yes"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h

      - name: Compute image tags
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}-${GITHUB_SHA::7}"
          else
            SANITIZED="$(echo "${GITHUB_REF_NAME}" | sed 's#[^a-zA-Z0-9._-]#-#g')"
            TAG="${SANITIZED}-${GITHUB_SHA::7}"
          fi
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "tag=${TAG}"
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        if: env.DO_PUSH == 'true'
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: Login to Artifact Registry
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/zenml/Dockerfile
          platforms: linux/amd64
          push: ${{ env.DO_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### opaque-train image"
            echo
            if [ "${DO_PUSH}" = "true" ]; then
              echo "Pushed \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            else
              echo "Built \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\` (not pushed)"
            fi
            echo
            echo "Submit against it from your laptop:"
            echo '```bash'
            echo "export OPAQUE_DOCKER_REGISTRY=${REGISTRY}"
            echo "export OPAQUE_DOCKER_TAG=${{ steps.meta.outputs.tag }}"
            echo "python deploy/zenml/run.py smoke --no-gpu"
            echo "python deploy/zenml/run.py both"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
