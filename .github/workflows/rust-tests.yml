name: Rust tests

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Ref to test. Leave empty to test the triggering SHA.
        required: false
        default: ""
        type: string
      include-slow:
        description: Include tests marked with `#[ignore = "slow"]`.
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: opaque-accounting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: ./.github/actions/setup-rust
        with:
          enable-cache: "true"

      # No `--lib`: also run doc-tests so documented API examples cannot rot.
      - name: cargo test
        run: cargo test --manifest-path packages/opaque-accounting/Cargo.toml

      - name: cargo test (slow)
        if: inputs.include-slow
        run: >-
          cargo test --manifest-path packages/opaque-accounting/Cargo.toml
          --lib -- --ignored
