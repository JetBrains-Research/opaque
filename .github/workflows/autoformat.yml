name: Auto-format & Lint

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: autoformat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-python:
    name: Format Python (Ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Format Python code
        run: uv run ruff format packages/

      - name: Auto-fix linting issues
        run: uv run ruff check --fix packages/ || true

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: auto-format Python with ruff"
          file_pattern: "packages/**/*.py"

  format-rust:
    name: Format Rust (fmt + clippy)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format Rust code
        run: cargo fmt --manifest-path packages/opaque-accounting/Cargo.toml

      - name: Auto-fix clippy issues
        run: cargo clippy --manifest-path packages/opaque-accounting/Cargo.toml --fix --allow-dirty || true

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: auto-format Rust with fmt + clippy"
          file_pattern: "packages/opaque-accounting/**/*.rs"
