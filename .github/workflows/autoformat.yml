name: Auto-format & Lint

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: autoformat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-python:
    name: Format Python
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Use the lockfile ruff (not unpinned `uvx ruff`) so CI and local
      # `uv run ruff` stay on the same version. Rule selection lives in
      # pyproject.toml `[tool.ruff.lint]`.
      - name: Install locked ruff
        run: uv sync --group dev --no-install-workspace --frozen

      - name: Format Python code
        run: uv run --no-sync ruff format packages/

      - name: Auto-fix linting issues
        run: uv run --no-sync ruff check --fix packages/

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: auto-format Python with ruff"
          file_pattern: "packages/**/*.py"

      - name: Verify no remaining issues
        run: |
          uv run --no-sync ruff format --check packages/
          uv run --no-sync ruff check packages/

  format-rust:
    name: Format Rust
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format Rust code
        run: cargo fmt --manifest-path packages/opaque-accounting/Cargo.toml

      - name: Auto-fix clippy issues
        run: cargo clippy --manifest-path packages/opaque-accounting/Cargo.toml --fix --allow-dirty --allow-staged

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: auto-format Rust with fmt + clippy"
          file_pattern: "packages/opaque-accounting/**/*.rs"

      - name: Verify no remaining issues
        run: |
          cargo fmt --manifest-path packages/opaque-accounting/Cargo.toml -- --check
          cargo clippy --manifest-path packages/opaque-accounting/Cargo.toml -- -D warnings
