name: Auto-format

on:
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new workflow with the same group name is triggered
concurrency:
  group: autoformat-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autoformat:
    name: Auto-format with Ruff
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          uv sync

      - name: Run ruff format
        run: |
          uv run ruff format src/ tests/

      - name: Run ruff check with autofixes
        run: |
          uv run ruff check --fix src/ tests/ || true

      - name: Check for changes
        id: git-check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Auto-format with ruff

          🤖 Automated formatting by GitHub Actions"
          git push

      - name: Fail if unfixable issues remain
        run: |
          uv run ruff check src/ tests/
