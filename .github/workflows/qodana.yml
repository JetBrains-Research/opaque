name: Qodana analysis

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Ref to analyze. Leave empty to analyze the triggering SHA.
        required: false
        default: ""
        type: string
      coverage-artifact-pattern:
        description: Coverage artifact pattern from the caller's test matrix.
        required: true
        type: string
      pr-mode:
        description: Analyze only changes introduced by the pull request.
        required: true
        type: boolean
      fail-on-problems:
        description: Fail the calling workflow when Qodana reports policy violations.
        required: true
        type: boolean

concurrency:
  group: qodana-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Qodana
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: ./.github/actions/run-qodana
        with:
          analyzed-sha: ${{ inputs.checkout-ref || github.sha }}
          coverage-artifact-pattern: ${{ inputs.coverage-artifact-pattern }}
          fail-on-problems: ${{ inputs.fail-on-problems }}
          pr-mode: ${{ inputs.pr-mode }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
