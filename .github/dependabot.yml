# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot

version: 2

updates:
  # Update GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "evgri243"
    open-pull-requests-limit: 5

  # Update Rust dependencies
  - package-ecosystem: "cargo"
    directory: "packages/opaque-accounting"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    reviewers:
      - "evgri243"
    open-pull-requests-limit: 5

  # Update root workspace Python dependencies (dev/examples/docs groups)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "evgri243"
    open-pull-requests-limit: 10
    # Ignore patch updates for stable dependencies
    ignore:
      - dependency-name: "torch"
        update-types: [ "version-update:semver-patch" ]
      - dependency-name: "transformers"
        update-types: [ "version-update:semver-patch" ]

  # ── Per-package Python dependencies ──────────────────────────────────

  # opaque-base — stdlib-only currently, included for future deps
  - package-ecosystem: "pip"
    directory: "packages/opaque-base"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "evgri243"
    open-pull-requests-limit: 5

  # opaque-accounting — Python deps are only opaque-base, included for future deps
  - package-ecosystem: "pip"
    directory: "packages/opaque-accounting"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "evgri243"
    open-pull-requests-limit: 5

  # opaque-engine — torch, numpy, optree
  - package-ecosystem: "pip"
    directory: "packages/opaque-engine"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    reviewers:
      - "evgri243"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "torch"
        update-types: [ "version-update:semver-patch" ]

  # opaque-optimizers — torchopt
  - package-ecosystem: "pip"
    directory: "packages/opaque-optimizers"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
