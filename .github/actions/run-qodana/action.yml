name: Run Qodana
description: Download coverage, run Qodana, and publish its SARIF report.

inputs:
  analyzed-sha:
    description: Commit SHA that Qodana analyzes.
    required: true
  coverage-artifact-pattern:
    description: Coverage artifact pattern from the caller's test matrix.
    required: true
  fail-on-problems:
    description: Fail the action when Qodana reports policy violations.
    required: true
  pr-mode:
    description: Analyze only pull-request changes.
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rust

    - uses: ./.github/actions/setup-python

    - name: Download coverage from Python test shards
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
      with:
        pattern: ${{ inputs.coverage-artifact-pattern }}
        path: .qodana/code-coverage
        merge-multiple: true

    - name: Run Qodana
      id: qodana
      uses: JetBrains/qodana-action@b588768b6e7e6da579e518bc584f79de0d243692 # v2026.2.0
      continue-on-error: ${{ inputs.fail-on-problems != 'true' }}
      with:
        # Promo inspections are suggestions outside the configured profile.
        args: --run-promo false
        artifact-name: qodana-report
        post-pr-comment: ${{ inputs.pr-mode }}
        pr-mode: ${{ inputs.pr-mode }}
        results-dir: ${{ runner.temp }}/qodana/results
        upload-result: true
        use-annotations: false
        use-caches: true
      env:
        QODANA_TOKEN: ${{ env.QODANA_TOKEN }}

    - name: Verify SARIF report
      id: sarif
      if: ${{ !cancelled() }}
      env:
        SARIF_PATH: ${{ runner.temp }}/qodana/results/qodana.sarif.json
      shell: bash
      run: |
        if [[ ! -s "$SARIF_PATH" ]]; then
          echo "::error::Qodana did not produce a non-empty SARIF report at $SARIF_PATH"
          exit 1
        fi
        echo "path=$SARIF_PATH" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to GitHub code scanning
      if: ${{ !cancelled() && steps.sarif.outcome == 'success' }}
      uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
      with:
        category: qodana/python
        checkout_path: ${{ github.workspace }}
        ref: ${{ inputs.pr-mode == 'true' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        sarif_file: ${{ steps.sarif.outputs.path }}
        sha: ${{ inputs.analyzed-sha }}
        wait-for-processing: true
