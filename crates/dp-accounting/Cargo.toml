[package]
name = "opaque-dp-accounting"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "High-performance differential privacy accounting using Privacy Loss Distributions"
repository = "https://github.com/JetBrains-Research/opaque"
keywords = ["differential-privacy", "privacy", "pld", "dp-sgd", "machine-learning"]
categories = ["science", "mathematics", "algorithms"]

[lib]
name = "opaque_dp_accounting"
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "2"
statrs = "0.18"
realfft = "3.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"], optional = true }
pyo3 = { version = "0.23", features = ["extension-module"], optional = true }

[dev-dependencies]
approx = "0.5"

[features]
default = []
python-extension = ["pyo3"]
nightly = []
