[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "opaque-accounting"
version = "0.1.0"
description = "High-performance differential privacy accounting using Privacy Loss Distributions"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Opaque Contributors" },
]
requires-python = ">=3.11"
keywords = [
    "differential-privacy",
    "privacy",
    "pld",
    "dp-sgd",
    "machine-learning",
    "privacy-accounting",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/JetBrains-Research/opaque"
Documentation = "https://github.com/JetBrains-Research/opaque/tree/main/crates/dp-accounting"
Repository = "https://github.com/JetBrains-Research/opaque"
Issues = "https://github.com/JetBrains-Research/opaque/issues"
Changelog = "https://github.com/JetBrains-Research/opaque/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "validation" },
]
test = [
    "pytest>=7.0",
]
validation = [
    "numpy>=1.20",
    "scipy>=1.7",
    "dp-accounting>=0.4.4",
    "riskcal>=1.2.0",
]

[tool.uv]
package = true
override-dependencies = [
    "dp-accounting>=0.4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "validation: Validation against dp_accounting and riskcal (requires numpy, scipy, dp_accounting, riskcal)",
]

[tool.maturin]
features = ["python-extension"]
module-name = "opaque_accounting.opaque_accounting"
