[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "opaque-dp-accounting"
version = "0.1.0"
description = "High-performance differential privacy accounting using Privacy Loss Distributions"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = []

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "validation" },
]
test = [
    "pytest>=7.0",
]
validation = [
    "numpy>=1.20",
    "scipy>=1.7",
    "dp-accounting>=0.4.4",
    "riskcal>=1.2.0",
]

[tool.uv]
package = true
override-dependencies = [
    "dp-accounting>=0.4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "validation: Validation against dp_accounting and riskcal (requires numpy, scipy, dp_accounting, riskcal)",
]

[tool.maturin]
features = ["python-extension"]
module-name = "opaque_dp_accounting"
