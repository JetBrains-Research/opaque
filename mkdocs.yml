site_name: Opaque
site_description: Functional Differential Privacy for PyTorch LoRA Fine-tuning
site_author: Opaque Contributors
site_url: https://opaque.readthedocs.io

repo_name: evgri243/opaque
repo_url: https://github.com/evgri243/opaque
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - Differential Privacy Basics: user-guide/dp-basics.md
    - Gradient Clipping: user-guide/clipping.md
    - LoRA Fine-tuning: user-guide/lora.md
  - API Reference:
    - Core:
      - PyTree Utilities: api/core/pytree_utils.md
      - Clipping: api/core/clipping.md
  - Development:
    - Contributing: development/contributing.md
    - TDD Workflow: development/tdd-workflow.md
    - Architecture: development/architecture.md
    - JAX-Privacy Comparison: development/jax-privacy-comparison.md
    - Design Decisions: development/design-decisions.md
    - Roadmap: development/roadmap.md
    - Stage 1 Plan: development/stage1-plan.md
  - Examples:
    - Linear Regression (Guide): examples/linear_regression.md
    - Linear Regression (Notebook): examples/clipped_grad_linear_regression.ipynb

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/evgri243/opaque
  version:
    provider: mike
