site_name: Opaque
site_description: Functional Differential Privacy for PyTorch LoRA Fine-tuning
site_author: Opaque Contributors
site_url: https://opaque.readthedocs.io

repo_name: evgri243/opaque
repo_url: https://github.com/evgri243/opaque
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - Tutorials:
    - Overview: tutorials/README.md
    - 01 - Gradient Clipping from Basics: tutorials/01_gradient_clipping_from_basics.ipynb
    - 02 - DP Noise and Accounting: tutorials/02_differential_privacy_noise_and_accounting.ipynb
    - 03 - Complete DP-SGD Training: tutorials/03_complete_dp_sgd_training.ipynb
    - 04 - Functional DP with TorchOpt: tutorials/04_dp_optimizers.ipynb
    - 05 - Sampling and Microbatching: tutorials/05_sampling_and_microbatching.ipynb
    - 06 - LoRA HuggingFace Training: tutorials/06_lora_huggingface_dp_training.ipynb
  - User Guide:
      - Overview: user-guide/index.md
    - Differential Privacy Basics: user-guide/dp-basics.md
      - Per-Sample Gradient Clipping: user-guide/clipping.md
      - Noise Addition: user-guide/noise.md
      - Privacy Accounting: user-guide/accounting.md
      - Optimizers & Adaptive Clipping: user-guide/optimizers.md
      - Poisson Sampling & Microbatching: user-guide/sampling.md
    - LoRA Fine-tuning: user-guide/lora.md
  - API Reference:
      - Overview: api/index.md
      - Utils:
      - PyTree Utilities: api/core/pytree_utils.md
      - Functional Utilities: api/functional_utils.md
      - Clipping: api/core/clipping.md
      - Noise: api/noise.md
      - Accounting: api/accounting.md
      - Optimizers: api/optimizers.md
      - Sampling: api/sampling.md
  - Development:
    - Contributing: development/contributing.md
    - TDD Workflow: development/tdd-workflow.md
    - Roadmap: development/roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/evgri243/opaque
  version:
    provider: mike
