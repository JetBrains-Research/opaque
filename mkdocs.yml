site_name: Opaque
site_description: Functional DP-SGD for PyTorch
site_author: Opaque Contributors
site_url: https://jetbrains-research.github.io/opaque/

repo_name: JetBrains-Research/opaque
repo_url: https://github.com/JetBrains-Research/opaque
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - Overview: user-guide/index.md
    - Differential Privacy Concepts: user-guide/dp-concepts.md
    - Random Number Generation: user-guide/rng-key.md
    - Per-Example Gradient Clipping: user-guide/clipping.md
    - Noise Addition: user-guide/noise.md
    - Privacy Accounting: user-guide/accounting.md
    - Sampling & Microbatching: user-guide/sampling.md
    - Optimizers: user-guide/optimizers.md
    - Distributed Training: user-guide/distributed.md
    - HuggingFace Compatibility: user-guide/huggingface.md
    - Memory Optimizations: user-guide/memory-optimizations.md
    - Privacy Auditing: user-guide/auditing.md
    - Known Limitations: limitations.md
  - Mechanisms:
    - Overview: mechanisms/index.md
    - Gaussian: mechanisms/gaussian.md
    - Truncated Gaussian: mechanisms/truncated-gaussian.md
    - BandMF: mechanisms/band-mf.md
    - BLT: mechanisms/blt.md
    - Dense MF: mechanisms/dense-mf.md
  - Tutorials:
    - Overview: tutorials/README.md
    - DP-SGD Training: tutorials/dp_sgd_training.ipynb
    - Accounting & Calibration: tutorials/accounting_and_calibration.ipynb
    - Fine-tuning an LLM: tutorials/llm_finetuning.ipynb
    - Sampling & Microbatching: tutorials/sampling_and_microbatching.ipynb
    - Privacy Auditing: tutorials/privacy_auditing.ipynb
    - Distributed Training: tutorials/distributed_training.ipynb
  - API Reference:
    - Overview: api/index.md
    - Clipping: api/clipping.md
    - Noise: api/noise.md
    - Accounting: api/accounting.md
    - Sampling: api/sampling.md
    - Random: api/rng.md
    - Distributed: api/distributed.md
    - Auditing: api/auditing.md
    - Utilities: api/utilities.md
    - Optimizers: api/optimizers.md
  - Development:
    - Contributing: development/contributing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JetBrains-Research/opaque
  version:
    provider: mike
