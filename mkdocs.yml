site_name: Opaque
site_description: Functional DP-SGD for PyTorch
site_author: Opaque Contributors
site_url: https://jetbrains-research.github.io/opaque/

repo_name: JetBrains-Research/opaque
repo_url: https://github.com/JetBrains-Research/opaque
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/opaque-base/src
            - packages/opaque-engine/src
            - packages/opaque-optimizers/src
            - packages/opaque-dpsgd/src
            - packages/opaque-dpftrl/src
            - packages/opaque-auditing/src
            - packages/opaque-accounting/src
            - packages/opaque-patches/src
            - packages/opaque-transformers/src
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
  - mkdocs-jupyter:
      include_source: true
      execute: false

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
  - User Guide:
    - Overview: user-guide/index.md
    - Differential Privacy Concepts: user-guide/dp-concepts.md
    - Random Number Generation: user-guide/rng-key.md
    - Per-Example Gradient Clipping: user-guide/clipping.md
    - Noise Addition: user-guide/noise.md
    - Correlated noise (DP-FTRL): user-guide/dp-ftrl.md
    - Privacy Accounting: user-guide/accounting.md
    - Sampling & Microbatching: user-guide/sampling.md
    - Optimizers: user-guide/optimizers.md
    - LR Scheduling: user-guide/lr-scheduling.md
    - Distributed Training: user-guide/distributed.md
    - HuggingFace Compatibility: user-guide/huggingface.md
    - Memory Optimizations: user-guide/memory-optimizations.md
    - Privacy Auditing: user-guide/auditing.md
    - Known Limitations: limitations.md
  - Mechanisms:
    - Overview: mechanisms/index.md
    - Gaussian: mechanisms/gaussian.md
    - BSR: mechanisms/bsr.md
    - BandMF: mechanisms/band-mf.md
    - BLT: mechanisms/blt.md
    - DP-λCGD: mechanisms/lambda-cgd.md
    - BISR: mechanisms/bisr.md
  - Tutorials:
    - Overview: tutorials/README.md
    - DP-SGD Training: tutorials/dp_sgd_training.ipynb
    - Accounting & Calibration: tutorials/accounting_and_calibration.ipynb
    - Fine-tuning an LLM: tutorials/llm_finetuning.ipynb
    - Sampling & Microbatching: tutorials/sampling_and_microbatching.ipynb
    - Privacy Auditing: tutorials/privacy_auditing.ipynb
    - Distributed Training: tutorials/distributed_training.ipynb
  - API Reference:
    - Overview: reference/index.md
    - Serialization: reference/serialization.md
    - Clipping: reference/clipping.md
    - Noise: reference/noise.md
    - Accounting: reference/accounting.md
    - Sampling: reference/sampling.md
    - Random: reference/rng.md
    - Distributed: reference/distributed.md
    - Auditing: reference/auditing.md
    - Utilities: reference/utilities.md
    - Optimizers: reference/optimizers.md
    - Schedules: reference/schedules.md
  - Extending Opaque:
    - Overview: extending/index.md
    - Serialization registry: extending/serialization.md
    - Distributed sync: extending/distributed-sync.md
    - Clipping fun helpers: extending/clipping-fun.md
    - Adding a new mechanism family: extending/new-mechanism.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JetBrains-Research/opaque
  version:
    provider: mike
