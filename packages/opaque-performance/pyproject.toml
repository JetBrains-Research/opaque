[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-performance"
version = "0.0.0.dev0"
description = "Opaque fused Triton kernels and PyTorch gradient-checkpointing patches for vmap"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.13"
keywords = ["triton", "kernels", "pytorch", "vmap", "lora"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.10.0",
    "opaque-core>=0.0.0.dev0",
]

[project.optional-dependencies]
kernels = ["triton>=3.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.performance*"]
namespaces = true

[tool.uv]
package = true

[tool.uv.sources]
opaque-core = { workspace = true }
