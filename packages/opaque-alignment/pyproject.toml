[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-alignment"
dynamic = ["version"]
description = "Functional primitives for DP-safe preference learning (DPO, SFT)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = [
    "differential-privacy",
    "preference-learning",
    "dpo",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "torch>=2.9.0",
    "transformers>=4.57.0,<6",
    "datasets>=2.0.0",
    "peft>=0.13.0",
    # safetensors is the on-disk format for the DPO reference-logp cache
    # (`opaque.api.alignment.dpo.reference._precompute`). Already pulled in
    # transitively by transformers; declared directly because we import it.
    "safetensors>=0.4",
    "opaque-engine>=0.0.0.dev0",
    "opaque-torch>=0.0.0.dev0",
    "opaque-base>=0.0.0.dev0",
    # NO opaque-kernels: alignment-specific kernels live inside this package
    #   (Opaque_FusedLinearPreference is self-contained pure-PyTorch).
    # NO opaque-dpsgd, NO opaque-dpftrl, NO opaque-optimizers
    #   — mechanism + optimizer are chosen by the caller.
]

[project.optional-dependencies]
# Recipe path for SFT users who want opaque_linear_cross_entropy_loss memory
# optimization. Not needed for the alignment primitives themselves.
patches = ["opaque-kernels>=0.0.0.dev0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.alignment*", "opaque.api.alignment*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-engine = { workspace = true }
opaque-torch = { workspace = true }
opaque-base = { workspace = true }
opaque-kernels = { workspace = true }
