[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "opaque-accounting"
version = "0.0.0.dev0"
description = "High-performance differential privacy accounting using Privacy Loss Distributions"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
authors = [{name = "Opaque Contributors"}]
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

[project.optional-dependencies]
cross-validation = [
    "dp-accounting>=0.4.4",
    "riskcal>=1.2.0",
]

[tool.uv]
package = true

[tool.maturin]
features = ["python-extension"]
module-name = "opaque.accounting._native"
python-source = "src"
python-packages = ["opaque.accounting"]
