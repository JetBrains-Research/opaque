[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-base"
dynamic = ["version"]
description = "Opaque foundation: pure-Python serialization registry and dispatcher (the seam used by every other opaque wheel)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.13"
keywords = ["differential-privacy", "serialization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
# opaque-base is intentionally torch-free. It ships only the pure-Python
# serialization registry + dispatcher that every other opaque wheel
# registers handlers against. Adding any third-party dependency here
# would propagate into opaque-accounting (the only standalone consumer
# besides opaque-engine) and break the "torch-free accounting" guarantee.
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.api.base*", "opaque.serialization*"]
namespaces = true

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true
