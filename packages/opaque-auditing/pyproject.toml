[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-auditing"
version = "0.0.0.dev0"
description = "Opaque empirical privacy auditing: one-run estimator, coin-flip, membership inference"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.13"
keywords = ["differential-privacy", "privacy-auditing", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "torch>=2.10.0",
    "scipy>=1.11.0",
    "opaque-core>=0.0.0.dev0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque*"]
namespaces = true

[tool.uv]
package = true

[tool.uv.sources]
opaque-core = { workspace = true }
