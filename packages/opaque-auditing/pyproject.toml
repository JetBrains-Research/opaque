[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-auditing"
dynamic = ["version"]
description = "Opaque empirical privacy auditing: one-run estimator, coin-flip, membership inference"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["differential-privacy", "privacy-auditing", "membership-inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "scipy>=1.11.0",
    "numpy>=1.22",
    "opaque-engine>=0.0.0.dev0",
]

[dependency-groups]
# The collation helper stacks native arrays, so its tests need a provider to
# execute on. ARC-006 allows that for a wheel-local test provided the
# requirement is declared rather than inherited from the developer environment.
test = ["opaque-torch>=0.0.0.dev0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.auditing*", "opaque.api.auditing*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-engine = { workspace = true }
