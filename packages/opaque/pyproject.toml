[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque"
dynamic = ["version"]
description = "Functional Differential Privacy for LoRA Fine-tuning (meta-package)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.13"
keywords = [
    "differential-privacy",
    "dp-sgd",
    "dp-ftrl",
    "pytorch",
    "lora",
    "fine-tuning",
    "llm",
    "privacy",
    "machine-learning",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "opaque-core==0.0.0.dev0",
    "opaque-dpsgd==0.0.0.dev0",
    "opaque-accounting==0.0.0.dev0",
]

[project.optional-dependencies]
auditing = ["opaque-auditing==0.0.0.dev0"]
dpftrl = ["opaque-dpftrl==0.0.0.dev0"]
performance = ["opaque-performance==0.0.0.dev0"]
huggingface = [
    "opaque-huggingface==0.0.0.dev0",
    "opaque-performance==0.0.0.dev0",
]
peft = [
    "opaque-huggingface[peft]==0.0.0.dev0",
    "opaque-performance==0.0.0.dev0",
]
all = [
    "opaque-auditing==0.0.0.dev0",
    "opaque-dpftrl==0.0.0.dev0",
    "opaque-performance==0.0.0.dev0",
    "opaque-huggingface[peft]==0.0.0.dev0",
]

# Metadata-only meta-package: no src/, no tests/, no code shipped.
# The ``opaque`` namespace is pure PEP 420 and is composed by whichever
# ``opaque-*`` sub-packages are installed alongside.

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"

[tool.uv]
package = true

[tool.uv.sources]
opaque-core = { workspace = true }
opaque-dpsgd = { workspace = true }
opaque-dpftrl = { workspace = true }
opaque-auditing = { workspace = true }
opaque-performance = { workspace = true }
opaque-huggingface = { workspace = true }
opaque-accounting = { workspace = true }
