[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque"
version = "0.0.0.dev0"
description = "Functional Differential Privacy for LoRA Fine-tuning (meta-package)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.13"
keywords = [
    "differential-privacy",
    "dp-sgd",
    "pytorch",
    "lora",
    "fine-tuning",
    "llm",
    "privacy",
    "machine-learning",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "opaque-core==0.0.0.dev0",
    "opaque-dpsgd==0.0.0.dev0",
    "opaque-auditing==0.0.0.dev0",
    "opaque-accounting==0.0.0.dev0",
]

[project.optional-dependencies]
mf = ["opaque-mf==0.0.0.dev0"]
performance = ["opaque-performance==0.0.0.dev0"]
huggingface = [
    "opaque-huggingface==0.0.0.dev0",
    "opaque-performance==0.0.0.dev0",
]
auditing = ["opaque-auditing==0.0.0.dev0"]
all = [
    "opaque-mf==0.0.0.dev0",
    "opaque-performance==0.0.0.dev0",
    "opaque-huggingface==0.0.0.dev0",
    "opaque-auditing==0.0.0.dev0",
    "opaque-dpsgd[optimizers]==0.0.0.dev0",
    "opaque-mf[optimizers]==0.0.0.dev0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque*"]
namespaces = true

[tool.uv]
package = true

[tool.uv.sources]
opaque-core = { workspace = true }
opaque-dpsgd = { workspace = true }
opaque-mf = { workspace = true }
opaque-auditing = { workspace = true }
opaque-performance = { workspace = true }
opaque-huggingface = { workspace = true }
opaque-accounting = { workspace = true }
