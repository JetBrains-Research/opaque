[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-mlx"
dynamic = ["version"]
description = "MLX provider for Opaque's backend-neutral engine"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.13"
keywords = ["differential-privacy", "mlx", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "opaque-engine>=0.0.0.dev0",
    "mlx>=0.22.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dpsgd = ["opaque-dpsgd>=0.0.0.dev0"]
dpftrl = ["opaque-dpftrl>=0.0.0.dev0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.api.mlx*", "opaque.mlx*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-engine = { workspace = true }
opaque-dpsgd = { workspace = true }
opaque-dpftrl = { workspace = true }