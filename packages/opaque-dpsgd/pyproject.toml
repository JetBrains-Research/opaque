[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-dpsgd"
dynamic = ["version"]
description = "Opaque DP-SGD: backend-neutral Gaussian noise and per-group calibration"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["differential-privacy", "dp-sgd", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "opaque-engine>=0.0.0.dev0",
    "opaque-accounting>=0.0.0.dev0",
]

[project.optional-dependencies]
optimizers = ["opaque-optimizers>=0.0.0.dev0"]

# ARC-006: this package is backend-neutral, but its tests execute real
# numerics and therefore need a backend. Declare that requirement rather
# than relying on the monorepo dev environment to supply one.
[dependency-groups]
test = ["opaque-torch>=0.0.0.dev0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.dpsgd*", "opaque.api.dpsgd*", "opaque.api.accounting.dpsgd*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-torch = { workspace = true }
opaque-engine = { workspace = true }
opaque-accounting = { workspace = true }
opaque-optimizers = { workspace = true }
