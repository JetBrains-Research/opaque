[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-federated"
dynamic = ["version"]
description = "Opaque federated learning on IFED: federated twins of the DP loop's data primitives (population, cohort sampler, loader, clipped_sum, clipped_grad)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["differential-privacy", "federated-learning", "pytorch", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
# No torch bound of our own: ifed-sdk pins torch==2.11.0 because its prebuilt
# agent bridge is compiled against that exact minor, and a second bound here
# could only ever conflict with it.
dependencies = [
    "opaque-engine>=0.0.0.dev0",
    "ifed-sdk==5.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.federated*", "opaque.api.federated*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

# ifed-* sources live at the WORKSPACE ROOT pyproject: member-level sources
# travel with this package when it is consumed as a path dependency (e.g. from
# the ifed repo's own examples), where they would conflict with the consumer's
# ifed checkout.
[tool.uv.sources]
opaque-engine = { workspace = true }
