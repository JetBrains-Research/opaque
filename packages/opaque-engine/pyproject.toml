[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-engine"
dynamic = ["version"]
description = "Backend-neutral primitives and algorithms for Opaque"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["differential-privacy", "privacy", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "opaque-base>=0.0.0.dev0",
    "numpy>=1.22",
    "optree>=0.17.0",
]

[dependency-groups]
test = [
  "opaque-torch>=0.0.0.dev0",
  "opaque-mlx>=0.0.0.dev0; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "transformers>=5.0.0,<6",
]

[tool.setuptools]
# Single-file façades at the namespace root — listed because
# ``find_packages`` only discovers sub-packages (directories with
# ``__init__``).
py-modules = [
    "opaque.autodiff",
    "opaque.execution",
    "opaque.ops",
    "opaque.primitive",
    "opaque.types",
    "opaque.pytree",
    "opaque.sampling",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "opaque.api.engine*",
    "opaque.backend*",
    "opaque.random*",
    "opaque.distributed*",
    "opaque.functional*",
    "opaque.scheduling*",
    "opaque.profiling*",
    "opaque.precision*",
]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-base = { workspace = true }
opaque-torch = { workspace = true }
opaque-mlx = { workspace = true }
