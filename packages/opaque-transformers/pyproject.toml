[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-transformers"
dynamic = ["version"]
description = "Opaque HuggingFace Transformers patches: vmap compatibility + fused kernel integration"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.13"
keywords = ["differential-privacy", "huggingface", "transformers", "lora", "vmap"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.10.0",
    "transformers>=4.57.0,<5",
    "peft>=0.18.0",
    "datasets>=2.0.0",
    "torchopt>=0.7.0",
    "opaque-core",
    "opaque-patches",
    "opaque-accounting",
    "opaque-dpsgd",
]

[project.optional-dependencies]
trainer = [
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.transformers*"]
namespaces = true

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-core = { workspace = true }
opaque-patches = { workspace = true }
opaque-dpsgd = { workspace = true }
opaque-accounting = { workspace = true }
