[build-system]
requires = ["setuptools>=61.0.0", "setuptools-scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-transformers"
dynamic = ["version"]
description = "Hugging Face compatibility layer for Opaque."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Opaque Authors", email = "federated-compute@jetbrains.com" },
]
dependencies = [
    "transformers==4.57.1",
    "peft>=0.13.0",
    "datasets>=2.0.0",
    "opaque-engine",
    "opaque-patches",
    "opaque-dpsgd",
    "opaque-accounting",
    "opaque-optimizers",
]

[project.optional-dependencies]
# Per-backend HPO extras. Each lazy-imports inside ``DPTrainer.hyperparameter_search``.
optuna-hpo = [
    "optuna>=3.0",
]
wandb-hpo = [
    "wandb>=0.16.0",
]
ray-hpo = [
    "ray[tune]>=2.7,<3",
]
hpo = [
    "optuna>=3.0",
    "wandb>=0.16.0",
    "ray[tune]>=2.7,<3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.transformers*", "opaque.api.transformers*"]
namespaces = true

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0.dev0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-engine = { workspace = true }
opaque-patches = { workspace = true }
opaque-dpsgd = { workspace = true }
opaque-accounting = { workspace = true }
opaque-optimizers = { workspace = true }
