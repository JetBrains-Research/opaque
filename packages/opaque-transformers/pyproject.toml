[build-system]
requires = ["setuptools>=61.0.0", "setuptools-scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-transformers"
dynamic = ["version"]
description = "Hugging Face compatibility layer for Opaque."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Opaque Authors", email = "federated-compute@jetbrains.com" },
]
dependencies = [
    "transformers>=4.57.0,<6",
    "peft>=0.13.0",
    "datasets>=2.0.0",
    "opaque-engine",
    "opaque-patches",
    "opaque-dpsgd",
    "opaque-dpftrl",
    "opaque-accounting",
    "opaque-optimizers",
    "opaque-alignment",
]

[project.optional-dependencies]
# Enables the ``opaque.transformers.trl.SFTConfig.from_trl`` /
# ``DPOConfig.from_trl`` classmethods, which accept a real
# ``trl.SFTConfig`` / ``trl.DPOConfig`` instance and translate it into
# opaque's equivalent. The opaque trainers themselves do NOT require trl
# — they re-implement the TRL-shaped surface natively. This extra is
# only for users coming from existing TRL pipelines who want to convert
# their configs.
trl = ["trl>=1.0,<2.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.transformers*", "opaque.api.transformers*"]
namespaces = true

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0.dev0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-engine = { workspace = true }
opaque-patches = { workspace = true }
opaque-dpsgd = { workspace = true }
opaque-dpftrl = { workspace = true }
opaque-accounting = { workspace = true }
opaque-optimizers = { workspace = true }
opaque-alignment = { workspace = true }
