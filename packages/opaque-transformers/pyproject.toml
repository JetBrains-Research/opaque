[build-system]
requires = ["setuptools>=61.0.0", "setuptools-scm>=8.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-transformers"
dynamic = ["version"]
description = "Hugging Face trainer integration for Opaque: DP-aware training loop, TRL-style SFT/DPO support, and Hugging Face compatibility layers."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = [
    "differential-privacy",
    "huggingface",
    "transformers",
    "pytorch",
    "privacy",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "transformers>=5.0.0,<6",
    "peft>=0.13.0",
    "datasets>=2.0.0",
    "numpy>=1.24",
    "opaque-engine>=0.0.0.dev0",
    "opaque-patches>=0.0.0.dev0",
    "opaque-dpsgd>=0.0.0.dev0",
    "opaque-dpftrl>=0.0.0.dev0",
    "opaque-accounting>=0.0.0.dev0",
    "opaque-optimizers>=0.0.0.dev0",
    "opaque-alignment>=0.0.0.dev0",
]

[project.optional-dependencies]
# Enables the ``opaque.transformers.trl.SFTConfig.from_trl`` /
# ``DPOConfig.from_trl`` classmethods, which accept a real
# ``trl.SFTConfig`` / ``trl.DPOConfig`` instance and translate it into
# opaque's equivalent. The opaque trainers themselves do NOT require trl
# — they re-implement the TRL-shaped surface natively. This extra is
# only for users coming from existing TRL pipelines who want to convert
# their configs.
trl = ["trl>=1.0,<2.0"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.transformers*", "opaque.api.transformers*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0.dev0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-engine = { workspace = true }
opaque-patches = { workspace = true }
opaque-dpsgd = { workspace = true }
opaque-dpftrl = { workspace = true }
opaque-accounting = { workspace = true }
opaque-optimizers = { workspace = true }
opaque-alignment = { workspace = true }
