[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-optimizers"
dynamic = ["version"]
description = "Opaque functional optimizers (torchopt-based, DP-aware update surface)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.13"
keywords = ["differential-privacy", "pytorch", "optimizers", "torchopt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
# Depends on opaque-engine (not opaque-base) because optimizer state
# uses ClippedPytree / NoisedPytree / PerGroup, all of which live in
# opaque.api.engine.types.
dependencies = [
    "opaque-engine>=0.0.0.dev0",
    "torch>=2.13.0",
    "torchopt>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.api.optimizers*", "opaque.optimizers*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true
