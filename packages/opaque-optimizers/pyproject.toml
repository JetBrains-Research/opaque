[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-optimizers"
dynamic = ["version"]
description = "Opaque backend-neutral functional optimizers"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["differential-privacy", "optimizers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
# Depends on opaque-engine (not opaque-base) because optimizer state
# uses ClippedPytree / NoisedPytree / PerGroup, all of which live in
# opaque.api.engine.types.
dependencies = [
    "opaque-engine>=0.0.0.dev0",
]

# ARC-006: this package is backend-neutral, but its tests execute real
# numerics and therefore need each production backend supported on the current
# platform. Declare that requirement rather than inheriting developer extras.
[dependency-groups]
test = [
  "opaque-torch>=0.0.0.dev0",
  "opaque-mlx>=0.0.0.dev0; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "torchopt>=0.7.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["opaque.api.optimizers*", "opaque.optimizers*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true

[tool.uv.sources]
opaque-torch = { workspace = true }
opaque-mlx = { workspace = true }
opaque-engine = { workspace = true }
