[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-core"
dynamic = ["version"]
description = "Opaque shared primitives: clipping, random, functional, distributed, optimizers, scheduling"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Opaque Contributors" }]
requires-python = ">=3.11,<3.13"
keywords = ["differential-privacy", "pytorch", "privacy", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "torch>=2.10.0",
    "optree>=0.17.0",
    "torchopt>=0.7.3",
]

[tool.setuptools]
# Single-file modules at the namespace root — ``find_packages`` only
# discovers sub-packages (directories with ``__init__``), so listing
# them here keeps the wheel correct.
py-modules = ["opaque.types", "opaque.pytree"]

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "opaque.clipping*",
    "opaque.random*",
    "opaque.functional*",
    "opaque.distributed*",
    "opaque.scheduling*",
    "opaque.optimizers*",
    "opaque.profiling*",
]
namespaces = true

[tool.setuptools_scm]
root = "../.."
fallback_version = "0.0.0"
git_describe_command = "git describe --dirty --tags --long --match v*"

[tool.uv]
package = true
