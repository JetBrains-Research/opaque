[workspace]
members = ["packages/opaque-accounting"]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Opaque Contributors"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/JetBrains-Research/opaque"
keywords = ["differential-privacy", "privacy", "dp-sgd"]

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
opt-level = 3
lto = true
