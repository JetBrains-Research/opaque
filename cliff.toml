# git-cliff configuration for Opaque.
# Generates release notes and CHANGELOG entries from Conventional Commits.
# See https://git-cliff.org/docs/configuration for all options.

[changelog]
header = """
# Changelog\n
<!-- markdownlint-disable MD024 -->

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif -%}
          {{ commit.message | upper_first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/JetBrains-Research/opaque/commit/{{ commit.id }}))
    {%- endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = []
commit_parsers = [
    { message = "^feat",              group = "Added"         },
    { message = "^add",               group = "Added"         },
    { message = "^fix",               group = "Fixed"         },
    { message = "^refactor",          group = "Changed"       },
    { message = "^change",            group = "Changed"       },
    { message = "^perf",              group = "Changed"       },
    { message = "^docs",              group = "Documentation" },
    { message = "^test",              group = "Tests"         },
    { message = "^ci",                group = "CI/CD"         },
    { message = "^build",             group = "CI/CD"         },
    { message = "^chore",             skip = true             },
    { message = "^style",             skip = true             },
    { message = "^delete",            group = "Removed"       },
    { body = ".*BREAKING CHANGE",     group = "Breaking"      },
    { message = ".*!:",               group = "Breaking"      },
    { message = ".*",                 group = "Other"         },
]
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
skip_tags = ""
ignore_tags = "^v[0-9]+\\.[0-9]+\\.[0-9]+-(test|dev0)$"
topo_order = false
sort_commits = "oldest"
