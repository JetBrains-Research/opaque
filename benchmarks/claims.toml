[[claim]]
id = "measured-real-fft-m5-max"
statement = "On the recorded Apple M5 Max sweep, native real FFT convolution outperformed the matched complex FFT baseline at every registered length."
classification = "benchmark"
status = "supported"
case = "accounting.fft"
decision = "Publish only as a scoped result linked to the native Rust artifact; do not generalize the range to other CPUs or lengths."

[[claim]]
id = "measured-determinism-device-divergence"
