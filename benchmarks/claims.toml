# Machine-readable decisions for numeric performance and resource claims.
# A claim with status = "supported" must have a committed result from `case`.

[[claim]]
id = "lora-trainable-share"
statement = "LoRA can make about 0.1% of a model trainable."
classification = "derived"
status = "derived"
decision = "Retain as a model-configuration illustration, not a measured memory claim. The actual share is determined by the selected adapters."
current_path = "docs/user-guide/memory-optimizations.md"
current_match = "parameters (~0.1% of model)"

[[claim]]
id = "memory-baseline-ratio"
statement = "The unoptimized per-example-gradient baseline is 1x by definition."
classification = "derived"
status = "derived"
decision = "Retain only as the normalization baseline for the symbolic memory table."
current_path = "docs/user-guide/memory-optimizations.md"
current_match = "| No optimization | O(batch_size) | 1x | |"

