classification = "benchmark"
status = "supported"
case = "engine.determinism"
decision = "Publish both device results and raw samples together because either point estimate in isolation could support a misleading general claim."

[[claim]]
id = "measured-microbatch-tradeoff-mps"
statement = "On the MPS reference case, smaller microbatches substantially reduced incremental peak memory while also reducing throughput."
classification = "benchmark"
status = "supported"
case = "clipping.microbatch"
decision = "Publish as a shape- and device-scoped memory/throughput trade-off with equivalence error, not as a universal recommended microbatch."

[[claim]]
id = "measured-adadelta-state"
statement = "For the recorded float32 parameter tree, Adadelta tensor state is 2.0 parameter-bytes without bias correction and 3.0 with correction."
classification = "benchmark"
status = "supported"
case = "optimizers.state"
decision = "Publish as exact unique tensor-storage accounting; Python-object overhead is explicitly excluded."

[[claim]]
id = "measured-moe-shape-dependence"
statement = "Both recorded MPS MoE sweeps kept grouped-GEMM slower through 64 experts and neither reproduced a 2x speedup at 128 experts."
