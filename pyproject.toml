[project]
name = "opaque"
version = "0.0.0"
description = "Functional Differential Privacy for LoRA Fine-tuning"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Opaque Contributors"}
]
requires-python = ">=3.11,<3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "dp-accounting>=0.4.0",
    "matplotlib>=3.10.7",
  "notebook>=7.4.7",
    "optree>=0.17.0",
    "torch>=2.0.0",
  "torchopt>=0.7.3",
]

[project.optional-dependencies]
examples = [
    "matplotlib>=3.10.7",
    "jupyter>=1.0.0",
  "transformers>=4.0.0",
  "datasets>=2.0.0",
  "peft>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "hypothesis>=6.0.0",  # Property-based testing
  "scipy>=1.11.0", # For statistical tests
  # tests against transformers library
  "transformers>=4.0.0",
  "datasets>=2.0.0",
  "peft>=0.7.0",
  # tests against jax
    "jax>=0.6.0",
    "jaxlib>=0.6.0",
    "jax-privacy>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",  # Auto-generate docs from docstrings
    "mkdocs-jupyter>=0.24.0", # Jupyter notebook support
]

[tool.uv.sources]
jax-privacy = { path = "../jax_privacy", editable = true }

[project.urls]
Homepage = "https://github.com/evgri243/opaque"
Documentation = "https://github.com/evgri243/opaque/tree/main/docs"
Repository = "https://github.com/evgri243/opaque"
Issues = "https://github.com/evgri243/opaque/issues"

[build-system]
requires = ["hatchling>=0.11.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opaque"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=opaque --cov-report=html --cov-report=xml --cov-report=term-missing -v -m 'not slow'"
markers = [
    "jax_validation: tests requiring JAX and JAX-Privacy for cross-framework validation",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
  "integration: marks tests as integration tests (end-to-end scenarios with real models)",
]
# Ignore JAX validation tests by default (require optional jax-validation group)
# Run with: uv run --group jax-validation pytest -m jax_validation
norecursedirs = [".git", ".tox", "dist", "build", "*.egg"]

[tool.coverage.run]
source = ["src"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

[tool.coverage.xml]
output = "coverage.xml"
