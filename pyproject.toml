[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opaque-dp"
version = "0.1.0"
description = "Differential Privacy for LoRA Fine-tuning"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Opaque Contributors"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
peft = [
    "peft>=0.7.0",
]
examples = [
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/opaque"
Documentation = "https://opaque.readthedocs.io"
Repository = "https://github.com/yourusername/opaque"
Issues = "https://github.com/yourusername/opaque/issues"

[tool.setuptools]
packages = ["opaque"]

[tool.setuptools.package-data]
opaque = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=opaque --cov-report=html --cov-report=term-missing"
