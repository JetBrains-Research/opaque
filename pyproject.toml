[tool.uv]
workspace.members = [
    "packages/opaque",
    "packages/opaque-core",
    "packages/opaque-dpsgd",
    "packages/opaque-mf",
    "packages/opaque-auditing",
    "packages/opaque-performance",
    "packages/opaque-huggingface",
    "packages/opaque-accounting",
]

[tool.uv.sources]
opaque = { workspace = true }
opaque-core = { workspace = true }
opaque-dpsgd = { workspace = true }
opaque-mf = { workspace = true }
opaque-auditing = { workspace = true }
opaque-performance = { workspace = true }
opaque-huggingface = { workspace = true }
opaque-accounting = { workspace = true }

[dependency-groups]
# Core development - linting, formatting, testing.
# Everything else (HuggingFace compat, cross-validation, optimizer bindings,
# example-script deps) lives in the relevant package's
# [project.optional-dependencies]. Run `uv sync --group dev --all-packages`
# followed by `--extra <name>` for the package extras you need, e.g.
#   uv sync --group dev --all-packages --extra huggingface --extra peft
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "scipy>=1.11.0",         # Statistical tests
]

# Documentation building
# Install with: uv sync --group docs
docs = [
  "mkdocs>=1.5.0",
  "mike>=2.1.3",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.24.0",
  "mkdocs-jupyter>=0.24.0",
]

[tool.pytest.ini_options]
# importlib mode gives each test file a unique module name based on its path,
# avoiding collisions when multiple packages share directory names (e.g.
# tests/noise/ in both opaque-dpsgd and opaque-mf).
addopts = "--import-mode=importlib"
markers = [
  "gpu: GPU sweep test (runs when CUDA is available; only mps_compatible subset runs on MPS)",
  "mps_compatible: GPU-marked test is explicitly safe to run on MPS",
  "cuda: Test requires CUDA specifically",
  "mps: Test requires Apple Metal (MPS) specifically",
  "hf_auth_required: Test requires authenticated HuggingFace access (gated/private models)",
  "slow: Test takes >5 s on CPU (calibration, model download, multi-step training)",
]
